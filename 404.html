<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>404 - Không tìm thấy trang</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/Asset/logo/logo.png">
    
    <style>
        :root {
            --bg-deep: #120e0a;    
            --primary: #4b3621;   
            --secondary: #d4b785; 
            --accent: #b08d57;    
            --light-gold: #f1e4d1; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Ngăn chọn văn bản khi chơi game */
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            touch-action: none; /* Ngăn scroll trên mobile khi vuốt game */
        }

        /* --- Hiệu ứng nền Mesh --- */
        .background-animate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(120deg, var(--bg-deep), var(--primary), var(--bg-deep));
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .light-glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(212, 183, 133, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 2;
            filter: blur(80px);
            animation: drift 20s infinite alternate;
        }

        @keyframes drift {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* --- Thẻ Glassmorphism --- */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(212, 183, 133, 0.03); 
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(212, 183, 133, 0.15);
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-text {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--light-gold) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 8px;
        }

        p {
            color: var(--secondary);
            opacity: 0.7;
            font-size: 0.9rem;
            line-height: 1.5;
            font-weight: 300;
        }

        /* --- Game Area --- */
        .game-container {
            position: relative;
            margin-bottom: 25px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            color: var(--secondary);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        canvas {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 183, 133, 0.2);
            border-radius: 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .game-overlay {
            position: absolute;
            top: 31px; /* Căn chỉnh theo canvas offset */
            left: 0;
            width: 100%;
            height: 280px; /* Bằng height của canvas */
            background: rgba(18, 14, 10, 0.8);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            transition: opacity 0.3s ease;
        }

        .game-overlay h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .game-overlay p {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Nút bấm --- */
        .btn-home {
            background: transparent;
            color: var(--secondary);
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 100px;
            border: 1px solid rgba(212, 183, 133, 0.3);
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            width: 100%;
        }

        .btn-home:hover {
            background: var(--secondary);
            color: var(--primary);
            box-shadow: 0 10px 25px rgba(212, 183, 133, 0.15);
        }

        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="background-animate"></div>
    <div class="light-glow"></div>

    <div class="glass-card">
        <div class="header-text">
            <h1>404</h1>
            <p>Trang bạn tìm không tồn tại.<br>Giải trí một chút trong lúc chờ đợi nhé?</p>
        </div>

        <div class="game-container">
            <div class="score-board">
                <span>Điểm: <span id="score">0</span></span>
                <span>Kỷ lục: <span id="highScore">0</span></span>
            </div>
            <canvas id="gameCanvas" width="280" height="280"></canvas>
            
            <div id="gameOverlay" class="game-overlay">
                <h2 id="overlayTitle">Nhấn để chơi</h2>
                <p id="overlayDesc">Dùng phím mũi tên hoặc vuốt</p>
            </div>
        </div>

        <a href="/" class="btn-home">Quay lại trang chủ</a>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const overlay = document.getElementById("gameOverlay");
        const overlayTitle = document.getElementById("overlayTitle");

        const grid = 14; 
        let count = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreElement.textContent = highScore;
        
        let isPlaying = false;
        let animationId;

        let snake = {
            x: 140,
            y: 140,
            dx: grid,
            dy: 0,
            cells: [],
            maxCells: 4
        };

        let apple = { x: 70, y: 70 };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function resetGame() {
            snake.x = 140;
            snake.y = 140;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            score = 0;
            scoreElement.textContent = score;
            placeApple();
        }

        function placeApple() {
            apple.x = getRandomInt(0, 20) * grid;
            apple.y = getRandomInt(0, 20) * grid;
        }

        function loop() {
            animationId = requestAnimationFrame(loop);
            
            // Tốc độ game (tăng số lên để rắn đi chậm lại)
            if (++count < 8) return;
            count = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            // Xử lý đụng tường (Game Over)
            if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
                gameOver();
                return;
            }

            snake.cells.unshift({ x: snake.x, y: snake.y });
            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            // Vẽ mồi (Apple) có hiệu ứng phát sáng Premium
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f1e4d1';
            ctx.fillStyle = '#f1e4d1';
            ctx.beginPath();
            ctx.arc(apple.x + grid/2, apple.y + grid/2, grid/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Reset shadow cho thân rắn
            ctx.shadowBlur = 0; 
            ctx.fillStyle = '#d4b785'; // Màu vàng cát cho thân rắn

            // Vẽ rắn
            snake.cells.forEach(function (cell, index) {
                // Làm bo tròn từng đốt của rắn
                ctx.beginPath();
                ctx.roundRect(cell.x + 1, cell.y + 1, grid - 2, grid - 2, 4);
                ctx.fill();

                // Kiểm tra ăn mồi
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10;
                    scoreElement.textContent = score;
                    placeApple();
                }

                // Kiểm tra cắn vào đuôi (Game Over)
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        gameOver();
                    }
                }
            });
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreElement.textContent = highScore;
            }

            overlayTitle.textContent = "Game Over";
            overlay.classList.remove("hidden");
        }

        function startGame() {
            if (isPlaying) return;
            resetGame();
            overlay.classList.add("hidden");
            isPlaying = true;
            requestAnimationFrame(loop);
        }

        // --- Controls: Keyboard ---
        document.addEventListener('keydown', function (e) {
            // Ngăn chặn cuộn trang bằng phím mũi tên khi đang chơi
            if(isPlaying && [37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }

            if (!isPlaying && e.code === 'Space') {
                startGame();
                return;
            }

            if (e.code === 'ArrowLeft' && snake.dx === 0) {
                snake.dx = -grid; snake.dy = 0;
            }
            else if (e.code === 'ArrowUp' && snake.dy === 0) {
                snake.dy = -grid; snake.dx = 0;
            }
            else if (e.code === 'ArrowRight' && snake.dx === 0) {
                snake.dx = grid; snake.dy = 0;
            }
            else if (e.code === 'ArrowDown' && snake.dy === 0) {
                snake.dy = grid; snake.dx = 0;
            }
        });

        // --- Controls: Swipe (Mobile) ---
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        canvas.addEventListener('touchend', function(e) {
            if (!isPlaying) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            // Xác định vuốt ngang hay dọc
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; } // Phải
                else if (dx < 0 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; } // Trái
            } else {
                if (dy > 0 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; } // Xuống
                else if (dy < 0 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; } // Lên
            }
        }, {passive: false});

        // Click vào màn hình overlay để bắt đầu
        overlay.addEventListener('click', startGame);
        canvas.addEventListener('click', () => {
            if(!isPlaying) startGame();
        });

    </script>
</body>
</html>
