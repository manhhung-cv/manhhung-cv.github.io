<!DOCTYPE html>
<html lang="vi" x-data="audioApp()" :class="theme" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioStory Pro - Trải nghiệm nghe truyện hiện đại</title>
    <!-- Tailwind & Alpine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        .oled { background-color: #000000; color: #ffffff; }
        .oled .bg-card { background-color: #0a0a0a; border: 1px solid #1f1f1f; }
        .dark { background-color: #121212; color: #e5e5e5; }
        .dark .bg-card { background-color: #1e1e1e; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#f43f5e' }
                }
            }
        }
    </script>
</head>
<body class="h-full overflow-hidden font-sans transition-colors duration-300">

    <!-- App Shell -->
    <div class="flex flex-col h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-4 py-3 border-b bg-card border-gray-800">
            <div class="flex items-center gap-2 cursor-pointer" @click="currentView = 'home'">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight">AudioStory</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-gray-800">
                    <span x-show="theme === 'light'">🌙</span>
                    <span x-show="theme === 'dark'">🌑</span>
                    <span x-show="theme === 'oled'">💡</span>
                </button>
                <template x-if="!user">
                    <button @click="login()" class="px-4 py-1.5 bg-primary text-white rounded-full text-sm font-medium">Đăng nhập</button>
                </template>
                <template x-if="user">
                    <div class="flex items-center gap-2">
                        <img :src="user.photoURL" class="w-8 h-8 rounded-full border border-primary">
                        <button @click="currentView = 'admin'" x-show="isAdmin" class="text-xs text-primary underline">Admin</button>
                    </div>
                </template>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto custom-scrollbar pb-32 px-4 md:px-8">
            
            <!-- 1. Home View -->
            <div x-show="currentView === 'home'" x-cloak class="py-6 space-y-8">
                <!-- Continue Listening -->
                <section x-show="history.length > 0">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <span>Tiếp tục nghe</span>
                        <div class="h-1 w-1 bg-primary rounded-full"></div>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="item in history.slice(0, 2)" :key="item.id">
                            <div @click="playStory(item)" class="bg-card p-3 rounded-xl flex gap-4 cursor-pointer hover:ring-1 ring-primary">
                                <img :src="item.coverUrl" class="w-20 h-20 object-cover rounded-lg shadow-lg">
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-semibold truncate" x-text="item.title"></h3>
                                    <p class="text-xs text-gray-500 mt-1" x-text="'Chương ' + item.lastChapter"></p>
                                    <div class="w-full bg-gray-700 h-1 mt-3 rounded-full overflow-hidden">
                                        <div class="bg-primary h-full" :style="`width: ${item.progress}%`"></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Discovery by Emotions/Tags -->
                <section>
                    <h2 class="text-lg font-bold mb-4">Khám phá theo tâm trạng</h2>
                    <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                        <template x-for="tag in moodTags">
                            <button @click="filterByTag(tag)" class="px-5 py-2 rounded-full bg-card border border-gray-800 whitespace-nowrap text-sm hover:bg-primary transition-colors" x-text="tag"></button>
                        </template>
                    </div>
                </section>

                <!-- New Stories -->
                <section>
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-lg font-bold">Mới cập nhật</h2>
                        <span class="text-xs text-primary">Xem tất cả</span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        <template x-for="story in stories" :key="story.id">
                            <div @click="viewStory(story)" class="space-y-2 cursor-pointer group">
                                <div class="relative aspect-[3/4] overflow-hidden rounded-xl">
                                    <img :src="story.coverUrl" class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute bottom-2 right-2 bg-black/60 px-2 py-0.5 rounded text-[10px] backdrop-blur-md">
                                        ⭐ <span x-text="story.avgRating"></span>
                                    </div>
                                </div>
                                <h3 class="text-sm font-medium line-clamp-2" x-text="story.title"></h3>
                                <p class="text-[11px] text-gray-500" x-text="story.authorName"></p>
                            </div>
                        </template>
                    </div>
                </section>
            </div>

            <!-- 2. Story Detail View -->
            <div x-show="currentView === 'storyDetail'" x-cloak class="py-6 max-w-4xl mx-auto">
                <button @click="currentView = 'home'" class="mb-6 flex items-center text-sm text-gray-400">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg> Trở về
                </button>
                <div class="flex flex-col md:flex-row gap-8">
                    <img :src="selectedStory?.coverUrl" class="w-full md:w-64 aspect-[3/4] object-cover rounded-2xl shadow-2xl">
                    <div class="flex-1 space-y-4">
                        <h1 class="text-3xl font-bold" x-text="selectedStory?.title"></h1>
                        <p class="text-primary font-medium" x-text="selectedStory?.authorName"></p>
                        <div class="flex gap-2">
                            <template x-for="tag in selectedStory?.tagIds">
                                <span class="text-[10px] px-2 py-1 bg-gray-800 rounded-md" x-text="tag"></span>
                            </template>
                        </div>
                        <p class="text-gray-400 text-sm leading-relaxed" x-text="selectedStory?.description"></p>
                        <div class="flex gap-4 pt-4">
                            <button @click="startListening(selectedStory)" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold shadow-lg shadow-rose-900/20">Nghe ngay</button>
                            <button @click="toggleFavorite(selectedStory?.id)" class="px-4 py-3 bg-card border border-gray-800 rounded-xl">
                                <span x-text="isFavorite(selectedStory?.id) ? '❤️' : '🤍'"></span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mt-12">
                    <h3 class="text-xl font-bold mb-4">Danh sách chương</h3>
                    <div class="bg-card rounded-2xl divide-y divide-gray-800 overflow-hidden">
                        <template x-for="chapter in chapters" :key="chapter.id">
                            <div @click="playChapter(chapter)" class="p-4 flex items-center justify-between hover:bg-white/5 cursor-pointer">
                                <div class="flex items-center gap-4">
                                    <span class="text-gray-600 font-mono text-sm" x-text="String(chapter.chapterNumber).padStart(2, '0')"></span>
                                    <span class="font-medium" x-text="chapter.title"></span>
                                </div>
                                <span class="text-xs text-gray-500" x-text="chapter.duration"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 3. Admin View -->
            <div x-show="currentView === 'admin'" x-cloak class="py-6">
                <h2 class="text-2xl font-bold mb-6">Hệ thống quản lý</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Form thêm truyện -->
                    <div class="bg-card p-6 rounded-2xl border border-gray-800">
                        <h3 class="font-bold mb-4">Thêm truyện mới</h3>
                        <form @submit.prevent="saveStory" class="space-y-4">
                            <input x-model="newStory.title" placeholder="Tên truyện" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <input x-model="newStory.authorName" placeholder="Tên tác giả" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <textarea x-model="newStory.description" placeholder="Mô tả" class="w-full bg-black/20 border border-gray-700 p-2 rounded"></textarea>
                            <input x-model="newStory.coverUrl" placeholder="Link ảnh bìa" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <input x-model="newStory.tagIds" placeholder="Tags (cách nhau bằng dấu phẩy)" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <button type="submit" class="w-full bg-primary py-2 rounded font-bold">Lưu truyện</button>
                        </form>
                    </div>
                    <!-- Form thêm chương -->
                    <div class="bg-card p-6 rounded-2xl border border-gray-800">
                        <h3 class="font-bold mb-4">Thêm chương (YouTube ID)</h3>
                        <form @submit.prevent="saveChapter" class="space-y-4">
                            <select x-model="newChapter.storyId" class="w-full bg-black/20 border border-gray-700 p-2 rounded text-gray-400">
                                <option value="">Chọn truyện</option>
                                <template x-for="s in stories">
                                    <option :value="s.id" x-text="s.title"></option>
                                </template>
                            </select>
                            <input x-model="newChapter.title" placeholder="Tiêu đề chương" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <input x-model="newChapter.youtubeId" placeholder="YouTube Video ID (VD: dQw4w9WgXcQ)" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <input type="number" x-model="newChapter.chapterNumber" placeholder="Số chương" class="w-full bg-black/20 border border-gray-700 p-2 rounded">
                            <button type="submit" class="w-full bg-blue-600 py-2 rounded font-bold">Lưu chương</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Mini Player & Full Player Overlay -->
        <div id="player-container" 
             class="fixed bottom-0 left-0 right-0 z-50 bg-card/80 backdrop-blur-xl border-t border-gray-800 transition-all duration-500"
             :class="isFullPlayer ? 'h-full' : 'h-20'"
             x-show="currentTrack">
            
            <!-- Drag bar for mobile -->
            <div @click="isFullPlayer = !isFullPlayer" class="h-6 w-full flex items-center justify-center cursor-pointer">
                <div class="w-12 h-1 bg-gray-700 rounded-full"></div>
            </div>

            <!-- Mini View Content -->
            <div x-show="!isFullPlayer" class="flex items-center justify-between px-4 h-14">
                <div class="flex items-center gap-3 flex-1 min-w-0" @click="isFullPlayer = true">
                    <img :src="currentTrack?.coverUrl" class="w-10 h-10 rounded shadow-lg animate-spin-slow" :class="isPlaying ? '' : 'pause-animation'">
                    <div class="min-w-0">
                        <h4 class="text-sm font-bold truncate" x-text="currentTrack?.title"></h4>
                        <p class="text-[10px] text-gray-500 truncate" x-text="currentTrack?.chapterTitle"></p>
                    </div>
                </div>
                <div class="flex items-center gap-5">
                    <button @click="togglePlay()"><span x-text="isPlaying ? '⏸️' : '▶️'" class="text-xl"></span></button>
                    <button @click="nextTrack()"><span class="text-xl">⏭️</span></button>
                </div>
            </div>

            <!-- Full Player Content -->
            <div x-show="isFullPlayer" class="px-8 flex flex-col h-full pb-10">
                <div class="flex-1 flex flex-col items-center justify-center space-y-8">
                    <img :src="currentTrack?.coverUrl" class="w-64 h-64 md:w-80 md:h-80 object-cover rounded-3xl shadow-2xl">
                    <div class="text-center space-y-2">
                        <h2 class="text-2xl font-bold" x-text="currentTrack?.title"></h2>
                        <p class="text-primary text-lg" x-text="currentTrack?.chapterTitle"></p>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="w-full max-w-md space-y-2">
                        <input type="range" min="0" :max="duration" x-model="currentTime" @input="seekTo($event.target.value)" class="w-full accent-primary h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-[10px] text-gray-500 font-mono">
                            <span x-text="formatTime(currentTime)"></span>
                            <span x-text="formatTime(duration)"></span>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="flex items-center gap-8">
                        <button @click="playbackRate = playbackRate >= 2 ? 0.5 : playbackRate + 0.25" class="w-10 text-xs font-bold text-gray-500" x-text="playbackRate + 'x'"></button>
                        <button @click="prevTrack()" class="text-2xl">⏮️</button>
                        <button @click="togglePlay()" class="w-16 h-16 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-rose-600/30">
                            <span x-text="isPlaying ? '⏸️' : '▶️'" class="text-3xl"></span>
                        </button>
                        <button @click="nextTrack()" class="text-2xl">⏭️</button>
                        <button @click="toggleSleepTimer()" class="w-10 text-xl" :class="sleepTimer ? 'text-primary' : 'text-gray-500'">⌛</button>
                    </div>
                </div>

                <!-- Extras -->
                <div class="flex justify-between items-center text-sm text-gray-400 border-t border-gray-800 pt-6">
                    <button @click="enablePiP()">📺 Picture in Picture</button>
                    <button @click="isFullPlayer = false">Đóng</button>
                </div>
            </div>
        </div>

        <!-- Youtube Hidden Container -->
        <div id="yt-player" class="hidden"></div>
    </div>

    <!-- Initialization Script -->
    <script>
        // Firebase Configuration (Replace with your actual keys)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function audioApp() {
            return {
                theme: 'dark',
                currentView: 'home',
                user: null,
                isAdmin: false,
                stories: [],
                chapters: [],
                history: [],
                selectedStory: null,
                currentTrack: null,
                isPlaying: false,
                isFullPlayer: false,
                currentTime: 0,
                duration: 0,
                playbackRate: 1,
                sleepTimer: null,
                ytPlayer: null,
                moodTags: ['Hào khí', 'Buồn man mác', 'Kịch tính', 'Rùng rợn', 'Ngôn tình'],
                
                newStory: { title: '', authorName: '', description: '', coverUrl: '', tagIds: '' },
                newChapter: { storyId: '', title: '', youtubeId: '', chapterNumber: 1 },

                init() {
                    this.loadStories();
                    this.setupAuth();
                    this.initTheme();
                },

                initTheme() {
                    this.theme = localStorage.getItem('theme') || 'dark';
                },

                toggleTheme() {
                    const themes = ['light', 'dark', 'oled'];
                    let idx = themes.indexOf(this.theme);
                    this.theme = themes[(idx + 1) % themes.length];
                    localStorage.setItem('theme', this.theme);
                },

                setupAuth() {
                    auth.onAuthStateChanged(user => {
                        this.user = user;
                        if (user) {
                            // Check admin (hardcoded for demo or check custom claims)
                            this.isAdmin = user.email === 'admin@example.com';
                            this.loadHistory();
                        }
                    });
                },

                async login() {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                },

                async loadStories() {
                    const snap = await db.collection('stories').orderBy('createdAt', 'desc').limit(12).get();
                    this.stories = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                },

                async viewStory(story) {
                    this.selectedStory = story;
                    this.currentView = 'storyDetail';
                    const snap = await db.collection('chapters')
                        .where('storyId', '==', story.id)
                        .orderBy('chapterNumber', 'asc').get();
                    this.chapters = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                },

                playChapter(chapter) {
                    this.currentTrack = {
                        storyId: this.selectedStory.id,
                        title: this.selectedStory.title,
                        coverUrl: this.selectedStory.coverUrl,
                        chapterId: chapter.id,
                        chapterTitle: chapter.title,
                        youtubeId: chapter.youtubeId,
                        chapterNumber: chapter.chapterNumber
                    };
                    this.initYoutube(chapter.youtubeId);
                },

                initYoutube(vid) {
                    if (this.ytPlayer) {
                        this.ytPlayer.loadVideoById(vid);
                    } else {
                        this.ytPlayer = new YT.Player('yt-player', {
                            height: '0',
                            width: '0',
                            videoId: vid,
                            playerVars: { 'autoplay': 1, 'controls': 0 },
                            events: {
                                'onReady': (e) => {
                                    this.isPlaying = true;
                                    this.duration = e.target.getDuration();
                                    this.updateProgress();
                                },
                                'onStateChange': (e) => {
                                    if (e.data === YT.PlayerState.PLAYING) this.isPlaying = true;
                                    if (e.data === YT.PlayerState.PAUSED) this.isPlaying = false;
                                    if (e.data === YT.PlayerState.ENDED) this.nextTrack();
                                }
                            }
                        });
                    }
                },

                togglePlay() {
                    if (this.isPlaying) {
                        this.ytPlayer.pauseVideo();
                    } else {
                        this.ytPlayer.playVideo();
                    }
                },

                updateProgress() {
                    setInterval(() => {
                        if (this.ytPlayer && this.isPlaying) {
                            this.currentTime = this.ytPlayer.getCurrentTime();
                            this.duration = this.ytPlayer.getDuration();
                            // Sync playback rate
                            if (this.ytPlayer.getPlaybackRate() !== this.playbackRate) {
                                this.ytPlayer.setPlaybackRate(this.playbackRate);
                            }
                            // Save progress every 10s
                            if (Math.floor(this.currentTime) % 10 === 0) this.saveProgress();
                        }
                    }, 1000);
                },

                seekTo(val) {
                    this.ytPlayer.seekTo(val, true);
                },

                async saveProgress() {
                    if (!this.user || !this.currentTrack) return;
                    await db.collection('listening_history').doc(this.user.uid + this.currentTrack.storyId).set({
                        userId: this.user.uid,
                        storyId: this.currentTrack.storyId,
                        title: this.currentTrack.title,
                        coverUrl: this.currentTrack.coverUrl,
                        lastChapter: this.currentTrack.chapterNumber,
                        progress: (this.currentTime / this.duration) * 100,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                },

                formatTime(sec) {
                    const h = Math.floor(sec / 3600);
                    const m = Math.floor((sec % 3600) / 60);
                    const s = Math.floor(sec % 60);
                    return `${h > 0 ? h + ':' : ''}${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
                },

                // Admin Functions
                async saveStory() {
                    const tags = this.newStory.tagIds.split(',').map(t => t.trim());
                    await db.collection('stories').add({
                        ...this.newStory,
                        tagIds: tags,
                        avgRating: 5.0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert('Đã thêm truyện!');
                    this.loadStories();
                },

                async saveChapter() {
                    await db.collection('chapters').add({
                        ...this.newChapter,
                        chapterNumber: parseInt(this.newChapter.chapterNumber),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert('Đã thêm chương!');
                }
            }
        }
    </script>
</body>
</html>
