<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --subtext: #86868b;
      --accent: #0071e3;
      --success: #30d158;
      --danger: #ff453a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 280px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 5px;
    }
    .status-dot.off {
      background: var(--danger);
    }
    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--subtext);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .domain-label {
      font-size: 11px;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .domain-name {
      font-size: 14px;
      font-weight: 600;
      word-break: break-all;
    }
    .grid-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .stat-box {
      display: flex;
      flex-direction: column;
    }
    .stat-box:last-child {
      border-left: 1px solid var(--border);
      padding-left: 8px;
    }
    .counter-label {
      font-size: 11px;
      color: var(--subtext);
    }
    .counter-val {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--subtext);
      margin-top: 5px;
    }
    .breakdown-row span:last-child {
      font-weight: 600;
      color: var(--text);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .btn.active {
      background: rgba(255, 69, 58, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">NoPP</div>
    <div>
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText" class="status-text">Bảo vệ bật</span>
    </div>
  </div>

  <div class="card">
    <div class="domain-label">Trang hiện tại</div>
    <div id="domainName" class="domain-name">Đang tải...</div>
    
    <div class="grid-stats">
      <div class="stat-box">
        <span class="counter-label">Tab hiện tại</span>
        <span id="tabBlockCount" class="counter-val">0</span>
      </div>
      <div class="stat-box">
        <span class="counter-label">Toàn bộ đã chặn</span>
        <span id="totalBlockCount" class="counter-val">0</span>
      </div>
    </div>
  </div>

  <div class="card" style="padding: 10px 12px;">
    <div class="domain-label" style="margin-bottom: 6px;">Phân loại đã chặn</div>
    <div class="breakdown-row">
      <span>Cửa sổ Pop-up:</span>
      <span id="statPopup">0</span>
    </div>
    <div class="breakdown-row">
      <span>Lớp phủ bẫy click (Overlay):</span>
      <span id="statOverlay">0</span>
    </div>
    <div class="breakdown-row">
      <span>Bẫy chuyển hướng:</span>
      <span id="statRedirect">0</span>
    </div>
  </div>

  <button id="toggleBtn" class="btn">Tắt bảo vệ trang này</button>

  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
