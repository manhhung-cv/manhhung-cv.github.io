<!DOCTYPE html>
<html lang="vi" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hunq AIO | Workspace</title>
    <meta name="description" content="Tiện ích hỗ trợ tốt cho công việc & đời sống">
    <meta name="author" content="Hunq">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="mhung.siite">
    <link rel="icon" href="/Asset/logo/logo.png">

    <meta property="og:url" content="mhung.siite">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Hunq AIO | Workspace">
    <meta property="og:description" content="Tiện ích hỗ trợ tốt cho công việc & đời sống">
    <meta property="og:image" content="/Asset/Banner/Banner.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="mhung.siite">
    <meta property="twitter:url" content="mhung.siite">
    <meta name="twitter:title" content="Hunq AIO | Workspace">
    <meta name="twitter:description" content="Tiện ích hỗ trợ tốt cho công việc & đời sống">
    <meta name="twitter:image" content="/Asset/Banner/Banner.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Hunq AIO">
    <link rel="apple-touch-icon" href="/Asset/logo/iconApps.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
        integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Addon JS -->
    <script src="./js/jszip.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        zinc: { 950: '#09090b', 900: '#121214', 800: '#1e1e20' }
                    }
                }
            }
        }
    </script>
    <!-- SortableJS cho hiệu ứng kéo thả mượt mà như iOS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    
    <style>
        /* CSS tuỳ chỉnh cho cảm giác Kéo & Thả (Drag & Drop) */
        .sortable-ghost {
            opacity: 0.3 !important;
            transform: scale(0.95) !important;
            border: 2px dashed #a1a1aa !important; /* zinc-400 */
            background: transparent !important;
        }
        .sortable-drag {
            cursor: grabbing !important;
            opacity: 1 !important;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.25) !important;
            transform: scale(1.05) rotate(2deg) !important;
            z-index: 9999 !important;
        }
        .premium-card { cursor: grab; }
        .premium-card:active { cursor: grabbing; }
        
        /* Ẩn thanh cuộn nhưng vẫn cho phép cuộn */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body
    class="bg-[#fafafa] dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors duration-500 overflow-hidden h-screen flex flex-col relative">

   <div id="capsule-dock" class="fixed left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 md:w-[96vw] md:max-w-[1200px] z-[100] transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)] flex top-4 flex-col">
        
        <div id="capsule-inner" class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-[32px] md:rounded-[20px] shadow-[0_12px_40px_rgba(0,0,0,0.08)] overflow-hidden flex flex-col pointer-events-auto w-full transition-all">
            <!-- Thanh Header Chính -->
            <header class="h-14 px-3 md:px-4 flex items-center justify-between shrink-0 relative z-20 md:gap-4">
                <!-- Vùng Trái: Logo -->
                <div class="flex items-center gap-2 z-10 shrink-0">
                    <button id="logo-btn" class="flex items-center gap-2 group focus:outline-none ml-1">
                        <div class="w-9 h-9 md:w-8 md:h-8 rounded-[14px] md:rounded-[10px] bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 flex items-center justify-center text-[12px] shadow-sm group-hover:scale-95 transition-transform">
                            <i class="fas fa-bolt"></i>
                        </div>
                        <span class="font-bold text-sm tracking-tight hidden sm:block">Hunq</span>
                    </button>
                </div>

                <!-- Vùng Giữa (MOBILE ONLY) -->
                <div id="center-dynamic-group" class="md:hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center bg-zinc-100 dark:bg-zinc-800 rounded-[16px] border border-zinc-200 dark:border-zinc-700 transition-all duration-300 shadow-sm p-1 z-10">
                    <div id="mini-tab-switch" class="flex items-center gap-1 overflow-x-auto hide-scrollbar transition-all duration-300 ease-[cubic-bezier(0.25,1,0.5,1)] max-w-[45vw] opacity-100 transform scale-100 pr-1">
                        <!-- JS Render -->
                    </div>
                    <div id="pill-divider" class="w-px h-5 bg-zinc-300 dark:bg-zinc-600 transition-all duration-300 mx-0.5"></div>
                    <button id="toggle-tabs" class="w-8 h-8 shrink-0 flex items-center justify-center rounded-[12px] bg-transparent hover:bg-white dark:hover:bg-zinc-700 transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-white" title="Mở/Đóng Tab">
                        <i class="fas fa-layer-group text-[13px]"></i>
                    </button>
                </div>

                <!-- Vùng Giữa (DESKTOP ONLY): Thanh Tab trải ngang -->
                <nav id="desktop-tab-strip" class="hidden md:flex flex-1 items-center gap-1.5 overflow-x-auto hide-scrollbar px-2">
                    <!-- JS Render -->
                </nav>

                <!-- Vùng Phải: Search & Settings & New/Close Tabs -->
                <div class="flex items-center justify-end gap-1.5 z-10 shrink-0">
                    <!-- Các nút Tab cho Desktop -->
                    <button onclick="window.closeAllTabs()" class="hidden md:flex w-8 h-8 items-center justify-center rounded-[10px] hover:bg-red-50 dark:hover:bg-red-900/20 transition-all text-zinc-400 hover:text-red-500" title="Đóng tất cả tab">
                        <i class="fas fa-trash-alt text-[12px]"></i>
                    </button>
                    <button id="new-tab-desktop-btn" class="hidden md:flex w-8 h-8 items-center justify-center rounded-[10px] hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-white mr-1" title="Tab mới">
                        <i class="fas fa-plus text-[12px]"></i>
                    </button>
                    <div class="hidden md:block h-5 w-px bg-zinc-200 dark:bg-zinc-700 mx-1"></div>
                    
                    <!-- Công cụ Chung -->
                    <button id="open-cmd" class="w-10 h-10 md:w-8 md:h-8 flex items-center justify-center rounded-[14px] md:rounded-[10px] hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-white" title="Tìm kiếm (⌘ K)">
                        <i class="fas fa-search text-[14px] md:text-[13px]"></i>
                    </button>
                    <button id="open-settings-btn" class="w-10 h-10 md:w-8 md:h-8 flex items-center justify-center rounded-[14px] md:rounded-[10px] hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-white" title="Cài đặt">
                        <i class="fas fa-cog text-[14px] md:text-[13px]"></i>
                    </button>
                </div>
            </header>

            <!-- Vùng Tab Mở Rộng (MOBILE ONLY) -->
            <div id="tab-strip-container" class="md:hidden grid grid-rows-[0fr] opacity-0 transition-all duration-400 ease-[cubic-bezier(0.25,1,0.5,1)] border-t border-zinc-100 dark:border-zinc-800/80 bg-zinc-50/80 dark:bg-zinc-900/50">
                <div class="overflow-hidden">
                    <div class="p-2.5 flex items-center gap-2">
                        <button onclick="window.openToolGlobal('home')" class="w-8 h-8 shrink-0 flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:hover:text-white hover:bg-white dark:hover:bg-zinc-800 rounded-[10px] transition-all border border-transparent hover:border-zinc-200 dark:hover:border-zinc-700 hover:shadow-sm">
                            <i class="fas fa-home text-[12px]"></i>
                        </button>
                        
                        <div class="h-4 w-px bg-zinc-200 dark:bg-zinc-700 shrink-0 mx-0.5"></div>
                        
                        <nav class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar flex-1 py-1 px-0.5 scroll-smooth" id="tab-strip"></nav>
                        
                        <div class="h-4 w-px bg-zinc-200 dark:bg-zinc-700 shrink-0 mx-0.5"></div>
                        
                        <button onclick="window.closeAllTabs()" class="w-8 h-8 shrink-0 flex items-center justify-center text-zinc-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-[10px] transition-all border border-transparent" title="Đóng tất cả tab">
                            <i class="fas fa-trash-alt text-[12px]"></i>
                        </button>
                        <button id="new-tab-btn" class="w-8 h-8 shrink-0 flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:hover:text-white hover:bg-white dark:hover:bg-zinc-800 rounded-[10px] transition-all border border-transparent hover:border-zinc-200 dark:hover:border-zinc-700 hover:shadow-sm">
                            <i class="fas fa-plus text-[12px]"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main id="app-viewport" class="flex-1 overflow-y-auto overflow-x-hidden relative scroll-smooth transition-all duration-500 pt-24">
        <div id="tab-contents-container" class="max-w-full mx-auto p-4 md:p-8"></div>

        <!-- BẮT BUỘC: Nút quay lên đầu trang (Fix lỗi null onclick) -->
        <button id="back-to-top"
            class="fixed bottom-6 right-6 w-11 h-11 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border border-zinc-200 dark:border-zinc-800 rounded-full shadow-xl flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-all transform translate-y-20 opacity-0 z-50">
            <i class="fas fa-arrow-up text-sm"></i>
        </button>
    </main>

    <!-- BẮT BUỘC: Khung tìm kiếm (Spotlight) -->
    <div id="cmd-palette"
        class="fixed inset-0 z-[100] bg-zinc-950/40 backdrop-blur-sm hidden flex items-start justify-center pt-[15vh] px-4 opacity-0 transition-opacity duration-300">
        <div
            class="w-full max-w-xl bg-white/90 dark:bg-zinc-900/90 rounded-[28px] shadow-2xl border border-zinc-200 dark:border-zinc-800 overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="flex items-center p-4 border-b border-zinc-200/50 dark:border-zinc-800/50">
                <input type="text" id="cmd-input" placeholder="Gõ tên công cụ..."
                    class="flex-1 bg-transparent border-none outline-none text-base">
            </div>
            <ul id="cmd-results" class="max-h-[50vh] overflow-y-auto py-2"></ul>
        </div>
    </div>

    <!-- BẮT BUỘC: Nơi chứa thông báo (Toasts) từ thẻ UI.js -->
    <div id="toast-container" class="fixed bottom-6 left-6 z-[110] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Cài đặt Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[200] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="absolute inset-0 bg-zinc-950/40 backdrop-blur-sm" id="settings-backdrop"></div>
        <div class="relative w-full max-w-sm bg-white dark:bg-zinc-900 rounded-[28px] p-6 shadow-2xl border border-zinc-200 dark:border-zinc-800 transform scale-95 transition-all duration-300" id="settings-content">
            
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-[18px] font-bold text-zinc-900 dark:text-white tracking-tight">Cài đặt hiển thị</h3>
                <button id="close-settings-btn" class="w-8 h-8 flex items-center justify-center rounded-[10px] bg-zinc-100 dark:bg-zinc-800 text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-colors">
                    <i class="fas fa-times text-[12px]"></i>
                </button>
            </div>
            
            <div class="space-y-1">
                <!-- Theme Settings -->
                <div class="flex items-center justify-between py-3 border-b border-zinc-100 dark:border-zinc-800">
                    <div>
                        <div class="font-semibold text-[14px] text-zinc-900 dark:text-zinc-100">Giao diện tối</div>
                        <div class="text-[12px] text-zinc-500 mt-0.5">Bật/tắt Dark mode</div>
                    </div>
                    <button id="modal-theme-toggle" class="w-11 h-6 rounded-full bg-zinc-200 dark:bg-zinc-700 relative transition-colors duration-300 focus:outline-none">
                        <div class="absolute top-1 left-1 w-4 h-4 rounded-full bg-white shadow-sm transform transition-transform duration-300 translate-x-0 dark:translate-x-5"></div>
                    </button>
                </div>

                <!-- Position Settings (Chỉ hiện thông tin trên Mobile vì Desktop luôn ở trên) -->
                <div class="flex items-center justify-between py-3 md:opacity-50 md:pointer-events-none">
                    <div>
                        <div class="font-semibold text-[14px] text-zinc-900 dark:text-zinc-100">Vị trí Capsule</div>
                        <div class="text-[12px] text-zinc-500 mt-0.5">Áp dụng trên Mobile</div>
                    </div>
                    <div class="flex bg-zinc-100 dark:bg-zinc-800 rounded-[10px] p-1 gap-1 relative">
                        <!-- Lớp background trượt -->
                        <div id="pos-slider" class="absolute top-1 bottom-1 w-[50px] bg-white dark:bg-zinc-700 rounded-lg shadow-sm transition-transform duration-300"></div>
                        <button id="pos-top-btn" class="relative w-[50px] py-1 text-[12px] font-medium transition-colors text-zinc-900 dark:text-white z-10">Trên</button>
                        <button id="pos-bottom-btn" class="relative w-[50px] py-1 text-[12px] font-medium transition-colors text-zinc-500 hover:text-zinc-900 dark:hover:text-white z-10">Dưới</button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <script type="module" src="./js/main.js"></script>
</body>

</html>
