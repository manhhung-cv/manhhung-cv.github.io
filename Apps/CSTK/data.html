<!DOCTYPE html>
<html lang="vi" class="scroll-smooth antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSTK — Kho Dữ Liệu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(5px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f5f7; /* Tone xám nhạt Apple */
            color: #1d1d1f;
        }
        .dark body { 
            background-color: #000000; 
            color: #f5f5f7;
        }
        ::-webkit-scrollbar { display: none; }
        input:focus, select:focus { outline: none; }
        
        /* Modal transition */
        .modal-active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-img-active { transform: scale(1) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- TOP NAVIGATION -->
    <nav class="sticky top-0 z-40 bg-[#f5f5f7]/80 dark:bg-black/80 backdrop-blur-xl border-b border-black/5 dark:border-white/10 w-full px-4 md:px-6 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
            
            <div class="flex items-center justify-between w-full md:w-auto gap-4">
                <h1 class="text-lg font-semibold tracking-tight">CSTK Vault</h1>
                <div class="flex items-center gap-1.5 px-2 py-0.5 bg-black/5 dark:bg-white/10 rounded-full">
                    <span id="status-dot" class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>
                    <span id="status-text" class="text-[9px] uppercase tracking-wider font-mono text-gray-500 dark:text-gray-400">SẴN SÀNG</span>
                </div>
            </div>

            <div class="flex items-center gap-1 w-full md:w-auto overflow-x-auto pb-1 md:pb-0 scroll-smooth whitespace-nowrap">
                <button onclick="triggerAction('start_auto')" class="text-[11px] font-medium px-3 py-1.5 hover:bg-black/5 dark:hover:bg-white/10 rounded-lg transition-colors text-gray-600 dark:text-gray-400">Tự động: Bật</button>
                <button onclick="triggerAction('stop_auto')" class="text-[11px] font-medium px-3 py-1.5 hover:bg-black/5 dark:hover:bg-white/10 rounded-lg transition-colors text-gray-600 dark:text-gray-400">Tự động: Tắt</button>
                <button onclick="loadData()" class="text-[11px] font-medium px-3 py-1.5 hover:bg-black/5 dark:hover:bg-white/10 rounded-lg transition-colors text-gray-600 dark:text-gray-400">Tải lại</button>
                <button onclick="triggerAction('scrape_now')" class="ml-1 text-[11px] font-semibold px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm">Cào dữ liệu</button>
                <button onclick="toggleDarkMode()" class="ml-1 p-1.5 text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/10 rounded-lg transition-colors">
                    <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
                    <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- HEADER & TOOLBAR -->
    <header class="w-full max-w-7xl mx-auto px-4 md:px-6 pt-6 pb-4">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <p class="text-[11px] font-mono text-gray-500 uppercase tracking-widest"><span id="total-count" class="font-semibold text-black dark:text-white">00</span> Dữ liệu</p>

            <div class="flex flex-row items-center gap-3 w-full md:w-auto">
                <div class="relative w-full md:w-56 bg-white dark:bg-[#1c1c1e] rounded-lg border border-black/10 dark:border-white/10 overflow-hidden shadow-sm">
                    <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tư liệu..." class="w-full bg-transparent text-[13px] pl-8 pr-3 py-1.5 text-black dark:text-white placeholder-gray-400">
                </div>
                <div class="relative w-auto bg-white dark:bg-[#1c1c1e] rounded-lg border border-black/10 dark:border-white/10 shadow-sm">
                    <select id="sortSelect" class="w-full bg-transparent text-[13px] pl-3 pr-8 py-1.5 cursor-pointer appearance-none text-black dark:text-white">
                        <option value="time_new">Mới nhất</option>
                        <option value="time_old">Cũ nhất</option>
                        <option value="az">Tên (A-Z)</option>
                        <option value="za">Tên (Z-A)</option>
                    </select>
                    <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-6 pb-20">
        <!-- Loader -->
        <div id="loader" class="hidden py-20 flex-col items-center justify-center">
            <div class="w-5 h-5 border-2 border-gray-300 border-t-blue-500 rounded-full animate-spin mb-3"></div>
            <span class="text-[10px] font-mono uppercase tracking-widest text-gray-400">Đang đồng bộ...</span>
        </div>

        <!-- Grid -->
        <div id="data-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
            <!-- Cards go here -->
        </div>
    </main>

    <!-- IMAGE MODAL (Lightbox) -->
    <div id="imgModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4" onclick="closeModal()">
        <div class="relative max-w-4xl w-full flex justify-center">
            <img id="modalImage" src="" class="max-h-[85vh] rounded-xl shadow-2xl scale-95 transition-transform duration-300 object-contain" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute -top-4 -right-4 md:-right-10 bg-white/20 hover:bg-white/40 backdrop-blur text-white p-2 rounded-full transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <script>
        /* ================= CONFIG ================= */
        const API_URL = "https://script.google.com/macros/s/AKfycbx6ZHdA8Uf0UeGV15ipndEesZy8TeTH5uU3irxdiawWDVWeCvO8vn7GyQBHQQal0e3x/exec";
        const TOKEN = "AdminPro2026";
        let appData = []; 

        /* ================= INIT ================= */
        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            loadData();
            document.getElementById('searchInput').addEventListener('input', applyFilterAndSort);
            document.getElementById('sortSelect').addEventListener('change', applyFilterAndSort);
        });

        /* ================= THEME ================= */
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        /* ================= MODAL LOGIC ================= */
        function openModal(src) {
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImage');
            img.src = src;
            modal.classList.add('modal-active');
            setTimeout(() => { img.classList.add('modal-img-active'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImage');
            img.classList.remove('modal-img-active');
            modal.classList.remove('modal-active');
            setTimeout(() => { img.src = ''; }, 300); 
        }

        /* ================= DATA ================= */
        async function loadData() {
            const loader = document.getElementById('loader');
            const grid = document.getElementById('data-grid');
            
            grid.innerHTML = "";
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            try {
                let response = await fetch(`${API_URL}?action=get_data&token=${TOKEN}`);
                let result = await response.json();
                if (result.success) {
                    appData = result.data || [];
                    applyFilterAndSort(); 
                }
            } catch (error) {
                alert("Mất kết nối với máy chủ.");
            } finally {
                loader.classList.add('hidden');
                loader.classList.remove('flex');
                checkStatus();
            }
        }

        function applyFilterAndSort() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortType = document.getElementById('sortSelect').value;

            let filteredData = appData.filter(item => {
                const title = (item.title || "").toLowerCase();
                const accountId = (item.account_id || "").toLowerCase();
                return title.includes(searchTerm) || accountId.includes(searchTerm);
            });

            filteredData.sort((a, b) => {
                let timeA = new Date(a.timestamp || 0).getTime();
                let timeB = new Date(b.timestamp || 0).getTime();
                if (sortType === 'time_new') return timeB - timeA;
                if (sortType === 'time_old') return timeA - timeB;
                if (sortType === 'az') return (a.title || "").localeCompare(b.title || "");
                if (sortType === 'za') return (b.title || "").localeCompare(a.title || "");
                return 0;
            });

            renderGrid(filteredData);
        }

        /* ================= RENDER ================= */
        function renderGrid(data) {
            const grid = document.getElementById('data-grid');
            document.getElementById('total-count').innerText = String(data.length).padStart(2, '0');
            grid.innerHTML = "";

            if (data.length === 0) {
                grid.innerHTML = `<div class='col-span-full py-16 text-center text-xs font-mono text-gray-500 uppercase'>Không có dữ liệu</div>`;
                return;
            }

            let delay = 0;
            data.forEach((item) => { 
                grid.innerHTML += createCard(item, delay); 
                delay += 30; 
            });
        }

        function createCard(item, delayMs) {
            let imgUrl = item.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600';
            let id = item.account_id || "N/A";
            let pass = item.password || "N/A"; 
            let timeStr = formatTime(item.timestamp);

            return `
                <article class="flex items-center gap-3 p-3 bg-white dark:bg-[#1c1c1e] rounded-[14px] shadow-sm border border-black/5 dark:border-white/5 opacity-0 animate-fade-in transition-shadow hover:shadow-md" style="animation-delay: ${delayMs}ms">
                    
                    <!-- Thumbnail (Ấn để xem to) -->
                    <div class="relative w-[60px] h-[60px] shrink-0 rounded-[10px] overflow-hidden cursor-zoom-in ring-1 ring-black/5 dark:ring-white/10 group" onclick="openModal('${imgUrl}')">
                        <img loading="lazy" src="${imgUrl}" alt="Thumb" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600'">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors"></div>
                    </div>
                    
                    <!-- Thông tin -->
                    <div class="flex-1 min-w-0">
                        <h3 class="text-[13px] font-semibold leading-tight truncate mb-1 text-black dark:text-white" title="${item.title}">
                            ${item.title}
                        </h3>
                        
                        <!-- Cấu trúc hiển thị 2 dòng riêng biệt -->
                        <div class="flex flex-col gap-1 text-[11.5px] font-mono text-gray-500 dark:text-gray-400 mt-1.5">
                            <div class="flex items-center gap-1.5 w-full">
                                <span class="w-[18px] text-gray-400 shrink-0">ID:</span>
                                <span class="text-blue-600 dark:text-blue-400 font-medium cursor-pointer hover:underline truncate" onclick="copyText('${id}', this)">${id}</span>
                            </div>
                            <div class="flex items-center gap-1.5 w-full">
                                <span class="w-[18px] text-gray-400 shrink-0">PW:</span>
                                <span class="text-blue-600 dark:text-blue-400 font-medium cursor-pointer hover:underline truncate" onclick="copyText('${pass}', this)">${pass}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Thời gian & Nút Visit Link -->
                    <div class="shrink-0 flex flex-col items-end gap-2 pr-1 h-full justify-between py-0.5">
                        <span class="text-[9px] font-mono text-gray-400 dark:text-gray-500 whitespace-nowrap">${timeStr}</span>
                        <a href="${item.url}" target="_blank" class="w-[26px] h-[26px] flex items-center justify-center rounded-full bg-gray-100 dark:bg-white/10 text-gray-500 dark:text-gray-300 hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 transition-colors" title="Truy cập liên kết">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                </article>
            `;
        }

        /* ================= UTILS & ACTIONS ================= */
        function formatTime(dateString) {
            if (!dateString) return "--:--";
            const d = new Date(dateString);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth()+1).padStart(2, '0')}`;
        }

        function copyText(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = element.innerText;
                element.innerText = "Đã chép!";
                element.classList.add("text-green-600", "dark:text-green-400");
                setTimeout(() => {
                    element.innerText = originalText;
                    element.classList.remove("text-green-600", "dark:text-green-400");
                }, 800);
            });
        }

        function updateStatusUI(status) {
            const statusText = document.getElementById('status-text');
            const dot = document.getElementById('status-dot');
            statusText.innerText = status;
            
            if(status === "SẴN SÀNG" || status === "IDLE") {
                dot.className = "w-1.5 h-1.5 rounded-full bg-green-500";
            } else if(status.includes("LỖI") || status.includes("mất kết nối")) {
                dot.className = "w-1.5 h-1.5 rounded-full bg-red-500";
            } else if(status.includes("ĐÃ DỪNG")) {
                dot.className = "w-1.5 h-1.5 rounded-full bg-gray-400";
            } else {
                dot.className = "w-1.5 h-1.5 rounded-full bg-blue-500 animate-ping";
            }
        }

        async function checkStatus() {
            try {
                let res = await fetch(`${API_URL}?action=get_progress&token=${TOKEN}`);
                let result = await res.json();
                if (result.success) updateStatusUI(result.current_status);
            } catch (e) {
                updateStatusUI("MẤT KẾT NỐI");
            }
        }

        async function triggerAction(action) {
            updateStatusUI("ĐANG XỬ LÝ...");
            try {
                let response = await fetch(`${API_URL}?action=${action}&token=${TOKEN}`);
                let result = await response.json();
                
                checkStatus();
                if(action === "scrape_now") {
                    let interval = setInterval(async () => {
                        await checkStatus();
                        let currentText = document.getElementById('status-text').innerText;
                        if(currentText === "DONE" || currentText === "IDLE" || currentText === "SẴN SÀNG" || currentText.includes("LỖI")) {
                            clearInterval(interval);
                            loadData(); 
                        }
                    }, 3000);
                } else {
                    alert(result.message || result.error);
                }
            } catch (e) {
                updateStatusUI("MẤT KẾT NỐI");
            }
        }
    </script>
</body>
</html>
