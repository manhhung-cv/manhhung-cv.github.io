<!DOCTYPE html>
<html lang="vi" class="dark h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" href="/Asset/logo/logo.png" />
    <link rel="apple-touch-icon" href="/Asset/logo/logo.png" sizes="150x150" />
    <meta property="og:image" content="/Asset/Banner/Banner.png" />
    <meta property="og:title" content="HunqStore" />
    <meta property="og:description" content="Thiết kế và lập trình Đinh Mạnh Hùng" />
    
    <title>Filter Adblock Manager</title>

    <!-- Parse SDK & Tailwind -->
    <script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: { 
                        bg: '#09090b', 
                        surface: '#121215',
                        panel: '#18181b',
                        border: '#27272a', 
                        primary: '#3b82f6', 
                        text: '#f4f4f5', 
                        muted: '#a1a1aa', 
                        accent: '#10b981'
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* Line Numbers Gutter */
        .editor-gutter {
            user-select: none;
            scrollbar-width: none;
        }
        .editor-gutter::-webkit-scrollbar {
            display: none;
        }

        .loader {
            border: 2px solid #27272a;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sidebar-transition {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .secured-hidden {
            display: none !important;
        }

        .secured-disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.8);
        }

        .fab-active {
            transform: scale(0.92);
            background-color: #3b82f6 !important;
            color: #ffffff !important;
        }

        /* Glassmorphic elements */
        .glass-panel {
            background: rgba(18, 18, 21, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }
    </style>
</head>

<body class="h-full flex overflow-hidden text-xs md:text-sm antialiased">

    <!-- Mobile Backdrop -->
    <div id="mobileBackdrop" onclick="toggleSidebar(false)"
        class="fixed inset-0 bg-black/70 backdrop-blur-xs z-40 hidden md:hidden opacity-0 transition-opacity duration-300">
    </div>

    <!-- SIDEBAR DRAWER -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-72 bg-surface/95 backdrop-blur-md border-r border-border flex flex-col transform -translate-x-full md:translate-x-0 md:static sidebar-transition shadow-2xl md:shadow-none">
        
        <!-- Sidebar Header -->
        <div class="h-14 flex items-center justify-between px-4 border-b border-border shrink-0">
            <div class="flex items-center gap-2.5 font-semibold text-white text-sm tracking-tight">
                <div class="relative flex items-center justify-center">
                    <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 transition-all duration-300"></div>
                    <div id="statusPulse" class="absolute w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping opacity-75"></div>
                </div>
                <span>Filter Adblock</span>
            </div>
            
            <div class="flex items-center gap-1">
                <button onclick="openCreateModal()"
                    class="action-sensitive p-1.5 text-muted hover:text-white rounded-md hover:bg-white/5 transition secured-disabled"
                    title="Tạo file mới (Admin)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button onclick="toggleSidebar(false)" class="md:hidden p-1.5 text-muted hover:text-white">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Search Box -->
        <div class="p-3 border-b border-border/50 shrink-0">
            <div class="relative flex items-center">
                <svg class="absolute left-3 text-zinc-500 pointer-events-none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" onkeyup="filterFileList()" placeholder="Lọc danh sách file..." autocomplete="off"
                    class="w-full bg-bg border border-border/80 rounded-md py-1.5 pl-8 pr-3 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-primary/80 transition">
            </div>
        </div>

        <!-- File List -->
        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="fileList">
            <div class="p-4 text-center text-xs text-muted italic flex items-center justify-center gap-2">
                <div class="loader"></div> Đang tải danh sách...
            </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-border bg-panel/50 grid grid-cols-2 gap-2 shrink-0 safe-pb">
            <button onclick="triggerImport()"
                class="action-sensitive flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium text-muted hover:text-white bg-bg border border-border/80 rounded-md hover:bg-zinc-800 transition secured-disabled">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Nhập
            </button>
            <button onclick="exportCurrentFile()"
                class="flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium text-muted hover:text-white bg-bg border border-border/80 rounded-md hover:bg-zinc-800 transition">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Xuất
            </button>
            <input type="file" id="importFile" hidden onchange="handleImport(this)">
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col min-w-0 bg-bg transition-all duration-300 relative">
        
        <!-- Header Toolbar -->
        <header class="h-14 border-b border-border flex items-center justify-between px-3 md:px-5 glass-panel sticky top-0 z-20 shrink-0">
            <!-- Left Info -->
            <div class="flex items-center gap-3 min-w-0">
                <button onclick="toggleSidebar(true)" class="md:hidden text-muted hover:text-white p-1.5 -ml-1 rounded-md hover:bg-white/5">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                
                <div class="flex flex-col min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 id="currentFileName" class="text-xs md:text-sm font-semibold text-white truncate max-w-[140px] sm:max-w-[240px] md:max-w-none">
                            Chọn file...
                        </h1>
                        
                        <div class="flex items-center gap-1">
                            <button onclick="renameCurrentFile()" id="renameBtn"
                                class="action-sensitive hidden p-1 text-muted hover:text-white secured-hidden transition rounded"
                                title="Đổi tên">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                            <button onclick="deleteCurrentFile()" id="deleteBtn"
                                class="action-sensitive hidden p-1 text-muted hover:text-red-400 secured-hidden transition rounded"
                                title="Xóa file">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 mt-0.5">
                        <span id="saveStatus" class="hidden text-[10px] text-amber-400 font-medium tracking-wide flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Chưa lưu
                        </span>
                    </div>
                </div>
            </div>

            <!-- Right Controls -->
            <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
                
                <!-- Auth Toggle Lock -->
                <button onclick="toggleAuth()" id="authBtn"
                    class="p-2 text-muted hover:text-white transition rounded-md hover:bg-white/5 border border-transparent hover:border-border"
                    title="Khóa/Mở khóa Admin">
                    <svg id="lockIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <svg id="unlockIcon" class="hidden text-emerald-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                    </svg>
                </button>

                <div class="h-4 w-[1px] bg-border mx-0.5"></div>

                <!-- Find in Editor -->
                <button onclick="toggleSearchBar()" class="p-2 text-muted hover:text-white transition rounded-md hover:bg-white/5" title="Tìm kiếm (Cmd/Ctrl + K)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <!-- Copy Link Mobile Icon -->
                <button onclick="copyLink()" class="lg:hidden p-2 text-muted hover:text-white transition rounded-md hover:bg-white/5" title="Copy URL direct">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </button>

                <!-- Desktop URL Pill -->
                <div class="hidden lg:flex items-center bg-panel border border-border rounded-md px-2.5 py-1 max-w-[200px] hover:border-zinc-700 transition">
                    <span class="text-[10px] font-mono text-zinc-500 mr-2 select-none uppercase tracking-wider">URL</span>
                    <input id="rawUrl" readonly
                        class="bg-transparent text-[11px] font-mono text-blue-400 focus:outline-none w-24 truncate cursor-pointer"
                        onclick="this.select()">
                    <button onclick="copyLink()" class="ml-1.5 text-zinc-500 hover:text-white transition">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>

                <!-- Save Action Button -->
                <button onclick="saveFilter()" id="saveBtn"
                    class="action-sensitive bg-primary text-white hover:bg-blue-600 px-3.5 py-1.5 rounded-md text-xs font-semibold transition flex items-center gap-1.5 disabled:opacity-50 h-8 ml-1 secured-disabled shadow-sm shadow-blue-500/20">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span id="saveText">Lưu</span>
                </button>
            </div>
        </header>

        <!-- Search Bar Floating Overlay -->
        <div id="searchBar"
            class="hidden absolute top-16 left-1/2 transform -translate-x-1/2 w-[92%] max-w-md bg-panel/95 backdrop-blur-md border border-border rounded-xl shadow-2xl p-2 z-30 flex gap-2">
            <div class="flex-1 relative flex items-center">
                <input type="text" id="searchInputEditor" placeholder="Tìm từ khóa hoặc dòng (:45)..."
                    class="w-full bg-bg border border-border/80 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-primary font-mono pl-7">
                <span class="absolute left-2.5 text-zinc-500 text-xs font-mono">/</span>
            </div>
            <button onclick="findNext()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-medium transition">
                Tìm
            </button>
            <button onclick="toggleSearchBar()" class="px-2.5 py-1.5 hover:bg-zinc-800 text-zinc-400 hover:text-white rounded-lg text-xs transition">
                ✕
            </button>
        </div>

        <!-- EDITOR CONTAINER -->
        <div class="flex-1 relative flex overflow-hidden group">
            
            <!-- Read Only Badge -->
            <div id="readOnlyBadge"
                class="absolute top-3 right-4 px-2.5 py-1 bg-zinc-900/90 border border-zinc-800 text-[10px] text-zinc-400 rounded-md pointer-events-none z-10 flex items-center gap-1.5 font-mono shadow-sm">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Chỉ xem (Read Only)</span>
            </div>

            <!-- Line Numbers Gutter -->
            <div id="lineNumbers" 
                class="editor-gutter w-10 md:w-12 bg-bg/50 border-r border-border/40 py-4 pr-2 text-right font-mono text-xs leading-6 text-zinc-600 select-none overflow-hidden shrink-0">
                1
            </div>

            <!-- Editor Textarea -->
            <textarea id="editor" disabled
                class="flex-1 w-full h-full bg-transparent p-4 font-mono text-xs md:text-sm leading-6 text-zinc-200 resize-none outline-none focus:bg-zinc-950/40 transition-colors disabled:cursor-not-allowed disabled:opacity-75 overflow-y-auto"
                spellcheck="false" placeholder="Chọn file để xem hoặc chỉnh sửa..." oninput="handleInput()" onscroll="syncGutterScroll()" onclick="updateCursorStats()" onkeyup="updateCursorStats()"></textarea>

            <!-- Floating Smart Navigation Widget (FAB) -->
            <button id="smartNavBtn"
                class="absolute right-5 bottom-12 w-10 h-10 bg-panel border border-border/80 rounded-full shadow-xl flex items-center justify-center text-zinc-400 hover:text-white hover:border-primary transition z-20 active:scale-95"
                title="Nhấn: Nhảy dòng | Giữ: Xuống cuối trang">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="7 13 12 18 17 13"></polyline>
                    <polyline points="7 6 12 11 17 6"></polyline>
                </svg>
            </button>

            <!-- Editor Bottom Status Bar -->
            <div class="absolute bottom-0 left-0 right-0 h-8 bg-surface/90 backdrop-blur-md border-t border-border flex items-center px-4 justify-between text-[10px] text-zinc-400 font-mono select-none z-10 safe-pb">
                <div class="flex items-center gap-4">
                    <span id="statCursor">Ln 1, Col 1</span>
                    <span id="statLines" class="text-zinc-500">L: 0</span>
                    <span id="statRules" class="text-blue-400 font-semibold">R: 0</span>
                </div>
                <div id="lastUpdateLabel" class="opacity-75 italic truncate max-w-[140px] text-right"></div>
            </div>
        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast"
        class="fixed bottom-12 left-1/2 -translate-x-1/2 md:left-auto md:right-6 md:translate-x-0 translate-y-20 opacity-0 transition-all duration-300 bg-surface/95 backdrop-blur-md border border-border text-white px-4 py-2.5 rounded-lg shadow-2xl flex items-center gap-2.5 z-[100] text-xs">
        <div id="toastIcon"></div>
        <div id="toastMsg" class="font-medium"></div>
    </div>

    <!-- MODAL: LOGIN ADMIN -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden z-[90] flex items-center justify-center px-4">
        <div class="bg-surface border border-border rounded-xl w-full max-w-xs p-5 shadow-2xl modal-content text-center">
            <div class="mx-auto w-10 h-10 bg-zinc-800/80 rounded-full flex items-center justify-center mb-3 text-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h3 class="text-base font-semibold mb-1 text-white">Đăng nhập Admin</h3>
            <p class="text-xs text-muted mb-4">Mở khóa quyền chỉnh sửa và quản lý file</p>

            <input type="text" id="emailInput" placeholder="Tên đăng nhập / Email"
                class="w-full bg-bg border border-border/80 rounded-lg px-3 py-2 text-xs text-white mb-2.5 focus:outline-none focus:border-primary">

            <input type="password" id="passwordInput" placeholder="Mật khẩu"
                class="w-full bg-bg border border-border/80 rounded-lg px-3 py-2 text-xs text-white mb-4 focus:outline-none focus:border-primary font-mono">

            <div class="flex justify-between gap-2">
                <button onclick="closeModal('loginModal')"
                    class="flex-1 px-3 py-2 text-xs text-muted hover:text-white border border-border rounded-lg transition">Hủy</button>
                <button onclick="submitLogin()"
                    class="flex-1 px-3 py-2 text-xs bg-primary text-white rounded-lg font-semibold hover:bg-blue-600 transition">Đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- MODAL: JUMP TO LINE -->
    <div id="jumpModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden z-[85] flex items-center justify-center px-4">
        <div class="bg-surface border border-border rounded-xl w-full max-w-xs p-5 shadow-2xl modal-content">
            <h3 class="text-sm font-semibold mb-3 text-white">Đi đến dòng</h3>
            <input type="number" id="jumpInput" placeholder="Nhập số dòng..."
                class="w-full bg-bg border border-border/80 rounded-lg px-3 py-2 text-xs text-white mb-4 focus:outline-none focus:border-primary font-mono">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('jumpModal')" class="px-3 py-1.5 text-xs text-muted hover:text-white">Hủy</button>
                <button onclick="submitJump()" class="px-3 py-1.5 text-xs bg-primary text-white rounded-lg font-medium">Đi tới</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CREATE FILE -->
    <div id="createModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden z-[80] flex items-center justify-center px-4">
        <div class="bg-surface border border-border rounded-xl w-full max-w-xs p-5 shadow-2xl modal-content">
            <h3 class="text-sm font-semibold mb-3 text-white">Tạo Filter mới</h3>
            <input type="text" id="newFileName" placeholder="Tên file (VD: MyFilter.txt)"
                class="w-full bg-bg border border-border/80 rounded-lg px-3 py-2 text-xs text-white mb-4 focus:outline-none focus:border-primary">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('createModal')" class="px-3 py-1.5 text-xs text-muted hover:text-white">Hủy</button>
                <button onclick="submitNewFile()" class="px-3 py-1.5 text-xs bg-primary text-white rounded-lg font-medium">Tạo</button>
            </div>
        </div>
    </div>

    <!-- MODAL: RENAME FILE -->
    <div id="renameModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden z-[80] flex items-center justify-center px-4">
        <div class="bg-surface border border-border rounded-xl w-full max-w-xs p-5 shadow-2xl modal-content">
            <h3 class="text-sm font-semibold mb-3 text-white">Đổi tên file</h3>
            <input type="text" id="renameInput"
                class="w-full bg-bg border border-border/80 rounded-lg px-3 py-2 text-xs text-white mb-4 focus:outline-none focus:border-primary">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('renameModal')" class="px-3 py-1.5 text-xs text-muted hover:text-white">Hủy</button>
                <button onclick="submitRename()" class="px-3 py-1.5 text-xs bg-primary text-white rounded-lg font-medium">Lưu</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CONFIRM DIALOG -->
    <div id="confirmModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden z-[80] flex items-center justify-center px-4">
        <div class="bg-surface border border-border rounded-xl w-full max-w-xs p-5 shadow-2xl modal-content">
            <h3 id="confirmTitle" class="text-sm font-semibold mb-1.5 text-white">Xác nhận</h3>
            <p id="confirmMsg" class="text-xs text-zinc-400 mb-5">?</p>
            <div class="flex justify-end gap-2">
                <button id="btnConfirmCancel" class="px-3 py-1.5 text-xs text-muted hover:text-white">Hủy</button>
                <button id="btnConfirmOk" class="px-3 py-1.5 text-xs bg-red-600 text-white rounded-lg font-medium">Đồng ý</button>
            </div>
        </div>
    </div>

    <script>
        // --- BACK4APP (PARSE) CONFIGURATION ---
        Parse.initialize("naPt0RL8SDlRhUkSTxeiNDNklzUjSJZXHpP6WPW4", "lNk8bOyiaUeKJiqkwuzdD73KVWpWgnsnaoX82P03");
        Parse.serverURL = 'https://parseapi.back4app.com/';

        let state = { currentFile: null, isDirty: false, files: [], contentCache: '', lastSearchIndex: -1, isUnlocked: false };
        let confirmResolver = null, longPressTimer = null;

        const els = {
            editor: document.getElementById('editor'), 
            lineNumbers: document.getElementById('lineNumbers'),
            fileList: document.getElementById('fileList'),
            fileName: document.getElementById('currentFileName'), 
            rawUrl: document.getElementById('rawUrl'),
            saveStatus: document.getElementById('saveStatus'), 
            renameBtn: document.getElementById('renameBtn'),
            deleteBtn: document.getElementById('deleteBtn'), 
            updateLabel: document.getElementById('lastUpdateLabel'),
            sidebar: document.getElementById('sidebar'), 
            backdrop: document.getElementById('mobileBackdrop'),
            searchBar: document.getElementById('searchBar'), 
            searchInput: document.getElementById('searchInputEditor'),
            smartNavBtn: document.getElementById('smartNavBtn'), 
            stats: { 
                cursor: document.getElementById('statCursor'),
                lines: document.getElementById('statLines'), 
                rules: document.getElementById('statRules') 
            },
            lockIcon: document.getElementById('lockIcon'), 
            unlockIcon: document.getElementById('unlockIcon'),
            statusDot: document.getElementById('statusDot'),
            statusPulse: document.getElementById('statusPulse'),
            readOnlyBadge: document.getElementById('readOnlyBadge'),
            sensitiveBtns: document.querySelectorAll('.action-sensitive')
        };

        async function init() {
            showToast('loading', 'Đang kết nối cơ sở dữ liệu...');
            const timeout = setTimeout(() => { 
                if (document.getElementById('toastMsg').innerText.includes('kết nối')) showToast('error', 'Kết nối mạng quá lâu'); 
            }, 10000);

            try {
                // Kiểm tra phiên đăng nhập hiện tại
                const currentUser = Parse.User.current();
                if (currentUser) {
                    setAuthMode(true);
                } else {
                    setAuthMode(false);
                }

                await loadFileList();
                clearTimeout(timeout);

                if (state.files.length > 0) {
                    const defaultFile = state.files.find(f => f.name === 'AdbFilter.txt') || state.files[0];
                    await loadFileData(defaultFile.name);
                } else {
                    hideToast();
                    els.fileList.innerHTML = '<div class="p-4 text-center text-xs text-muted italic">Chưa có dữ liệu</div>';
                    els.fileName.innerText = 'Chưa có file';
                    els.editor.value = '';
                    updateLineGutter();
                }
            } catch (e) { 
                console.error(e); 
                showToast('error', 'Lỗi khởi tạo ứng dụng'); 
            }

            setupSmartNav();
        }

        // --- AUTH LOGIC ---
        async function toggleAuth() {
            if (state.isUnlocked) {
                if (await showConfirmDialog('Đăng xuất', 'Bạn muốn đăng xuất khỏi quyền Admin?', false)) {
                    showToast('loading', 'Đang đăng xuất...');
                    try {
                        await Parse.User.logOut();
                        setAuthMode(false);
                        showToast('success', 'Đã về chế độ đọc');
                    } catch (error) { showToast('error', 'Lỗi đăng xuất'); }
                }
            } else { openModal('loginModal', 'emailInput'); }
        }

        async function submitLogin() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            if (!email || !pass) return showToast('error', 'Vui lòng điền tên và mật khẩu');

            const btn = document.querySelector('#loginModal button:last-child');
            const originalText = btn.innerText;
            btn.innerText = "Xử lý..."; btn.disabled = true;

            try {
                await Parse.User.logIn(email, pass);
                closeModal('loginModal');
                showToast('success', 'Xác thực Admin thành công');
                setAuthMode(true);
                document.getElementById('emailInput').value = '';
                document.getElementById('passwordInput').value = '';
            } catch (error) {
                console.error(error); 
                showToast('error', 'Sai tài khoản hoặc mật khẩu');
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        }

        document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });

        function setAuthMode(unlocked) {
            state.isUnlocked = unlocked;
            if (unlocked) {
                els.lockIcon.classList.add('hidden'); 
                els.unlockIcon.classList.remove('hidden');
                els.statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 transition-all duration-300 shadow-[0_0_8px_rgba(16,185,129,0.8)]";
                els.statusPulse.className = "absolute w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping opacity-75";
                els.readOnlyBadge.classList.add('hidden'); 
                els.editor.disabled = false;
                els.sensitiveBtns.forEach(b => { 
                    b.classList.remove('secured-disabled'); 
                    if ((b.id === 'renameBtn' || b.id === 'deleteBtn') && state.currentFile) b.classList.remove('secured-hidden'); 
                });
            } else {
                els.lockIcon.classList.remove('hidden'); 
                els.unlockIcon.classList.add('hidden');
                els.statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 transition-all duration-300";
                els.statusPulse.className = "absolute w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping opacity-75";
                els.readOnlyBadge.classList.remove('hidden'); 
                els.editor.disabled = true;
                els.sensitiveBtns.forEach(b => { 
                    b.classList.add('secured-disabled'); 
                    if (b.id === 'renameBtn' || b.id === 'deleteBtn') b.classList.add('secured-hidden'); 
                });
            }
        }

        // --- CORE PARSE DATABASE OPERATIONS ---
        async function loadFileList() {
            try {
                const query = new Parse.Query("AdblockFilter");
                query.ascending("name");
                const results = await query.find();

                state.files = results.map(f => ({
                    id: f.id,
                    name: f.get("name"),
                    displayTime: f.get("updatedAt").toISOString()
                }));
                renderFileList();
            } catch (error) { showToast('error', 'Lỗi tải danh sách file'); }
        }

        function filterFileList() {
            const query = document.getElementById('searchInput').value;
            renderFileList(query);
        }

        function renderFileList(filterText = '') {
            const list = state.files.filter(f => f.name.toLowerCase().includes(filterText.toLowerCase()));
            if (list.length === 0) {
                els.fileList.innerHTML = '<div class="p-3 text-center text-xs text-muted italic">Không tìm thấy file</div>';
                return;
            }
            els.fileList.innerHTML = list.map(f => `
                <div onclick="switchFile('${f.name}')" class="group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition border ${state.currentFile === f.name ? 'bg-primary/10 border-primary/30 text-white font-medium' : 'border-transparent text-zinc-400 hover:bg-white/5 hover:text-zinc-200'}">
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="text-xs truncate ${state.currentFile === f.name ? 'text-primary font-semibold' : ''}">${f.name}</div>
                        <div class="text-[10px] text-zinc-500 truncate mt-0.5">${timeAgo(f.displayTime)}</div>
                    </div>
                    <button onclick="deleteFile(event, '${f.name}')" class="action-sensitive p-1.5 text-zinc-500 hover:text-red-400 transition rounded hover:bg-white/10 ${!state.isUnlocked ? 'hidden' : ''}" title="Xóa file">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>`).join('');
        }

        async function loadFileData(name) {
            if (state.isDirty) { 
                if (!await showConfirmDialog("Chưa lưu nội dung", `Bạn có muốn bỏ các thay đổi hiện tại để chuyển file không?`, false)) return; 
            }
            toggleSidebar(false); 
            state.currentFile = name; 
            els.fileName.innerText = name;
            
            if (state.isUnlocked) { 
                els.renameBtn.classList.remove('secured-hidden'); 
                els.deleteBtn.classList.remove('secured-hidden'); 
            }

            setDirty(false); 
            const fileInfo = state.files.find(f => f.name === name); 
            els.updateLabel.innerText = fileInfo ? timeAgo(fileInfo.displayTime) : '';
            renderFileList(document.getElementById('searchInput').value);
            
            els.editor.value = "Đang tải..."; 
            els.editor.disabled = true;

            try {
                const query = new Parse.Query("AdblockFilter");
                query.equalTo("name", name);
                const doc = await query.first();

                if (doc) {
                    els.editor.disabled = !state.isUnlocked;
                    els.editor.value = doc.get("content") || "";
                    state.contentCache = els.editor.value;
                    analyzeContent();
                    updateLineGutter();
                    hideToast();

                    const parseFile = doc.get("file");
                    els.rawUrl.value = parseFile ? parseFile.url() : '';
                } else {
                    throw new Error("Không tìm thấy file");
                }
            } catch (error) {
                els.editor.value = ""; 
                showToast('error', 'Không đọc được file');
            }
        }

        async function saveFilter() {
            if (!state.currentFile || !state.isUnlocked) return;
            const content = els.editor.value;
            const btn = document.getElementById('saveBtn');

            btn.disabled = true;
            document.getElementById('saveText').innerText = "Đang lưu...";

            try {
                const query = new Parse.Query("AdblockFilter");
                query.equalTo("name", state.currentFile);
                const doc = await query.first();

                if (doc) {
                    // 1. CẬP NHẬT TEXT CONTENT
                    doc.set("content", content);

                    // 2. UPLOAD PARSE FILE
                    const safeName = getSafeFileName(state.currentFile);
                    const fileObj = new File([content], safeName, { type: 'text/plain' });
                    const parseFile = new Parse.File(safeName, fileObj);
                    await parseFile.save();

                    // 3. GẮN FILE MỚI VÀO DB
                    doc.set("file", parseFile);
                    await doc.save();

                    const now = new Date().toISOString();
                    state.contentCache = content;
                    setDirty(false);

                    const fIndex = state.files.findIndex(f => f.name === state.currentFile);
                    if (fIndex !== -1) {
                        state.files[fIndex].displayTime = now;
                        renderFileList(document.getElementById('searchInput').value);
                        els.updateLabel.innerText = "Vừa xong";
                    }

                    els.rawUrl.value = doc.get("file").url();
                    showToast('success', 'Đã lưu thay đổi thành công!');
                }
            } catch (error) {
                console.error(error);
                showToast('error', 'Lỗi trong quá trình lưu file!');
            } finally {
                btn.disabled = false;
                document.getElementById('saveText').innerText = "Lưu";
            }
        }

        // --- FILE ACTIONS ---
        function renameCurrentFile() { 
            if (state.isUnlocked) { 
                openModal('renameModal', 'renameInput'); 
                document.getElementById('renameInput').value = state.currentFile.replace('.txt', ''); 
            } 
        }

        async function submitRename() {
            let n = document.getElementById('renameInput').value.trim();
            if (!n) return closeModal('renameModal'); 
            if (!n.endsWith('.txt')) n += '.txt';
            
            closeModal('renameModal'); 
            showToast('loading', 'Đang đổi tên...');

            try {
                const query = new Parse.Query("AdblockFilter");
                query.equalTo("name", state.currentFile);
                const doc = await query.first();

                if (doc) {
                    doc.set("name", n);
                    const fileObj = new File([state.contentCache], n, { type: 'text/plain' });
                    const parseFile = new Parse.File(n, fileObj);
                    doc.set("file", parseFile);
                    await doc.save();

                    state.currentFile = n; 
                    els.fileName.innerText = n;
                    await loadFileList(); 
                    showToast('success', 'Đã đổi tên thành công');
                }
            } catch (error) { showToast('error', error.message); }
        }

        function openCreateModal() { if (state.isUnlocked) openModal('createModal', 'newFileName'); }

        async function submitNewFile() {
            let n = document.getElementById('newFileName').value.trim();
            if (!n) return;
            if (!n.endsWith('.txt')) n += '.txt';

            closeModal('createModal');
            showToast('loading', 'Đang khởi tạo file...');

            const nowStr = new Date().toISOString();
            const content = `[Adblock Plus 2.0]\n! Title: ${n}\n! Updated: ${nowStr}\n`;

            try {
                const safeName = getSafeFileName(n);
                const fileObj = new File([content], safeName, { type: 'text/plain' });
                const parseFile = new Parse.File(safeName, fileObj);
                await parseFile.save();

                const AdblockFilter = Parse.Object.extend("AdblockFilter");
                const doc = new AdblockFilter();
                doc.set("name", n);
                doc.set("content", content);
                doc.set("file", parseFile);

                await doc.save();
                await loadFileList();
                await loadFileData(n);
                showToast('success', 'Tạo file mới thành công!');
            } catch (error) {
                console.error(error);
                showToast('error', error.message);
            }
        }

        async function deleteCurrentFile() { if (!state.currentFile) return; await deleteFile(null, state.currentFile); }

        async function deleteFile(e, n) {
            if (e) e.stopPropagation(); 
            if (!state.isUnlocked) return;
            if (!await showConfirmDialog("Xóa File", `Bạn chắc chắn muốn xóa vĩnh viễn file "${n}"?`, true)) return;

            showToast('loading', 'Đang xóa...');
            const old = [...state.files];
            state.files = state.files.filter(f => f.name !== n);
            renderFileList(document.getElementById('searchInputEditor').value);

            if (state.currentFile === n) {
                state.currentFile = null; 
                els.editor.value = ''; 
                els.fileName.innerText = 'Chọn file...';
                els.renameBtn.classList.add('secured-hidden'); 
                els.deleteBtn.classList.add('secured-hidden'); 
                setDirty(false);
                updateLineGutter();
            }

            try {
                const query = new Parse.Query("AdblockFilter");
                query.equalTo("name", n);
                const doc = await query.first();
                if (doc) await doc.destroy();

                showToast('success', 'Đã xóa file');
                if (state.files.length === 0) els.fileList.innerHTML = '<div class="p-4 text-center text-xs text-muted italic">Chưa có dữ liệu</div>';
            } catch (err) { 
                state.files = old; 
                renderFileList(); 
                showToast('error', err.message); 
            }
        }

        // --- EDITOR UX: LINE NUMBERS & CURSOR ---
        function updateLineGutter() {
            const lines = els.editor.value.split('\n').length;
            let numbersHtml = '';
            for (let i = 1; i <= lines; i++) {
                numbersHtml += i + '<br>';
            }
            els.lineNumbers.innerHTML = numbersHtml;
        }

        function syncGutterScroll() {
            els.lineNumbers.scrollTop = els.editor.scrollTop;
        }

        function updateCursorStats() {
            const text = els.editor.value;
            const selStart = els.editor.selectionStart;
            const lines = text.substring(0, selStart).split('\n');
            const lineNum = lines.length;
            const colNum = lines[lines.length - 1].length + 1;
            els.stats.cursor.innerText = `Ln ${lineNum}, Col ${colNum}`;
        }

        function handleInput() { 
            setDirty(els.editor.value !== state.contentCache); 
            analyzeContent();
            updateLineGutter();
            updateCursorStats();
        }

        function analyzeContent() { 
            const lines = els.editor.value.split('\n'); 
            let rules = 0; 
            lines.forEach(l => { 
                const trimmed = l.trim();
                if (trimmed && !trimmed.startsWith('!') && !trimmed.startsWith('[')) rules++; 
            }); 
            els.stats.lines.innerText = `L: ${lines.length}`; 
            els.stats.rules.innerText = `R: ${rules}`; 
        }

        // --- SEARCH & JUMP ---
        function toggleSearchBar() { 
            els.searchBar.classList.toggle('hidden'); 
            if (!els.searchBar.classList.contains('hidden')) { 
                els.searchInput.focus(); 
                els.searchInput.select(); 
            } 
        }

        function findNext() { 
            const query = els.searchInput.value; 
            if (!query) return; 
            
            if (query.startsWith(':')) { 
                jumpToLine(parseInt(query.substring(1))); 
                return; 
            } 

            const text = els.editor.value; 
            let index = text.toLowerCase().indexOf(query.toLowerCase(), state.lastSearchIndex + 1); 
            if (index === -1) index = text.toLowerCase().indexOf(query.toLowerCase(), 0); 
            
            if (index !== -1) { 
                state.lastSearchIndex = index; 
                els.editor.focus(); 
                els.editor.setSelectionRange(index, index + query.length); 
                const textLines = text.substring(0, index).split('\n').length; 
                els.editor.scrollTop = (textLines * 24) - (els.editor.clientHeight / 2); 
                syncGutterScroll();
                updateCursorStats();
            } else {
                showToast('error', 'Không tìm thấy kết quả'); 
            }
        }

        function jumpToLine(lineNum) { 
            if (isNaN(lineNum)) return; 
            const lines = els.editor.value.split('\n'); 
            if (lineNum < 1) lineNum = 1; 
            if (lineNum > lines.length) lineNum = lines.length; 
            
            let charIndex = 0; 
            for (let i = 0; i < lineNum - 1; i++) charIndex += lines[i].length + 1; 
            
            els.editor.focus(); 
            els.editor.setSelectionRange(charIndex, charIndex); 
            els.editor.scrollTop = (lineNum * 24) - (els.editor.clientHeight / 2); 
            syncGutterScroll();
            updateCursorStats();
            showToast('success', `Đã đến dòng ${lineNum}`); 
        }

        function openJumpModal() { openModal('jumpModal', 'jumpInput'); }
        function submitJump() { 
            const val = document.getElementById('jumpInput').value; 
            if (val && !isNaN(parseInt(val))) jumpToLine(parseInt(val)); 
            closeModal('jumpModal'); 
        }

        function setupSmartNav() { 
            const btn = els.smartNavBtn; 
            const startHandler = (e) => { 
                btn.classList.add('fab-active'); 
                longPressTimer = setTimeout(() => { 
                    els.editor.scrollTop = els.editor.scrollHeight; 
                    syncGutterScroll();
                    showToast('success', 'Cuộn xuống cuối trang'); 
                    longPressTimer = null; 
                    if (navigator.vibrate) navigator.vibrate(40); 
                }, 450); 
            }; 
            
            const endHandler = (e) => { 
                btn.classList.remove('fab-active'); 
                if (longPressTimer) { 
                    clearTimeout(longPressTimer); 
                    openJumpModal(); 
                } 
            }; 

            btn.addEventListener('mousedown', startHandler); 
            btn.addEventListener('mouseup', endHandler); 
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startHandler(e); }); 
            btn.addEventListener('touchend', (e) => { e.preventDefault(); endHandler(e); }); 
            btn.addEventListener('mouseleave', () => { clearTimeout(longPressTimer); btn.classList.remove('fab-active'); }); 
        }

        // --- UTILS & HELPERS ---
        function getSafeFileName(name) {
            return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9.\-_]/g, '_');
        }

        function switchFile(name) { 
            if (state.currentFile === name) { 
                toggleSidebar(false); 
                return; 
            } 
            loadFileData(name); 
        }

        function timeAgo(d) { 
            if (!d) return 'Vừa mới'; 
            const s = Math.floor((new Date() - new Date(d)) / 1000); 
            if (s > 86400) return Math.floor(s / 86400) + "d trước"; 
            if (s > 3600) return Math.floor(s / 3600) + "h trước"; 
            if (s > 60) return Math.floor(s / 60) + "p trước"; 
            return "Vừa xong"; 
        }

        function toggleSidebar(show) { 
            if (show) { 
                els.sidebar.classList.remove('-translate-x-full'); 
                els.backdrop.classList.remove('hidden'); 
                setTimeout(() => els.backdrop.classList.remove('opacity-0'), 10); 
            } else { 
                els.sidebar.classList.add('-translate-x-full'); 
                els.backdrop.classList.add('opacity-0'); 
                setTimeout(() => els.backdrop.classList.add('hidden'), 250); 
            } 
        }

        function showConfirmDialog(title, msg, isDanger) { 
            return new Promise((resolve) => { 
                const m = document.getElementById('confirmModal'); 
                document.getElementById('confirmTitle').innerText = title; 
                document.getElementById('confirmMsg').innerText = msg; 
                document.getElementById('btnConfirmOk').className = isDanger ? "px-3.5 py-1.5 text-xs bg-red-600 hover:bg-red-500 text-white rounded-lg font-medium transition" : "px-3.5 py-1.5 text-xs bg-primary hover:bg-blue-600 text-white rounded-lg font-medium transition"; 
                m.classList.remove('hidden'); 
                confirmResolver = (r) => { 
                    m.classList.add('hidden'); 
                    resolve(r); 
                }; 
            }); 
        }

        document.getElementById('btnConfirmOk').onclick = () => confirmResolver && confirmResolver(true); 
        document.getElementById('btnConfirmCancel').onclick = () => confirmResolver && confirmResolver(false);

        function openModal(id, focus) { 
            const m = document.getElementById(id); 
            m.classList.remove('hidden'); 
            if (focus) setTimeout(() => document.getElementById(focus).focus(), 50); 
        }

        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden'); 
        }

        function setDirty(d) { 
            state.isDirty = d; 
            els.saveStatus.className = d ? "text-[10px] text-amber-400 font-medium tracking-wide flex items-center gap-1" : "hidden"; 
        }

        function showToast(type, msg) { 
            const t = document.getElementById('toast'); 
            t.classList.remove('translate-y-20', 'opacity-0'); 
            
            let iconHtml = '✔';
            if (type === 'loading') iconHtml = '<div class="loader"></div>';
            else if (type === 'error') iconHtml = '✖';

            t.style.borderColor = type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#3b82f6'); 
            document.getElementById('toastIcon').innerHTML = iconHtml; 
            document.getElementById('toastMsg').innerText = msg; 
            
            if (type !== 'loading') setTimeout(() => hideToast(), 2500); 
        }

        function hideToast() { document.getElementById('toast').classList.add('translate-y-20', 'opacity-0'); }

        function copyLink() { 
            if (els.rawUrl.value) { 
                const el = document.createElement('textarea');
                el.value = els.rawUrl.value;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast('success', 'Đã sao chép liên kết tải trực tiếp'); 
            } else { 
                showToast('error', 'Chưa có liên kết file'); 
            } 
        }

        function triggerImport() { if (state.isUnlocked) document.getElementById('importFile').click(); }

        async function handleImport(input) { 
            const file = input.files[0]; 
            if (!file) return; 
            if (state.isDirty && !await showConfirmDialog('Ghi đè file?', 'Nội dung chưa lưu hiện tại sẽ bị thay thế.', true)) return; 
            
            const r = new FileReader(); 
            r.onload = e => { 
                els.editor.value = e.target.result; 
                handleInput(); 
                showToast('success', 'Đã nhập dữ liệu từ file local'); 
            }; 
            r.readAsText(file); 
            input.value = ''; 
        }

        function exportCurrentFile() { 
            if (!state.currentFile) return showToast('error', 'Hãy chọn file trước'); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(new Blob([els.editor.value])); 
            a.download = state.currentFile; 
            a.click(); 
        }

        // Global Shortcuts
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { 
                e.preventDefault(); 
                saveFilter(); 
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { 
                e.preventDefault(); 
                toggleSearchBar(); 
            }
            if (e.key === 'Escape') { 
                closeModal('createModal'); 
                closeModal('renameModal'); 
                closeModal('confirmModal'); 
                closeModal('jumpModal'); 
                closeModal('loginModal'); 
                els.searchBar.classList.add('hidden'); 
                toggleSidebar(false); 
            }
        });

        init();
    </script>
</body>

</html>
