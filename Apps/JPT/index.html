<!DOCTYPE html>
<html lang="vi" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP Post Tracking | Minimal Premium</title>
    <meta name="description" content="Tra cứu mã vận đơn JP Post chuẩn xác, giao diện tối giản, cao cấp.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    colors: {
                        background: {
                            light: '#FAFAFA',
                            dark: '#0A0A0A'
                        },
                        surface: {
                            light: '#FFFFFF',
                            dark: '#141414'
                        },
                        border: {
                            light: '#E5E5E5',
                            dark: '#262626'
                        }
                    },
                    boxShadow: {
                        'premium': '0 4px 24px -4px rgba(0, 0, 0, 0.04), 0 2px 8px -2px rgba(0, 0, 0, 0.02)',
                        'premium-dark': '0 4px 24px -4px rgba(0, 0, 0, 0.4), 0 2px 8px -2px rgba(0, 0, 0, 0.2)',
                        'float': '0 20px 40px -10px rgba(0,0,0,0.08)',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'spin-slow': 'spin 2s linear infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        /* Minimal Scrollbar */
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        .hover-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .hover-scroll::-webkit-scrollbar-track { background: transparent; }
        .hover-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark .hover-scroll::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            scroll-behavior: smooth;
        }

        /* Auto-expanding textarea modern CSS */
        textarea {
            field-sizing: content;
            min-height: 56px;
            max-height: 200px;
            scrollbar-width: none; /* Firefox */
        }
        textarea::-webkit-scrollbar { display: none; } /* Chrome/Safari */
        textarea:focus { outline: none !important; box-shadow: none !important; }

        /* Hide scroll for history pills but allow horizontal scroll */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* Premium Input Focus Effect */
        .input-wrapper::before {
            content: "";
            position: absolute;
            inset: -1.5px;
            border-radius: inherit;
            background: linear-gradient(135deg, #a1a1aa, #e4e4e7);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .dark .input-wrapper::before {
            background: linear-gradient(135deg, #52525b, #27272a);
        }
        .input-wrapper:focus-within::before {
            opacity: 1;
        }

        /* Ping animation for active status */
        .status-ping { position: relative; }
        .status-ping::after {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid currentColor; opacity: 0.4;
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>

    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 px-5 py-2.5 rounded-full shadow-float font-medium text-sm z-50 opacity-0 pointer-events-none transition-all duration-400 translate-y-8 flex items-center gap-2.5">
        <i class="fa-solid fa-check-circle"></i> <span id="toastMsg">Thao tác thành công</span>
    </div>

    <script>
        // 1. Theme Management
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        
        function toggleTheme() {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
        
        themeBtn.addEventListener('click', toggleTheme);
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        // 2. Toast & Clipboard Utility
        let toastTimeout;
        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            
            const icon = toast.querySelector('i');
            icon.className = isError ? "fa-solid fa-circle-exclamation text-red-400" : "fa-solid fa-check-circle";
            if(isError) {
                toast.classList.add('bg-red-500', 'text-white');
                toast.classList.remove('bg-zinc-900', 'dark:bg-white', 'text-white', 'dark:text-zinc-900');
            } else {
                toast.classList.remove('bg-red-500', 'text-white');
                toast.classList.add('bg-zinc-900', 'dark:bg-white', 'text-white', 'dark:text-zinc-900');
            }
            
            toast.classList.remove('opacity-0', 'translate-y-8');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('opacity-0', 'translate-y-8'), 2500);
        };

        const copyToClipboard = async (text, msg = 'Đã sao chép') => {
            try {
                await navigator.clipboard.writeText(text);
                showToast(msg);
            } catch (err) {
                // Fallback
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); showToast(msg); } 
                catch (e) { showToast('Lỗi sao chép', true); }
                textArea.remove();
            }
        };

        window.currentGlobalData = [];
        const translationCache = JSON.parse(localStorage.getItem('jpLocationCache') || '{}');
        
        const translateDict = {
            "引受": "Đã nhận hàng", "到着": "Đã đến bưu cục", "中継": "Đang trung chuyển", "持ち出し中": "Đang đi giao",
            "お届け先にお届け済み": "Giao thành công", "ご不在のため持ち戻り": "Vắng nhà, chờ xử lý", "保管": "Đang lưu kho",
            "差出人に返送": "Hoàn trả người gửi", "転送": "Đã chuyển tiếp", "国際交換局に到着": "Đến bưu cục quốc tế",
            "国際交換局から発送": "Rời bưu cục quốc tế", "通関手続中": "Thủ tục hải quan", "窓口でお渡し": "Giao tại quầy",
            "調査中": "Đang điều tra", "発送": "Đã gửi đi", "あて所不明のため返送": "Sai địa chỉ",
            "ゆうパック": "Yu-Pack", "レターパックプラス": "Letter Pack Plus", "レターパックライト": "Letter Pack Light",
            "ゆうパケット": "Yu-Packet", "EMS": "EMS", "特定記録": "Thư đảm bảo"
        };

        const t = (text) => {
            if (!text) return ""; 
            let trimmed = text.trim(); 
            if (translateDict[trimmed]) return translateDict[trimmed];
            for (const [k, v] of Object.entries(translateDict)) { if (trimmed.includes(k)) trimmed = trimmed.replace(k, v); }
            return trimmed;
        };

        const autoTranslateLocation = async (elementId, text, trackingCode, historyIdx) => {
            const el = document.getElementById(elementId);
            if (!el || !text) return;
            const cleanText = text.trim();

            const applyUI = (translated) => {
                el.innerHTML = `<span class="font-medium text-zinc-800 dark:text-zinc-200">${translated}</span> <span class="text-xs text-zinc-400 ml-1 font-normal tracking-wide">(${cleanText})</span>`;
                const targetData = window.currentGlobalData.find(d => d.summary.code === trackingCode);
                if (targetData && targetData.history[historyIdx]) targetData.history[historyIdx].translatedOffice = translated;
            };

            if (translationCache[cleanText]) return applyUI(translationCache[cleanText]);

            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=ja|vi`);
                const data = await res.json();
                if (data.responseData && data.responseData.translatedText) {
                    translationCache[cleanText] = data.responseData.translatedText;
                    localStorage.setItem('jpLocationCache', JSON.stringify(translationCache));
                    applyUI(data.responseData.translatedText);
                } else { el.innerHTML = `<span class="font-medium">${cleanText}</span>`; }
            } catch (err) { el.innerHTML = `<span class="font-medium">${cleanText}</span>`; }
        };

        const loadHistory = () => {
            const history = JSON.parse(localStorage.getItem('jpPostHistory') || '[]');
            const hSec = document.getElementById('historySection');
            if (history.length === 0) { hSec.classList.add('hidden'); hSec.classList.remove('flex'); return; }
            hSec.classList.remove('hidden'); hSec.classList.add('flex');
            
            document.getElementById('historyList').innerHTML = history.map(item => {
                const isDelivered = item.status.includes('thành công') || item.status.includes('お届け済み');
                const dotColor = isDelivered ? 'bg-green-500' : 'bg-blue-500';
                return `
                <div class="group flex items-center px-3 py-2 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark hover:border-zinc-400 dark:hover:border-zinc-500 rounded-full cursor-pointer transition-all shrink-0 shadow-sm" onclick="reTrack('${item.code}')">
                    <div class="w-1.5 h-1.5 rounded-full ${dotColor} mr-2"></div>
                    <span class="font-mono text-xs font-semibold text-zinc-700 dark:text-zinc-200">${item.code}</span>
                    <button onclick="event.stopPropagation(); deleteHistoryItem('${item.code}')" class="ml-2 w-4 h-4 rounded-full flex items-center justify-center text-zinc-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950 transition-colors opacity-0 group-hover:opacity-100">
                        <i class="fa-solid fa-xmark text-[10px]"></i>
                    </button>
                </div>`;
            }).join('');
        };

        const saveHistory = (code, type, status) => {
            let history = JSON.parse(localStorage.getItem('jpPostHistory') || '[]');
            history = history.filter(item => item.code !== code);
            history.unshift({ code, type, status });
            if (history.length > 8) history.pop(); // Keep minimal
            localStorage.setItem('jpPostHistory', JSON.stringify(history));
            loadHistory();
        };

        window.deleteHistoryItem = (code) => {
            let history = JSON.parse(localStorage.getItem('jpPostHistory') || '[]');
            localStorage.setItem('jpPostHistory', JSON.stringify(history.filter(i => i.code !== code)));
            loadHistory();
        };

        window.clearHistory = () => { localStorage.removeItem('jpPostHistory'); loadHistory(); };
        window.reTrack = (code) => { 
            document.getElementById('trackingCode').value = code; 
            document.getElementById('trackForm').dispatchEvent(new Event('submit')); 
        };

        const PROXY_URL = 'https://cors-proxy.year-tucking-0v.workers.dev/?url=';

        const fetchHtml = async (code) => {
            const targetUrl = `https://trackings.post.japanpost.jp/services/srv/search/direct?searchKind=S002&locale=ja&reqCodeNo1=${code}`;
            const fullUrl = PROXY_URL + encodeURIComponent(targetUrl);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000); // 12s timeout
                
                const res = await fetch(fullUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (res.ok) { 
                    const html = await res.text(); 
                    if (html.includes('<html')) return html; 
                }
                throw new Error("Proxy error");
            } catch (e) {
                if (e.name === 'AbortError') throw new Error("Kết nối quá hạn. Vui lòng thử lại.");
                throw new Error("Không thể kết nối máy chủ dữ liệu. Vui lòng thử lại sau.");
            }
        };

        const parseHtml = (html) => {
            const parser = new DOMParser(); 
            const doc = parser.parseFromString(html, 'text/html');
            if (doc.querySelector('.req_error')) throw new Error("Mã không tồn tại hoặc JP Post chưa cập nhật.");
            
            const tables = doc.querySelectorAll('table.tableType01');
            let summary = {}, history = [];
            
            tables.forEach(tNode => {
                const head = tNode.querySelector('th')?.innerText;
                if (head?.includes('お問い合わせ番号')) {
                    const tds = tNode.querySelectorAll('tr')[1].querySelectorAll('td');
                    summary = { code: tds[0].innerText.trim(), type: t(tds[1].innerText) };
                }
                if (head?.includes('状態発生日')) {
                    tNode.querySelectorAll('tr').forEach((r, idx) => {
                        if (idx === 0) return;
                        const c = r.querySelectorAll('td');
                        if (c.length >= 5) {
                            history.push({ 
                                date: c[0].innerText.trim(), 
                                status: t(c[1].innerText), 
                                rawStatus: c[1].innerText.trim(), 
                                office: c[3].innerText.trim(), 
                                translatedOffice: null 
                            });
                        }
                    });
                }
            });
            
            if (history.length === 0) throw new Error("Chưa có dữ liệu lịch trình.");
            return { summary, history };
        };

        const resultsContainer = document.getElementById('resultsContainer');
        const emptyState = document.getElementById('emptyState');

        const renderSingleResult = (data) => {
            const lastStatus = data.history[data.history.length - 1].status;
            const isDelivered = data.history[data.history.length - 1].rawStatus.includes('お届け済み');
            const code = data.summary.code;
            const reversedHistory = data.history.map((h, i) => ({ ...h, originalIdx: i })).reverse();

            const statusColor = isDelivered ? 'text-green-600 dark:text-green-400' : 'text-blue-600 dark:text-blue-400';
            const statusBg = isDelivered ? 'bg-green-50 dark:bg-green-950/30' : 'bg-blue-50 dark:bg-blue-950/30';
            const dotClass = isDelivered ? 'bg-green-500' : 'bg-blue-500';
            
            const card = document.createElement('div');
            card.className = 'w-full bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark rounded-3xl p-6 sm:p-8 shadow-premium dark:shadow-premium-dark animate-slide-up relative overflow-hidden';

            card.innerHTML = `
                <!-- Top Actions -->
                <div class="absolute top-6 right-6 flex gap-2 z-10">
                    <button onclick="copyFullHistory('${code}')" class="w-8 h-8 rounded-full border border-border-light dark:border-border-dark flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors" title="Sao chép">
                        <i class="fa-regular fa-copy text-xs"></i>
                    </button>
                    <button onclick="downloadImage('${code}', this)" class="w-8 h-8 rounded-full border border-border-light dark:border-border-dark flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors" title="Lưu ảnh">
                        <i class="fa-solid fa-download text-xs"></i>
                    </button>
                </div>

                <!-- Header Info -->
                <div class="mb-8">
                    <span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-widest bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 mb-4">${data.summary.type}</span>
                    <h2 class="text-3xl font-mono font-bold text-zinc-900 dark:text-white tracking-tight mb-2">${code}</h2>
                    <div class="inline-flex items-center px-3 py-1 rounded-full ${statusBg} ${statusColor} text-sm font-semibold border border-current border-opacity-20">
                        <div class="w-1.5 h-1.5 rounded-full ${dotClass} mr-2 ${!isDelivered ? 'status-ping' : ''}"></div>
                        ${lastStatus}
                    </div>
                </div>

                <!-- Minimal Timeline -->
                <div class="relative pl-3">
                    <div class="absolute left-[11.5px] top-2 bottom-2 w-[1px] bg-border-light dark:bg-border-dark"></div>
                    
                    <div class="space-y-6 relative z-10">
                        ${reversedHistory.map((h, i) => {
                            const isLatest = i === 0;
                            const isFinish = isLatest && h.rawStatus.includes('お届け済み');
                            
                            let nodeStyle = "bg-surface-light dark:bg-surface-dark border-[2px] border-zinc-300 dark:border-zinc-600 w-3 h-3 -left-[5px] top-1.5";
                            if(isLatest) {
                                if(isFinish) nodeStyle = "bg-green-500 border-2 border-surface-light dark:border-surface-dark w-4 h-4 -left-[7px] top-1 shadow-[0_0_0_3px_rgba(34,197,94,0.2)]";
                                else nodeStyle = "bg-blue-500 border-2 border-surface-light dark:border-surface-dark w-4 h-4 -left-[7px] top-1 shadow-[0_0_0_3px_rgba(59,130,246,0.2)]";
                            }

                            return `
                            <div class="relative pl-8">
                                <div class="absolute rounded-full ${nodeStyle} transition-all"></div>
                                <div class="${isLatest ? '' : 'opacity-60 hover:opacity-100'} transition-opacity">
                                    <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between mb-0.5">
                                        <h3 class="text-sm font-semibold ${isLatest ? 'text-zinc-900 dark:text-white' : 'text-zinc-700 dark:text-zinc-300'}">${h.status}</h3>
                                        <span class="text-[11px] font-mono text-zinc-400 mt-1 sm:mt-0">${h.date}</span>
                                    </div>
                                    <div class="text-sm text-zinc-500 mt-1">
                                        <span id="loc-${code}-${h.originalIdx}">
                                            ${h.office ? `<span class="animate-pulse text-xs">Đang dịch...</span>` : '<span class="text-xs">-</span>'}
                                        </span>
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
            resultsContainer.appendChild(card);
            saveHistory(data.summary.code, data.summary.type, lastStatus);

            reversedHistory.forEach((h) => {
                if (h.office) autoTranslateLocation(`loc-${code}-${h.originalIdx}`, h.office, code, h.originalIdx);
            });
        };

        const renderErrorResult = (code, message) => {
            const card = document.createElement('div');
            card.className = 'w-full bg-red-50/50 dark:bg-red-950/10 border border-red-100 dark:border-red-900/50 rounded-2xl p-5 sm:p-6 animate-slide-up flex gap-4 items-start';
            card.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="flex-1 pt-0.5">
                    <h3 class="text-lg font-mono font-bold text-red-900 dark:text-red-200 mb-1">${code}</h3>
                    <p class="text-sm font-medium text-red-600 dark:text-red-400/80">${message}</p>
                </div>
            `;
            resultsContainer.appendChild(card);
        };

        window.copyFullHistory = (code) => {
            const d = window.currentGlobalData.find(x => x.summary.code === code);
            if (!d) return;
            const reversedHistory = [...d.history].reverse();
            let text = `📦 ${d.summary.code}\n🏷️ ${d.summary.type}\n📌 ${d.history[d.history.length - 1].status}\n\n`;
            reversedHistory.forEach(h => {
                const loc = h.translatedOffice ? `${h.translatedOffice} (${h.office})` : (h.office || '');
                text += `• ${h.date}\n  ${h.status}${loc ? ' - ' + loc : ''}\n`;
            });
            copyToClipboard(text, 'Đã chép lịch trình');
        };

        window.downloadImage = async (code, btn) => {
            const data = window.currentGlobalData.find(d => d.summary.code === code);
            if (!data) return;

            const iconHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i>';
            
            try {
                const isDark = document.documentElement.classList.contains('dark');
                const lastStatus = data.history[data.history.length - 1].status;
                const isDelivered = data.history[data.history.length - 1].rawStatus.includes('お届け済み');
                const reversedHistory = [...data.history].reverse();
                
                const wrapper = document.createElement('div');
                wrapper.className = `fixed top-[-9999px] left-[-9999px] w-[500px] z-[-100] ${isDark ? 'dark' : ''}`;
                
                // Minimal Premium Receipt Layout
                wrapper.innerHTML = `
                    <div id="export-target-${code}" class="p-8 bg-background-light dark:bg-background-dark font-sans">
                        <div class="bg-surface-light dark:bg-surface-dark rounded-3xl shadow-float border border-border-light dark:border-border-dark overflow-hidden">
                            <div class="p-8 pb-6 border-b border-border-light dark:border-border-dark">
                                <div class="flex justify-between items-center mb-6">
                                    <span class="text-[10px] font-bold tracking-widest uppercase text-zinc-400">Hunq Track</span>
                                    <span class="px-2 py-1 bg-zinc-100 dark:bg-zinc-800 rounded text-[10px] font-bold uppercase text-zinc-500">${data.summary.type}</span>
                                </div>
                                <h1 class="text-3xl font-mono font-bold text-zinc-900 dark:text-white mb-2">${code}</h1>
                                <p class="text-sm font-semibold ${isDelivered ? 'text-green-500' : 'text-blue-500'} flex items-center gap-2">
                                    <i class="fa-solid ${isDelivered ? 'fa-check' : 'fa-truck-fast'}"></i> ${lastStatus}
                                </p>
                            </div>
                            <div class="p-8 bg-background-light/50 dark:bg-background-dark/50">
                                <div class="relative pl-2">
                                    <div class="absolute left-[3.5px] top-2 bottom-2 w-[1px] bg-border-light dark:bg-border-dark"></div>
                                    <div class="space-y-5 relative z-10">
                                        ${reversedHistory.map((h, i) => {
                                            const isLatest = i === 0;
                                            const dot = isLatest ? (isDelivered ? 'bg-green-500' : 'bg-blue-500') : 'bg-zinc-300 dark:bg-zinc-600';
                                            const loc = h.translatedOffice ? `${h.translatedOffice} <span class="text-zinc-400 font-normal">(${h.office})</span>` : (h.office||'-');
                                            return `
                                            <div class="relative pl-6">
                                                <div class="absolute left-[-2.5px] top-1.5 w-2 h-2 rounded-full ring-4 ring-surface-light dark:ring-surface-dark ${dot}"></div>
                                                <div class="flex justify-between items-baseline mb-0.5">
                                                    <h3 class="text-[13px] font-bold ${isLatest ? 'text-zinc-900 dark:text-white' : 'text-zinc-600 dark:text-zinc-400'}">${h.status}</h3>
                                                    <span class="text-[10px] font-mono text-zinc-400">${h.date}</span>
                                                </div>
                                                <p class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">${loc}</p>
                                            </div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.body.appendChild(wrapper);
                await new Promise(r => setTimeout(r, 200));

                const canvas = await html2canvas(document.getElementById(`export-target-${code}`), {
                    scale: 2, useCORS: true, 
                    backgroundColor: isDark ? '#0A0A0A' : '#FAFAFA', 
                    windowWidth: 500
                });

                document.body.removeChild(wrapper);
                const a = document.createElement('a');
                a.href = canvas.toDataURL("image/png");
                a.download = `JP_Post_${code}.png`;
                a.click();

                btn.innerHTML = '<i class="fa-solid fa-check text-xs text-green-500"></i>';
                setTimeout(() => { btn.innerHTML = iconHTML; }, 2000);
            } catch (err) {
                showToast("Lỗi xuất ảnh", true);
                btn.innerHTML = iconHTML;
            }
        };

        const trackForm = document.getElementById('trackForm');
        const trackingCodeInput = document.getElementById('trackingCode');
        const submitBtn = document.getElementById('submitBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadingText = document.getElementById('loadingText');

        // 8. Auto-detect & Tab Switching Logic
        const tabBtns = document.querySelectorAll('.tab-btn');
        const courierPanels = document.querySelectorAll('.courier-panel');
        const detectedCourierUi = document.getElementById('detectedCourierUi');
        let currentTabMode = 'auto';

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetTab = btn.dataset.tab;
                currentTabMode = targetTab;
                
                // Update Tab Styles
                tabBtns.forEach(t => {
                    t.classList.remove('bg-zinc-900', 'dark:bg-white', 'text-white', 'dark:text-zinc-900', 'shadow-sm');
                    t.classList.add('text-zinc-500', 'hover:text-zinc-900', 'dark:hover:text-white');
                });
                btn.classList.remove('text-zinc-500', 'hover:text-zinc-900', 'dark:hover:text-white');
                btn.classList.add('bg-zinc-900', 'dark:bg-white', 'text-white', 'dark:text-zinc-900', 'shadow-sm');
                
                // Update Panels
                courierPanels.forEach(p => {
                    if(p.id === `panel-${targetTab}`) {
                        p.classList.remove('hidden'); p.classList.add('flex');
                    } else {
                        p.classList.add('hidden'); p.classList.remove('flex');
                    }
                });

                // Trigger detect UI if switching back to auto with text
                if (targetTab === 'auto') {
                    trackingCodeInput.dispatchEvent(new Event('input'));
                }
            });
        });

        trackingCodeInput.addEventListener('input', (e) => {
            if (currentTabMode !== 'auto') return;
            const val = e.target.value.trim().split(/[\n,\s]+/)[0]; // Get first code
            
            if (val.length >= 11 && val.length <= 13 && /^[A-Z0-9]+$/.test(val)) {
                // Mocking auto-detect for JP Post
                detectedCourierUi.innerHTML = `<span class="flex items-center gap-1.5 px-3 py-1.5 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg text-xs font-semibold animate-slide-up shadow-sm"><i class="fa-solid fa-cube opacity-80"></i> Đã nhận diện: Japan Post</span>`;
            } else if (val.length > 0) {
                detectedCourierUi.innerHTML = `<span class="text-sm font-medium text-zinc-500 dark:text-zinc-400 flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang phân tích mã...</span>`;
            } else {
                detectedCourierUi.innerHTML = `<span class="text-sm font-medium text-zinc-400 flex items-center gap-2"><i class="fa-solid fa-keyboard opacity-70"></i> Nhập hoặc dán mã để tự động nhận diện</span>`;
            }
        });

        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try { 
                const text = await navigator.clipboard.readText(); 
                if (text) {
                    trackingCodeInput.value = (trackingCodeInput.value ? trackingCodeInput.value + '\n' : '') + text.trim();
                    trackingCodeInput.dispatchEvent(new Event('input')); // Trigger auto-detect UI update
                } 
            } catch (e) { showToast("Trình duyệt chặn dán", true); }
        });

        trackForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawText = trackingCodeInput.value;
            let codes = rawText.split(/[\n,\s]+/).map(c => c.replace(/[^a-zA-Z0-9]/g, '')).filter(c => c.length >= 11);
            codes = [...new Set(codes)].slice(0, 10);

            if (codes.length === 0) {
                showToast("Vui lòng nhập mã vận đơn hợp lệ", true);
                trackingCodeInput.focus();
                return;
            }

            // UX State Updates
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            emptyState.classList.add('hidden');
            resultsContainer.innerHTML = '';
            window.currentGlobalData = [];
            
            loadingIndicator.classList.remove('hidden');
            loadingIndicator.classList.add('flex');

            for (let i = 0; i < codes.length; i++) {
                const code = codes[i];
                loadingText.innerText = `Đang xử lý ${code} (${i + 1}/${codes.length})`;
                try {
                    const htmlText = await fetchHtml(code);
                    const data = parseHtml(htmlText);
                    window.currentGlobalData.push(data);
                    renderSingleResult(data);
                } catch (err) {
                    renderErrorResult(code, err.message);
                }
            }

            loadingIndicator.classList.add('hidden');
            loadingIndicator.classList.remove('flex');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Tra cứu</span> <i class="fa-solid fa-arrow-right"></i>';
            trackingCodeInput.value = ''; // Clean up after success
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            if (window.innerWidth > 768) trackingCodeInput.focus();
        });
    </script>
</body>
</html>
