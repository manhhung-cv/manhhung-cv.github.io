<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunq JTracking | JP POST Tracking</title>
    <meta name="description" content="Tra cứu hàng loạt đơn hàng JP Post hỗ trợ Tiếng Việt. Giao diện hiện đại, nhanh chóng.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 
                            400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 
                            800: '#991b1b', 900: '#7f1d1d', 950: '#450a0a',
                        },
                        surface: {
                            light: '#f8fafc',
                            dark: '#0f172a' // slate-900
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.05)',
                        'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        body { -webkit-tap-highlight-color: transparent; }
        textarea:focus { outline: none !important; box-shadow: none !important; }

        /* Animations */
        .fade-slide-up { animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .ping-dot { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(currentColor, 0.4); }
            70% { box-shadow: 0 0 0 4px rgba(currentColor, 0); }
            100% { box-shadow: 0 0 0 0 rgba(currentColor, 0); }
        }

        /* Hide scrollbar for layout but allow scroll */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-surface-light dark:bg-surface-dark text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300 antialiased overflow-x-hidden">

    <!-- SPLIT LAYOUT CONTAINER -->
    <div class="flex flex-col lg:flex-row h-screen w-full">

        <!-- L E F T   P A N E L (CONTROLS) -->
        <aside class="w-full lg:w-[420px] lg:h-screen flex flex-col bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800 z-20 shrink-0">
            
            <!-- Header -->
            <div class="p-6 pb-4 flex justify-between items-center bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                        <i class="fa-solid fa-box-open text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-none">Hunq JTracking</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1 uppercase tracking-wider">JP Post Tool</p>
                    </div>
                </div>
                <button id="themeToggle" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-500 dark:hover:text-brand-400 transition-all flex items-center justify-center">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
                </button>
            </div>

            <!-- Scrollable Control Area -->
            <div class="flex-1 overflow-y-auto p-6 pt-2 hide-scroll flex flex-col gap-8">
                
                <!-- Main Form -->
                <form id="trackForm" class="flex flex-col gap-5">
                    
                    <!-- Input Area -->
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-brand-500 to-brand-300 rounded-3xl blur opacity-0 group-focus-within:opacity-30 transition duration-500"></div>
                        <div class="relative bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-3xl overflow-hidden focus-within:border-brand-500 dark:focus-within:border-brand-500 transition-colors">
                            <textarea id="trackingCode" rows="4"
                                placeholder="Nhập mã vận đơn (JP Post)...&#10;Mỗi mã một dòng hoặc cách nhau dấu phẩy.&#10;Hỗ trợ tối đa 10 mã cùng lúc."
                                class="w-full p-5 bg-transparent border-none text-sm font-mono placeholder-slate-400 text-slate-900 dark:text-white resize-none leading-relaxed"></textarea>
                            
                            <div class="absolute bottom-3 right-3 flex gap-2">
                                <button type="button" id="pasteBtn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 text-slate-500 hover:text-brand-500 shadow-sm border border-slate-200 dark:border-slate-700 transition-colors" title="Dán mã">
                                    <i class="fa-solid fa-clipboard text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Server Settings -->
                    <div class="bg-slate-50 dark:bg-slate-950 rounded-3xl p-4 border border-slate-200 dark:border-slate-800">
                        <div class="flex items-center justify-between mb-3 px-1">
                            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest"><i class="fa-solid fa-network-wired mr-1.5"></i>Định tuyến mạng</span>
                            <button type="button" onclick="pingServers()" class="text-[10px] bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-2 py-1 rounded-lg text-slate-600 dark:text-slate-400 transition-colors"><i class="fa-solid fa-rotate-right mr-1"></i>Đo lại</button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-1.5 bg-slate-200/50 dark:bg-slate-800/50 p-1.5 rounded-2xl">
                            <!-- Auto -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="serverMode" value="auto" class="peer sr-only" checked>
                                <div class="h-14 flex flex-col items-center justify-center rounded-xl text-slate-500 peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-sm transition-all relative z-10">
                                    <span class="text-xs font-bold">Auto</span>
                                    <span class="text-[9px] opacity-0 mt-0.5">0ms</span>
                                </div>
                            </label>
                            <!-- S1 -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="serverMode" value="0" class="peer sr-only">
                                <div class="h-14 flex flex-col items-center justify-center rounded-xl text-slate-500 peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-sm transition-all relative z-10">
                                    <span class="text-xs font-bold">S1</span>
                                    <span id="ping-s0" class="text-[9px] font-mono mt-0.5">...</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" class="w-full h-14 bg-brand-500 hover:bg-brand-600 text-white rounded-3xl font-bold text-sm tracking-wide shadow-lg shadow-brand-500/25 transition-all flex items-center justify-center gap-2">
                        <span>Tra cứu ngay</span> <i class="fa-solid fa-arrow-right-long opacity-80"></i>
                    </button>
                </form>

                <!-- History Section -->
                <div id="historySection" class="hidden flex-col gap-3">
                    <div class="flex justify-between items-center px-1">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Lịch sử</span>
                        <button onclick="clearHistory()" class="text-[10px] text-red-500 hover:text-red-600 font-medium transition-colors">Xóa hết</button>
                    </div>
                    <div id="historyList" class="flex flex-col gap-2"></div>
                </div>

            </div>
        </aside>

        <!-- R I G H T   P A N E L (RESULTS) -->
        <main class="flex-1 h-full overflow-y-auto bg-surface-light dark:bg-surface-dark relative w-full hide-scroll">
            
            <div class="max-w-4xl mx-auto p-4 md:p-8 lg:p-10 min-h-full flex flex-col">
                
                <!-- Loading State -->
                <div id="loadingIndicator" class="hidden mt-10 p-6 bg-white/50 dark:bg-slate-900/50 backdrop-blur rounded-3xl border border-slate-200/50 dark:border-slate-800/50 shadow-glass dark:shadow-glass-dark text-center">
                    <div class="w-12 h-12 rounded-full border-4 border-brand-500/30 border-t-brand-500 animate-spin mx-auto mb-4"></div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-1">Đang kết nối hệ thống</h3>
                    <p id="loadingText" class="text-sm text-slate-500 font-mono">Đang xử lý...</p>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center opacity-50 mt-20 lg:mt-0">
                    <div class="w-24 h-24 mb-6 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-400 dark:text-slate-600 text-4xl">
                        <i class="fa-solid fa-magnifying-glass-location"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">Chưa có dữ liệu</h2>
                    <p class="text-sm text-slate-500 text-center mt-2 max-w-xs">Nhập mã vận đơn ở bảng điều khiển bên trái để bắt đầu tra cứu thông tin.</p>
                </div>

                <!-- Results Container -->
                <div id="resultsContainer" class="flex flex-col gap-8 pb-20"></div>

            </div>
        </main>
    </div>

    <!-- T O A S T   N O T I F I C A T I O N -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-2xl shadow-2xl font-medium text-sm z-50 opacity-0 pointer-events-none transition-all duration-300 translate-y-4 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-green-400 dark:text-green-500"></i> <span id="toastMsg">Đã sao chép</span>
    </div>

    <script>
        // --- 1. THEME MANAGEMENT ---
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        
        function toggleTheme() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        
        themeBtn.addEventListener('click', toggleTheme);
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        // --- 2. TOAST UTILITY ---
        let toastTimeout;
        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.querySelector('i').className = isError ? "fa-solid fa-circle-xmark text-red-500" : "fa-solid fa-circle-check text-green-400 dark:text-green-500";
            toast.classList.remove('opacity-0', 'translate-y-4');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 2500);
        };

        const copyToClipboard = (text, msg = 'Đã sao chép') => {
            navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => showToast('Lỗi sao chép', true));
        };

        // --- 3. TRANSLATION CACHE & LOGIC ---
        window.currentGlobalData = [];
        const translationCache = JSON.parse(localStorage.getItem('jpLocationCache') || '{}');
        
        const translateDict = {
            "引受": "Đã nhận hàng", "到着": "Đã đến bưu cục", "中継": "Đang trung chuyển", "持ち出し中": "Đang đi giao",
            "お届け先にお届け済み": "Giao hàng thành công", "ご不在のため持ち戻り": "Vắng nhà, chờ xử lý", "保管": "Đang lưu kho",
            "差出人に返送": "Hoàn trả người gửi", "転送": "Đã chuyển tiếp", "国際交換局に到着": "Đến bưu cục quốc tế",
            "国際交換局から発送": "Rời bưu cục quốc tế", "通関手続中": "Thủ tục hải quan", "窓口でお渡し": "Giao tại quầy",
            "調査中": "Đang điều tra", "発送": "Đã gửi đi", "あて所不明のため返送": "Sai địa chỉ",
            "ゆうパック": "Yu-Pack", "レターパックプラス": "Letter Pack Plus", "レターパックライト": "Letter Pack Light",
            "ゆうパケット": "Yu-Packet", "EMS": "EMS", "特定記録": "Thư đảm bảo (Tokutei)"
        };

        const t = (text) => {
            if (!text) return ""; const trimmed = text.trim(); if (translateDict[trimmed]) return translateDict[trimmed];
            let res = trimmed; for (const [k, v] of Object.entries(translateDict)) { if (res.includes(k)) res = res.replace(k, v); }
            return res;
        };

        const autoTranslateLocation = async (elementId, text, trackingCode, historyIdx) => {
            const el = document.getElementById(elementId);
            if (!el || !text) return;
            const cleanText = text.trim();

            const applyUI = (translated) => {
                el.innerHTML = `<span class="font-bold text-slate-800 dark:text-slate-200">${translated}</span> <span class="text-xs text-slate-400 font-normal ml-1">(${cleanText})</span>`;
                const targetData = window.currentGlobalData.find(d => d.summary.code === trackingCode);
                if (targetData && targetData.history[historyIdx]) targetData.history[historyIdx].translatedOffice = translated;
            };

            if (translationCache[cleanText]) return applyUI(translationCache[cleanText]);

            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=ja|vi`);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    const translated = data.responseData.translatedText;
                    translationCache[cleanText] = translated;
                    localStorage.setItem('jpLocationCache', JSON.stringify(translationCache));
                    applyUI(translated);
                } else { el.innerHTML = `<span class="font-bold">${cleanText}</span>`; }
            } catch (err) { el.innerHTML = `<span class="font-bold">${cleanText}</span>`; }
        };

        // --- 4. HISTORY MANAGEMENT ---
        const loadHistory = () => {
            const history = JSON.parse(localStorage.getItem('jpPostHistory') || '[]');
            const hSec = document.getElementById('historySection');
            if (history.length === 0) { hSec.classList.add('hidden'); hSec.classList.remove('flex'); return; }
            hSec.classList.remove('hidden'); hSec.classList.add('flex');
            
            document.getElementById('historyList').innerHTML = history.map(item => {
                const isDelivered = item.status.includes('thành công') || item.status.includes('お届け済み');
                const dotColor = isDelivered ? 'bg-green-500 shadow-green-500/50' : 'bg-brand-500 shadow-brand-500/50';
                return `
                <div class="group flex items-center p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-brand-300 dark:hover:border-brand-700 rounded-2xl cursor-pointer transition-all" onclick="reTrack('${item.code}')">
                    <div class="w-2 h-2 rounded-full ${dotColor} shadow-[0_0_8px] mr-3 shrink-0"></div>
                    <div class="flex-1 min-w-0">
                        <p class="font-mono text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${item.code}</p>
                        <p class="text-[10px] text-slate-500 truncate">${item.type} • ${item.status}</p>
                    </div>
                    <div class="flex opacity-0 group-hover:opacity-100 transition-opacity gap-1" onclick="event.stopPropagation()">
                        <button onclick="copyToClipboard('${item.code}', 'Đã chép mã')" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-800 hover:text-brand-500 flex items-center justify-center text-slate-400 shadow-sm"><i class="fa-regular fa-copy text-[10px]"></i></button>
                        <button onclick="deleteHistoryItem('${item.code}')" class="w-7 h-7 rounded-lg bg-white dark:bg-slate-800 hover:text-red-500 flex items-center justify-center text-slate-400 shadow-sm"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                    </div>
                </div>`;
            }).join('');
        };

        const saveHistory = (code, type, status) => {
            let history = JSON.parse(localStorage.getItem('jpPostHistory') || '[]');
            history = history.filter(item => item.code !== code);
            history.unshift({ code, type, status });
            if (history.length > 7) history.pop();
            localStorage.setItem('jpPostHistory', JSON.stringify(history));
            loadHistory();
        };

        window.deleteHistoryItem = (code) => {
            let history = JSON.parse(localStorage.getItem('jpPostHistory') || '[]');
            localStorage.setItem('jpPostHistory', JSON.stringify(history.filter(i => i.code !== code)));
            loadHistory();
        };

        window.clearHistory = () => { localStorage.removeItem('jpPostHistory'); loadHistory(); };
        window.reTrack = (code) => { 
            document.getElementById('trackingCode').value = code; 
            document.getElementById('trackForm').dispatchEvent(new Event('submit')); 
            if(window.innerWidth < 1024) window.scrollTo({top: document.getElementById('resultsContainer').offsetTop, behavior: 'smooth'});
        };

        // --- 5. NETWORK & PROXIES ---
        const proxiesConfig = [
            { id: '0', name: 'S1', getUrl: (url) => `https://cors-proxy.year-tucking-0v.workers.dev/?url=${encodeURIComponent(url)}` },
           ];

        window.pingServers = async () => {
            const testUrl = 'https://mhung.site/404';
            for (let proxy of proxiesConfig) {
                const pingEl = document.getElementById(`ping-s${proxy.id}`);
                if (!pingEl) continue;
                pingEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-slate-400"></i>';
                pingEl.className = "text-[9px] mt-0.5";
                const start = performance.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000); 
                    const res = await fetch(proxy.getUrl(testUrl), { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (res.ok) {
                        const time = Math.round(performance.now() - start);
                        let colorClass = time < 1500 ? 'text-green-500' : (time < 3000 ? 'text-yellow-600 dark:text-yellow-500' : 'text-red-500');
                        pingEl.innerHTML = `${time}ms`;
                        pingEl.className = `text-[9px] font-mono font-bold mt-0.5 ${colorClass}`;
                    } else { throw new Error('fail'); }
                } catch (e) {
                    pingEl.innerHTML = 'Fail';
                    pingEl.className = "text-[9px] font-bold mt-0.5 text-red-500";
                }
            }
        };

        const fetchHtml = async (targetUrl, mode) => {
            let tries = (mode === 'auto') ? proxiesConfig : [proxiesConfig.find(p => p.id === mode)];
            for (let p of tries) {
                if(!p) continue;
                try {
                    const res = await fetch(p.getUrl(targetUrl));
                    if (res.ok) { const html = await res.text(); if (html.includes('<html')) return html; }
                } catch (e) {}
            }
            throw new Error("Lỗi Server. Vui lòng đổi máy chủ khác (S1, S2, S3, S4, S5) trong Định tuyến mạng.");
        };

        const parseHtml = (html) => {
            const parser = new DOMParser(); 
            const doc = parser.parseFromString(html, 'text/html');
            if (doc.querySelector('.req_error')) throw new Error("Không tìm thấy mã hoặc JP Post chưa cập nhật.");
            
            const tables = doc.querySelectorAll('table.tableType01');
            let summary = {}, history = [];
            
            tables.forEach(tNode => {
                const head = tNode.querySelector('th')?.innerText;
                if (head?.includes('お問い合わせ番号')) {
                    const tds = tNode.querySelectorAll('tr')[1].querySelectorAll('td');
                    summary = { code: tds[0].innerText.trim(), type: t(tds[1].innerText) };
                }
                if (head?.includes('状態発生日')) {
                    tNode.querySelectorAll('tr').forEach((r, idx) => {
                        if (idx === 0) return;
                        const c = r.querySelectorAll('td');
                        if (c.length >= 5) {
                            history.push({ 
                                date: c[0].innerText.trim(), 
                                status: t(c[1].innerText), 
                                rawStatus: c[1].innerText.trim(), 
                                office: c[3].innerText.trim(), 
                                translatedOffice: null 
                            });
                        }
                    });
                }
            });
            
            if (history.length === 0) {
                throw new Error("Không tìm thấy thông tin hoặc JP Post chưa cập nhật.");
            }
            
            return { summary, history };
        };

        // --- 6. RENDER UI ---
        const resultsContainer = document.getElementById('resultsContainer');
        const emptyState = document.getElementById('emptyState');

        const renderSingleResult = (data) => {
            const lastStatus = data.history[data.history.length - 1].status;
            const isDelivered = data.history[data.history.length - 1].rawStatus.includes('お届け済み');
            const code = data.summary.code;
            const reversedHistory = data.history.map((h, i) => ({ ...h, originalIdx: i })).reverse();

            const badgeClass = isDelivered 
                ? 'bg-green-100 text-green-700 dark:bg-green-500/20 dark:text-green-400 border-green-200 dark:border-green-500/30' 
                : 'bg-brand-100 text-brand-700 dark:bg-brand-500/20 dark:text-brand-400 border-brand-200 dark:border-brand-500/30';
            
            const card = document.createElement('div');
            card.className = 'bg-white dark:bg-slate-900 rounded-3xl shadow-glass dark:shadow-glass-dark border border-slate-200 dark:border-slate-800 overflow-hidden fade-slide-up relative';

            card.innerHTML = `
                <!-- Top Actions -->
                <div class="absolute top-4 right-4 flex gap-2 z-10">
                    <button onclick="copyFullHistory('${code}')" class="w-10 h-10 rounded-2xl bg-slate-100/80 dark:bg-slate-800/80 backdrop-blur hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors shadow-sm flex items-center justify-center tooltip-btn" title="Sao chép toàn bộ">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                    <button onclick="downloadImage('${code}', this)" class="w-10 h-10 rounded-2xl bg-brand-50 hover:bg-brand-100 dark:bg-brand-500/10 dark:hover:bg-brand-500/20 text-brand-600 dark:text-brand-400 transition-colors shadow-sm flex items-center justify-center tooltip-btn" title="Xuất ảnh minh hoạ">
                        <i class="fa-solid fa-image"></i>
                    </button>
                </div>

                <!-- Header Banner -->
                <div class="p-6 md:p-8 bg-gradient-to-b from-slate-50 to-white dark:from-slate-900/50 dark:to-slate-900 border-b border-slate-100 dark:border-slate-800 relative overflow-hidden">
                    <!-- Abstract Shape -->
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-brand-500/5 dark:bg-brand-500/10 rounded-full blur-3xl"></div>
                    
                    <div class="relative">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">${data.summary.type}</p>
                        <h2 class="text-3xl md:text-4xl font-mono font-bold text-slate-900 dark:text-white mb-4 tracking-tight flex items-center gap-3">
                            ${code} 
                        </h2>
                        <div class="inline-flex items-center px-4 py-1.5 rounded-full border text-sm font-bold shadow-sm ${badgeClass}">
                            <div class="w-2 h-2 rounded-full bg-current mr-2 ${!isDelivered ? 'ping-dot' : ''}"></div>
                            ${lastStatus}
                        </div>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="p-6 md:p-8">
                    <div class="relative">
                        <!-- Vertical Line -->
                        <div class="absolute left-[15px] top-[10px] bottom-[10px] w-0.5 bg-gradient-to-b from-slate-200 to-transparent dark:from-slate-700"></div>
                        
                        <div class="space-y-8 relative z-10">
                            ${reversedHistory.map((h, i) => {
                                const isLatest = i === 0;
                                const isFinish = isLatest && h.rawStatus.includes('お届け済み');
                                
                                let dotStyle = "bg-white dark:bg-slate-900 border-[3px] border-slate-300 dark:border-slate-600 w-8 h-8 -left-[1px]";
                                let icon = "";
                                if(isLatest) {
                                    if(isFinish) {
                                        dotStyle = "bg-green-500 border-4 border-green-100 dark:border-green-900/50 w-8 h-8 -left-[1px] text-white shadow-lg shadow-green-500/30";
                                        icon = '<i class="fa-solid fa-check text-[10px]"></i>';
                                    } else {
                                        dotStyle = "bg-brand-500 border-4 border-brand-100 dark:border-brand-900/50 w-8 h-8 -left-[1px] text-white shadow-lg shadow-brand-500/30";
                                        icon = '<i class="fa-solid fa-truck-fast text-[10px]"></i>';
                                    }
                                }

                                return `
                                <div class="relative pl-12">
                                    <div class="absolute top-0 flex items-center justify-center rounded-full ${dotStyle} z-10">
                                        ${icon}
                                    </div>
                                    <div class="${isLatest ? '' : 'opacity-70'}">
                                        <div class="flex flex-col sm:flex-row sm:items-baseline sm:gap-3 mb-1">
                                            <h3 class="text-base font-bold ${isLatest ? 'text-slate-900 dark:text-white' : 'text-slate-700 dark:text-slate-300'}">${h.status}</h3>
                                            <span class="text-xs font-mono text-slate-400 mt-0.5 sm:mt-0">${h.date}</span>
                                        </div>
                                        <div class="text-sm mt-1.5 flex items-start text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 px-4 py-2.5 rounded-2xl w-fit">
                                            <i class="fa-solid fa-location-dot mt-1 mr-2 text-slate-300 dark:text-slate-500"></i>
                                            <span id="loc-${code}-${h.originalIdx}">
                                                ${h.office ? `<span class="animate-pulse">Đang dịch...</span>` : '<span>-</span>'}
                                            </span>
                                        </div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
            resultsContainer.appendChild(card);
            saveHistory(data.summary.code, data.summary.type, lastStatus);

            reversedHistory.forEach((h) => {
                if (h.office) autoTranslateLocation(`loc-${code}-${h.originalIdx}`, h.office, code, h.originalIdx);
            });
        };

        const renderErrorResult = (code, message) => {
            const card = document.createElement('div');
            card.className = 'bg-red-50 dark:bg-red-950/20 border-2 border-red-100 dark:border-red-900/50 rounded-3xl p-6 fade-slide-up flex gap-5 items-start';
            card.innerHTML = `
                <div class="w-12 h-12 rounded-2xl bg-red-100 dark:bg-red-900/50 text-red-500 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <div class="flex-1 pt-1">
                    <h3 class="text-xl font-mono font-bold text-red-900 dark:text-red-300 mb-1">${code}</h3>
                    <p class="text-sm font-medium text-red-600 dark:text-red-400 leading-relaxed">${message}</p>
                </div>
            `;
            resultsContainer.appendChild(card);
        };

        // --- 7. EXPORT IMAGE (NEW BEAUTIFUL LAYOUT) ---
        window.copyFullHistory = (code) => {
            const d = window.currentGlobalData.find(x => x.summary.code === code);
            if (!d) return;
            const reversedHistory = [...d.history].reverse();
            let text = `📦 MÃ VẬN ĐƠN: ${d.summary.code}\n🏷️ LOẠI: ${d.summary.type}\n📌 TRẠNG THÁI: ${d.history[d.history.length - 1].status}\n\nLỊCH TRÌNH:\n`;
            reversedHistory.forEach(h => {
                const loc = h.translatedOffice ? `${h.translatedOffice} (${h.office})` : h.office;
                text += `[${h.date}] ${h.status} - ${loc}\n`;
            });
            copyToClipboard(text, 'Đã chép toàn bộ lịch trình');
        };

        window.downloadImage = async (code, btn) => {
            const data = window.currentGlobalData.find(d => d.summary.code === code);
            if (!data) return;

            const iconHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            
            try {
                const isDark = document.documentElement.classList.contains('dark');
                const lastStatus = data.history[data.history.length - 1].status;
                const isDelivered = data.history[data.history.length - 1].rawStatus.includes('お届け済み');
                const reversedHistory = [...data.history].reverse();
                
                const wrapper = document.createElement('div');
                wrapper.className = `fixed top-[-9999px] left-[-9999px] w-[600px] z-[-100] ${isDark ? 'dark' : ''}`;
                
                // Giao diện chụp ảnh: Phong cách Ticket/App đẹp mắt
                wrapper.innerHTML = `
                    <div id="export-target-${code}" class="p-8 bg-slate-100 dark:bg-[#0b1120] font-sans">
                        <div class="bg-white dark:bg-[#1e293b] rounded-[2rem] shadow-2xl border border-slate-200/50 dark:border-slate-700/50 overflow-hidden relative">
                            
                            <!-- Deco -->
                            <div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-brand-500 to-brand-300"></div>
                            
                            <!-- Header Info -->
                            <div class="p-8 pb-6 border-b border-dashed border-slate-300 dark:border-slate-600">
                                <div class="flex justify-between items-start mb-6">
                                    <div class="bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider">${data.summary.type}</div>
                                    <div class="text-xs text-slate-400 font-bold uppercase tracking-widest"><i class="fa-solid fa-bolt text-brand-400 mr-1"></i> Hunq Track</div>
                                </div>
                                <h1 class="text-4xl font-mono font-bold text-slate-900 dark:text-white mb-2">${code}</h1>
                                <p class="text-lg font-bold ${isDelivered ? 'text-green-500' : 'text-brand-500'} flex items-center gap-2">
                                    <i class="fa-solid ${isDelivered ? 'fa-check-circle' : 'fa-truck-fast'}"></i> ${lastStatus}
                                </p>
                            </div>

                            <!-- Timeline -->
                            <div class="p-8 bg-slate-50 dark:bg-[#1e293b]">
                                <div class="relative border-l-2 border-slate-200 dark:border-slate-700 ml-3 space-y-6">
                                    ${reversedHistory.map((h, i) => {
                                        const isLatest = i === 0;
                                        const color = isLatest ? (isDelivered ? 'bg-green-500' : 'bg-brand-500') : 'bg-slate-300 dark:bg-slate-600';
                                        const locDisplay = h.translatedOffice ? `${h.translatedOffice} <span class="text-slate-400 text-xs ml-1 font-normal">(${h.office})</span>` : (h.office||'-');
                                        return `
                                        <div class="relative pl-6">
                                            <div class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full border-[3px] border-white dark:border-[#1e293b] ${color}"></div>
                                            <div class="flex items-center gap-3 mb-1">
                                                <h3 class="text-[15px] font-bold ${isLatest ? 'text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-400'}">${h.status}</h3>
                                                <span class="text-xs font-mono text-slate-400">${h.date}</span>
                                            </div>
                                            <p class="text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800/50 inline-block px-3 py-1.5 rounded-lg border border-slate-100 dark:border-slate-700/50 mt-1 shadow-sm">${locDisplay}</p>
                                        </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.body.appendChild(wrapper);
                await new Promise(r => setTimeout(r, 200));

                const canvas = await html2canvas(document.getElementById(`export-target-${code}`), {
                    scale: 2, useCORS: true, backgroundColor: isDark ? '#0b1120' : '#f1f5f9', windowWidth: 600
                });

                document.body.removeChild(wrapper);
                const a = document.createElement('a');
                a.href = canvas.toDataURL("image/png");
                a.download = `JP_Post_${code}.png`;
                a.click();

                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => { btn.innerHTML = iconHTML; }, 2000);
            } catch (err) {
                showToast("Lỗi xuất ảnh", true);
                btn.innerHTML = iconHTML;
            }
        };

        // --- 8. MAIN SUBMIT EVENT ---
        const trackForm = document.getElementById('trackForm');
        const trackingCodeInput = document.getElementById('trackingCode');
        const submitBtn = document.getElementById('submitBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadingText = document.getElementById('loadingText');

        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try { const text = await navigator.clipboard.readText(); if (text) trackingCodeInput.value = text.trim(); } catch (e) { showToast("Không thể dán", true); }
        });

        trackForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawText = trackingCodeInput.value;
            let codes = rawText.split(/[\n,\s]+/).map(c => c.replace(/[^a-zA-Z0-9]/g, '')).filter(c => c.length >= 11);
            codes = [...new Set(codes)].slice(0, 10);

            if (codes.length === 0) {
                showToast("Vui lòng nhập mã vận đơn hợp lệ", true);
                trackingCodeInput.focus();
                return;
            }

            // Giao diện UX khi load
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Đang tra cứu...</span>';
            emptyState.classList.add('hidden');
            resultsContainer.innerHTML = '';
            window.currentGlobalData = [];
            
            loadingIndicator.classList.remove('hidden');
            let serverMode = document.querySelector('input[name="serverMode"]:checked').value;

            // Scroll to top of results on mobile
            if(window.innerWidth < 1024) window.scrollTo({top: resultsContainer.offsetTop - 100, behavior: 'smooth'});

            for (let i = 0; i < codes.length; i++) {
                const code = codes[i];
                loadingText.innerText = `Đang tải: ${code} (${i + 1}/${codes.length})`;
                try {
                    const htmlText = await fetchHtml(`https://trackings.post.japanpost.jp/services/srv/search/direct?searchKind=S002&locale=ja&reqCodeNo1=${code}`, serverMode);
                    const data = parseHtml(htmlText);
                    window.currentGlobalData.push(data);
                    renderSingleResult(data);
                } catch (err) {
                    let msg = err.message;
                    if (msg.includes("Lỗi Server") || msg.includes("fetch")) msg = "Không thể kết nối. Hãy thử đổi Server (S1, S2, S3, S4, S5).";
                    else if (msg.includes("Cannot read") || msg.includes("undefined") || msg.includes("null")) msg = "Không tìm thấy mã hoặc JP Post chưa cập nhật.";
                    renderErrorResult(code, msg);
                }
            }

            loadingIndicator.classList.add('hidden');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Tra cứu ngay</span> <i class="fa-solid fa-arrow-right-long opacity-80"></i>';
        });

        // Khởi tạo
        loadHistory();
        const savedS = localStorage.getItem('jpPostServerMode') || 'auto';
        const rad = document.querySelector(`input[value="${savedS}"]`); if (rad) rad.checked = true;
        document.querySelectorAll('input[name="serverMode"]').forEach(r => r.addEventListener('change', e => localStorage.setItem('jpPostServerMode', e.target.value)));
        
        setTimeout(pingServers, 500); // Tự động đo ping lúc mới vào
    </script>
</body>
</html>
