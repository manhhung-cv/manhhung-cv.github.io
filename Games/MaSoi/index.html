        /* Sắp xếp cuộn cao cấp */
        ::-webkit-scrollbar {

        .glass-card {

        .glass-card:hover {

        .glass-input {

            color: #fff;
            transition: all 0.3s ease;

        .glass-input:focus {

            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Phân tầng trạng thái thời gian */
        .phase-lobby { background: radial-gradient(circle at 50% 0%, #111026 0%, #030712 75%); }
        .phase-night { background: radial-gradient(circle at 50% 0%, #290a0a 0%, #030712 75%); }
        .phase-day { background: radial-gradient(circle at 50% 0%, #182130 0%, #030712 75%); }

        /* Động lực học chuyển động */
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scale-in { animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .pulse-glow { animation: pulseGlow 3s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pulseGlow {
            from { opacity: 0.8; box-shadow: 0 0 12px rgba(255, 255, 255, 0.02); }
            to { opacity: 1; box-shadow: 0 0 20px rgba(99, 102, 241, 0.1); }
        }

        /* Chat Optimization */
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.875rem;
            max-width: 80%;
            line-height: 1.45;
            letter-spacing: 0.01em;
            word-wrap: break-word;

        .chat-system { align-self: center; font-size: 0.7rem; color: #9ca3af; margin: 14px 0; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
        
        .chat-narrator {
            align-self: center;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.05) 15%, rgba(245, 158, 11, 0.05) 85%, transparent);

            border-bottom: 1px solid rgba(245, 158, 11, 0.08);

        onAuthStateChanged(auth, (user) => {

        window.editProfile = () => { renderLogin(true); };

        const renderLogin = (isEdit = false) => {

                joinRoom(code);

        window.updateRoleCount = async (role, delta) => {
            if (roomData.host !== currentUser.uid) return;
            const currentCount = roomData.roleConfig[role] || 0;
            const newCount = Math.max(0, currentCount + delta);
            await updateDoc(getRoomRef(currentRoomId), { [`roleConfig.${role}`]: newCount });
        };

        window.suggestRoles = async () => {
            if (roomData.host !== currentUser.uid) return;
            const count = Object.keys(roomData.players).length;
            let suggested = { wolf: 1, seer: 1, guard: 1, witch: 0, hunter: 0, villager: 0 };

            if (count >= 6) suggested.witch = 1;
            if (count >= 8) suggested.wolf = 2;
            if (count >= 10) { suggested.wolf = 3; suggested.hunter = 1; }

            const assigned = Object.values(suggested).reduce((a, b) => a + b, 0);
            suggested.villager = Math.max(0, count - assigned);

            await updateDoc(getRoomRef(currentRoomId), { roleConfig: suggested });
        };

        const renderLobby = () => {
            const isHost = roomData.host === currentUser.uid;
            const playersList = Object.values(roomData.players || {});

        const handleStartGame = async () => {

            let rolePool = [];
            const config = roomData.roleConfig || {};
            for (const [r, count] of Object.entries(config)) {
                for (let i = 0; i < count; i++) rolePool.push(r);

            rolePool.sort(() => Math.random() - 0.5);

            players.forEach((p, i) => { updates[`players.${p.uid}.role`] = rolePool[i]; updates[`players.${p.uid}.isAlive`] = true; });

            try { await updateDoc(getRoomRef(currentRoomId), updates); triggerNarrator('START'); } catch (e) { }
        };

                                <div class="text-[9px] text-slate-400 uppercase tracking-widest flex items-center gap-1">${phaseIcon} ${isNight ? 'Bóng tối bao phủ' : 'Bình minh thức giấc'}</div>
                                <div class="text-base font-semibold text-white tracking-wide">${phaseTitle} ${roomData.winner ? '(Kết thúc)' : ''}</div>

                            <button onclick="openRoleHandbook()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center bg-white/5 rounded-full transition"><i class="fas fa-book-open text-xs"></i></button>
                            ${isHost ? `<button onclick="openSettings()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center bg-white/5 rounded-full transition"><i class="fas fa-cog text-xs"></i></button>` : ''}
                            <button id="btn-leave-game" class="text-slate-400 hover:text-red-400 w-8 h-8 flex items-center justify-center bg-white/5 rounded-full transition"><i class="fas fa-sign-out-alt text-xs"></i></button>
                        </div>
                    </div>

                    <!-- Giao diện đáp ứng thông minh chia không gian cốt lõi -->
                    <div class="flex-1 flex flex-col md:flex-row min-h-0">

                        <div class="flex-1 flex flex-col min-h-0 bg-black/5">
                            <div class="p-4 grid grid-cols-3 min-[480px]:grid-cols-4 md:grid-cols-4 lg:grid-cols-5 gap-2.5 overflow-y-auto flex-1 content-start hide-scrollbar">
            `;

            playersList.forEach(p => {
                const isDead = !p.isAlive;
                const isSelected = selectedTargetId === p.uid;
                let displayImage = p.avatar;
                let fallbackImage = FALLBACK_VILLAGER;
                let reveal = false;

                else if (!window.isViewingAsOthers) {

            }

            if (roomData.winner) {
                const isWolfWin = roomData.winner === 'wolves';
                html += `
                    <div class="p-5 text-center border-t border-white/5 bg-black/40 shrink-0">
                        <div class="text-xl font-bold tracking-widest mb-3 ${isWolfWin ? 'text-red-500 shadow-glow-blood' : 'text-indigo-400 shadow-glow-mystic'} uppercase">

                        </div>
                        <button id="btn-back-lobby" class="text-[10px] uppercase tracking-widest border border-white/10 px-6 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 transition">Quay về sảnh chờ</button>
                    </div>
                `;
            }

            html += `</div>`; // Kết thúc phân vùng trái

            // Phân vùng phải: Khung chat truyền âm (Độ rộng cố định trên máy tính)
            html += `
                <div class="w-full md:w-72 lg:w-80 flex flex-col min-h-[32h] md:min-h-0 border-t md:border-t-0 md:border-l border-white/5 bg-black/15">
                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-2 hide-scrollbar"></div>
                    
                    ${(isHost && !roomData.winner) ? `
                        <div class="px-4 py-2 flex justify-center bg-black/20 border-t border-white/5">
                            <button id="btn-end-phase" class="text-[9px] uppercase tracking-widest text-slate-400 hover:text-white transition bg-white/5 px-3 py-1 rounded-lg">
                                <i class="fas fa-step-forward mr-1"></i> Bỏ qua ${isNight ? 'Đêm' : 'Ngày'}
                            </button>
                        </div>
                    ` : ''}

                    <form id="chat-form" class="p-3 flex gap-2 border-t border-white/5 bg-black/30 backdrop-blur-md">
                        <input type="text" id="chat-input" placeholder="Truyền âm nhập mật..." autocomplete="off" class="flex-1 glass-input rounded-xl px-3 py-2.5 text-xs focus:outline-none">
                        <button type="submit" class="w-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 text-white flex items-center justify-center shrink-0 transition"><i class="fas fa-paper-plane text-xs opacity-75"></i></button>

            html += `</div></div>`; // Đóng bố cục chính

            renderHTML(html);

            document.getElementById('btn-leave-game').addEventListener('click', handleLeaveRoom);
            if (document.getElementById('btn-back-lobby')) document.getElementById('btn-back-lobby').addEventListener('click', resetToLobby);
            if (isHost && document.getElementById('btn-end-phase')) document.getElementById('btn-end-phase').addEventListener('click', handleEndPhase);

            if (!roomData.winner && myPlayer.isAlive) {
                document.querySelectorAll('.player-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const uid = card.dataset.uid;
                        if (!roomData.players[uid].isAlive) return;
                        selectedTargetId = uid === selectedTargetId ? null : uid;
                        renderGame();
                    });
                });
            }

            if (document.getElementById('btn-do-action')) document.getElementById('btn-do-action').addEventListener('click', handlePlayerAction);

            document.getElementById('chat-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const msg = input.value.trim();
                if (msg) { sendChat(msg); input.value = ''; }
            });

            renderChatMessages();
        };

        const renderChatMessages = () => {
            const container = document.getElementById('chat-messages');
            if (!container) return;
            const myPlayer = roomData.players[currentUser.uid];
            container.innerHTML = '';

            (roomData.chat || []).forEach(msg => {
                if (msg.type === 'wolf' && myPlayer.role !== 'wolf' && !roomData.winner) return;
                if (msg.type === 'dead' && myPlayer.isAlive && !roomData.winner) return;

                const div = document.createElement('div');

                if (msg.type === 'system') {
                    div.className = 'chat-system fade-in';
                    div.innerHTML = `<span class="px-2.5 py-0.5 border border-white/5 rounded-md bg-black/40">${msg.text}</span>`;
                } else if (msg.type === 'narrator') {
                    div.className = 'chat-narrator fade-in';
                    div.innerHTML = msg.text;
                } else {
                    const isMe = msg.uid === currentUser.uid;
                    div.className = `chat-bubble fade-in ${isMe ? 'chat-mine' : 'chat-other'}`;
                    if (msg.type === 'wolf') div.classList.add('chat-wolf');
                    if (msg.type === 'dead') div.classList.add('chat-dead');

                    const senderName = !isMe ? `<div class="text-[8px] uppercase tracking-wider font-semibold opacity-40 mb-0.5">${msg.name}</div>` : '';
                    div.innerHTML = `${senderName}<div class="font-normal">${msg.text}</div>`;
                }
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        };

        window.openRoleHandbook = () => {
            document.getElementById('handbook-modal').classList.remove('hidden');

        window.closeRoleHandbook = () => { document.getElementById('handbook-modal').classList.add('hidden'); };

        const renderHandbookTabs = () => {
            const tabsContainer = document.getElementById('handbook-tabs');
            tabsContainer.innerHTML = '';

            Object.keys(ROLES_DATA).forEach((key, index) => {
                const role = ROLES_DATA[key];
                const btn = document.createElement('button');
                btn.className = `snap-center shrink-0 px-3 py-1.5 rounded-full text-[10px] tracking-wider uppercase transition border flex items-center gap-1.5 opacity-50 border-transparent bg-white/5 text-slate-300`;
                btn.innerHTML = `
                    <div class="w-4 h-4 rounded-full overflow-hidden shrink-0">
                        <img src="${role.img}" onerror="this.src='${role.fallback}'" class="w-full h-full object-cover">
                    </div> 
                    <span>${role.name}</span>
                `;

                btn.onclick = () => {
                    document.querySelectorAll('#handbook-tabs button').forEach(b => {
                        b.classList.remove('bg-amber-500/10', 'border-amber-500/30', 'text-amber-300', 'opacity-100');
                        b.classList.add('opacity-50', 'bg-white/5', 'border-transparent', 'text-slate-300');
                    });
                    btn.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-300', 'opacity-100');
                    btn.classList.remove('opacity-50', 'bg-white/5', 'border-transparent', 'text-slate-300');
                    renderRoleDetail(role);
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                };

                tabsContainer.appendChild(btn);
                if (index === 0) btn.click();
            });
        };

        const renderRoleDetail = (role) => {
            const content = document.getElementById('handbook-content');
            const renderList = (items) => items.map(item => `<li class="relative pl-4 text-xs font-light before:content-['•'] before:absolute before:left-0 before:text-slate-600">${item}</li>`).join('');

            content.innerHTML = `
                <div class="fade-in space-y-5">
                    <div class="flex items-center gap-3.5 border-b border-white/5 pb-4">
                        <div class="w-12 h-12 rounded-full overflow-hidden border border-white/10 shadow-md">
                            <img src="${role.img}" onerror="this.src='${role.fallback}'" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-white tracking-wide ${role.color}">${role.name}</h3>
                            <span class="inline-block mt-1 px-2.5 py-0.5 rounded-md text-[8px] uppercase tracking-wider border ${role.team === 'Dân Làng' ? 'bg-blue-950/40 text-blue-300 border-blue-500/20' : 'bg-red-950/40 text-red-300 border-red-500/20'}">Phe ${role.team}</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <h4 class="text-[9px] uppercase tracking-widest text-mystic-400 mb-1.5"><i class="fas fa-magic mr-1"></i> Đặc tính vai trò</h4>
                            <p class="text-slate-300 leading-relaxed font-light bg-white/5 p-3 rounded-xl italic text-xs border border-white/5">${role.desc}</p>
                        </div>
                        <div>
                            <h4 class="text-[9px] uppercase tracking-widest text-amber-400/90 mb-1.5"><i class="fas fa-crown mr-1"></i> Trọng tâm</h4>
                            <ul class="space-y-1.5">${renderList(role.importance)}</ul>
                        </div>
                        <div>
                            <h4 class="text-[9px] uppercase tracking-widest text-emerald-400/90 mb-1.5"><i class="fas fa-chess mr-1"></i> Chiến lược vận hành</h4>
                            <ul class="space-y-1.5">${renderList(role.tactics)}</ul>
                        </div>
                        <div class="bg-red-950/10 border border-red-500/10 p-3 rounded-xl">
                            <h4 class="text-[9px] uppercase tracking-widest text-red-400 mb-1.5"><i class="fas fa-gavel mr-1"></i> Điều luật bắt buộc</h4>
                            <ul class="space-y-1 text-red-200/80">${renderList(role.rules)}</ul>
                        </div>
                    </div>
                </div>
            `;
        };

        window.openSettings = () => {
            document.getElementById('toggle-narrator').checked = window.gameSettings.useNarrator;
            document.getElementById('toggle-ai').checked = window.gameSettings.useAI;
            document.getElementById('gemini-key').value = window.gameSettings.apiKey || '';
            document.getElementById('scenario-style').value = window.gameSettings.scenarioStyle || 'gothic';
            toggleAPIInput();
            document.getElementById('settings-modal').classList.remove('hidden');
        };

        window.saveSettings = () => {
            window.gameSettings = {
                useNarrator: document.getElementById('toggle-narrator').checked,
                useAI: document.getElementById('toggle-ai').checked,
                apiKey: document.getElementById('gemini-key').value.trim(),
                scenarioStyle: document.getElementById('scenario-style').value
            };
            localStorage.setItem('ww_settings_mystic', JSON.stringify(window.gameSettings));
            closeSettings();
            showToast("Đã ghi nhận cấu hình thế giới mới", "success");
        };

        window.closeSettings = () => document.getElementById('settings-modal').classList.add('hidden');

        const toggleAPIInput = () => {
            document.getElementById('api-key-container').style.display = document.getElementById('toggle-ai').checked ? 'block' : 'none';
        }
        document.getElementById('toggle-ai').addEventListener('change', toggleAPIInput);
        document.getElementById('toggle-narrator').addEventListener('change', () => {
            const isNarrator = document.getElementById('toggle-narrator').checked;
            document.getElementById('ai-toggle-container').style.opacity = isNarrator ? '1' : '0.4';
            document.getElementById('toggle-ai').disabled = !isNarrator;
        });

        const showMyRoleModal = () => {
            const r = ROLES_DATA[roomData.players[currentUser.uid].role];
            document.getElementById('role-icon-container').innerHTML = `<img src="${r.img}" onerror="this.src='${r.fallback}'" class="w-20 h-20 mx-auto rounded-full object-cover border border-white/10 shadow-md">`;
            document.getElementById('role-name-display').textContent = r.name;
            document.getElementById('role-name-display').className = `text-2xl font-bold mb-1 tracking-wide ${r.color}`;
            document.getElementById('role-desc-display').textContent = r.desc;
            document.getElementById('role-modal').classList.remove('hidden');
        };

        window.closeRoleModal = () => document.getElementById('role-modal').classList.add('hidden');
        window.showMyRole = () => { if (roomData && roomData.status === 'playing') showMyRoleModal(); }

        const handleCreateRoom = async (currentRoomsCount) => {
            if (currentRoomsCount >= 5) return showToast("Mỗi thực thể chỉ được quản lý tối đa 5 làng cùng lúc", "error");

            const roomId = generateRoomId();
            const initialData = {
                roomId, host: currentUser.uid, status: 'lobby', phase: 'night', dayCount: 0,
                players: { [currentUser.uid]: { uid: currentUser.uid, name: myProfile.name, avatar: myProfile.avatar, isAlive: true, role: 'villager' } },
                actions: {}, nightActions: {}, dayActions: {}, chat: [], winner: null,
                roleConfig: { wolf: 1, seer: 1, guard: 1, witch: 0, hunter: 0, villager: 0 }
            };
            try {
                await setDoc(getRoomRef(roomId), initialData);
                joinRoom(roomId);
            } catch (e) { showToast("Năng lượng không ổn định", "error"); }
        };

        const joinRoom = async (roomId) => {
            if (!currentUser) return;
            const roomRef = getRoomRef(roomId);
            try {
                const docSnap = await getDoc(roomRef);
                if (!docSnap.exists()) return showToast("Thế giới không tồn tại", "error");
                if (docSnap.data().status !== 'lobby' && !docSnap.data().players[currentUser.uid]) return showToast("Trận đấu đã khép kín sảnh", "error");

                if (!docSnap.data().players[currentUser.uid]) {
                    await updateDoc(roomRef, { [`players.${currentUser.uid}`]: { uid: currentUser.uid, name: myProfile.name, avatar: myProfile.avatar, isAlive: true, role: 'villager' } });
                }
                currentRoomId = roomId; listenToRoom();
            } catch (e) { showToast("Gián đoạn năng lượng", "error"); }
        };

        window.joinRoom = joinRoom;

        const handleLeaveRoom = async () => {
            if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            currentRoomId = null; roomData = null; selectedTargetId = null; renderMenu();
        };

        const listenToRoom = () => {
            if (unsubscribeRoom) unsubscribeRoom();
            unsubscribeRoom = onSnapshot(getRoomRef(currentRoomId), (docSnap) => {
                if (!docSnap.exists()) { handleLeaveRoom(); showToast("Thế giới này đã bị xóa sổ", "error"); return; }
                const oldStatus = roomData ? roomData.status : null;
                const oldPhase = roomData ? roomData.phase : null;
                roomData = docSnap.data();

                if (oldStatus === 'lobby' && roomData.status === 'playing') showMyRoleModal();
                if (roomData.status === 'lobby') renderLobby();
                else { if (oldPhase !== roomData.phase) selectedTargetId = null; renderGame(); }
            }, () => showToast("Mất kết nối dòng chảy dữ liệu", "error"));
        };

        const handlePlayerAction = async () => {
            if (!selectedTargetId) return;
            const my = roomData.players[currentUser.uid];
            const isNight = roomData.phase === 'night';
            const day = roomData.dayCount;
            const ref = getRoomRef(currentRoomId);

            try {
                if (isNight) {
                    if (my.role === 'seer') {
                        const targetRole = roomData.players[selectedTargetId].role;
                        showToast(`Căn tính kẻ này là: ${ROLES_DATA[targetRole].name} ${ROLES_DATA[targetRole].icon}`);
                        await updateDoc(ref, { [`nightActions.${day}.${currentUser.uid}`]: 'checked' });
                    } else if (my.role === 'wolf' || my.role === 'guard') {
                        await updateDoc(ref, { [`nightActions.${day}.${currentUser.uid}`]: selectedTargetId });
                        showToast("Đã xác định mục tiêu năng lực");
                    }
                } else {
                    await updateDoc(ref, { [`dayActions.${day}.${currentUser.uid}`]: selectedTargetId });
                    showToast("Đã thả lá phiếu phán quyết");
                }
                selectedTargetId = null;
            } catch (e) { }
        };

        const handleEndPhase = async () => {
            const isNight = roomData.phase === 'night';
            const day = roomData.dayCount;
            const ref = getRoomRef(currentRoomId);
            let updates = {};

            if (isNight) {
                const acts = roomData.nightActions[day] || {};
                let w = null; let g = null;
                for (const [u, t] of Object.entries(acts)) {
                    if (t === 'checked') continue;
                    if (roomData.players[u].role === 'wolf') w = t;
                    if (roomData.players[u].role === 'guard') g = t;
                }
                if (w && w !== g) updates[`players.${w}.isAlive`] = false;
                updates.phase = 'day'; updates[`dayActions.${day}`] = {};
            } else {
                const votes = roomData.dayActions[day] || {};
                const counts = {}; for (const t of Object.values(votes)) counts[t] = (counts[t] || 0) + 1;
                let max = 0; let target = null; let tie = false;
                for (const [t, c] of Object.entries(counts)) {
                    if (c > max) { max = c; target = t; tie = false; } else if (c === max) tie = true;
                }
                if (target && !tie) updates[`players.${target}.isAlive`] = false;
                updates.phase = 'night'; updates.dayCount = day + 1; updates[`nightActions.${day + 1}`] = {};
            }

            const temp = JSON.parse(JSON.stringify(roomData.players));
            for (const k in updates) { if (k.includes('.isAlive')) temp[k.split('.')[1]].isAlive = updates[k]; }
            let wCount = 0; let vCount = 0;
            Object.values(temp).forEach(p => { if (p.isAlive) p.role === 'wolf' ? wCount++ : vCount++; });

            if (wCount === 0) updates.winner = 'villagers';
            else if (wCount >= vCount) updates.winner = 'wolves';

            try {
                await updateDoc(ref, updates);
                if (updates.winner) triggerNarrator(updates.winner === 'wolves' ? 'WOLF_WIN' : 'VILLAGER_WIN');
                else if (isNight) {
                    const deathUid = Object.keys(updates).find(k => k.startsWith('players.') && updates[k] === false)?.split('.')[1];
                    if (deathUid) triggerNarrator('NIGHT_KILL', { name: roomData.players[deathUid].name });
                    else triggerNarrator('NIGHT_PEACE');
                } else {
                    const deathUid = Object.keys(updates).find(k => k.startsWith('players.') && updates[k] === false)?.split('.')[1];
                    if (deathUid) triggerNarrator('DAY_LYNCH', { name: roomData.players[deathUid].name });
                    else triggerNarrator('DAY_TIE');
                }
            } catch (e) { }
        };

        const triggerNarrator = async (eventKey, context = {}) => {
            if (!window.gameSettings.useNarrator) return;
            const currentStyle = window.gameSettings.scenarioStyle || 'gothic';

            let scripts = {
                "gothic": {
                    "START": "Màn đêm lạnh lẽo buông xuống. Những kẻ khát máu bắt đầu rời khỏi hang ổ.",
                    "NIGHT_KILL": `Tia sáng đầu ngày rọi xuống, lộ ra thi thể lạnh ngắt của {name}.`,
                    "NIGHT_PEACE": "Một đêm tĩnh lặng trôi qua kỳ lạ. Lực lượng bảo hộ đã ngăn chặn rủi ro thành công.",
                    "DAY_LYNCH": `Theo phán quyết dân làng, {name} chính thức bị trục xuất lên giàn hỏa thiêu.`,
                    "DAY_TIE": "Sự nghi ngờ hỗn loạn dẫn đến kết quả hòa. Không ai bị hành quyết hôm nay.",
                    "WOLF_WIN": "Tiếng tru tàn bạo vang khắp không gian. Ngôi làng ngập trong bóng tối vĩnh hằng.",
                    "VILLAGER_WIN": "Tà ác tan biến hoàn toàn. Ánh bình minh thuần khiết chính thức trở lại."
                }
            };

            try {
                const res = await fetch('./asset/kichban.json');
                if (res.ok) {
                    const data = await res.json();
                    scripts = { ...scripts, ...data };
                }
            } catch (e) { }

            const activeScript = scripts[currentStyle] || scripts['gothic'];
            const resolveScript = (k, c) => (activeScript[k] || "").replace('{name}', c.name || '');
            let text = "";

            if (window.gameSettings.useAI && window.gameSettings.apiKey) {
                let eventDesc = "";
                switch (eventKey) {
                    case 'START': eventDesc = "Bắt đầu ván game Ma Sói. Đêm đầu tiên, sói đi săn."; break;
                    case 'NIGHT_KILL': eventDesc = `Sáng ra, người chơi ${context.name} chết vì bị sói cắn.`; break;
                    case 'NIGHT_PEACE': eventDesc = "Sáng ra, không ai chết đêm qua vì được Bảo vệ hoặc sói không cắn."; break;
                    case 'DAY_LYNCH': eventDesc = `Dân làng đã biểu quyết treo cổ người chơi ${context.name}.`; break;
                    case 'DAY_TIE': eventDesc = "Biểu quyết hòa, không ai bị treo cổ hôm nay."; break;
                    case 'WOLF_WIN': eventDesc = "Sói chiến thắng, dân làng bị tiêu diệt hết."; break;
                    case 'VILLAGER_WIN': eventDesc = "Dân làng chiến thắng, sói đã bị tiêu diệt."; break;
                }

                let tone = "ma thuật hắc ám, bí ẩn và nghiêm túc";
                if (currentStyle === 'humor') tone = "hài hước, lầy lội, mỉa mai sâu cay";
                if (currentStyle === 'royal') tone = "triều đình cổ trang, thâm độc cung đấu";
                if (currentStyle === 'scifi') tone = "không gian viễn tưởng, báo cáo logic từ AI hệ thống";

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${window.gameSettings.apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Bạn là quản trò game Ma Sói. Sự kiện: "${eventDesc}". Hãy viết đúng 1 câu dẫn truyện ngắn, phong cách ${tone}. Không giải thích gì thêm.` }] }] })
                    });
                    const data = await response.json();
                    text = data.candidates[0].content.parts[0].text.trim().replace(/^["']|["']$/g, '');
                } catch (e) { text = resolveScript(eventKey, context); }
            } else {
                text = resolveScript(eventKey, context);
            }

            if (text) {
                try { await updateDoc(getRoomRef(currentRoomId), { chat: arrayUnion({ uid: 'narrator', name: 'Quản Trò', text: text, type: 'narrator', timestamp: Date.now() }) }); } catch (e) { }
            }
        };

        const sendChat = async (text) => {
            const my = roomData.players[currentUser.uid];
            let t = 'normal';
            if (!my.isAlive) t = 'dead'; else if (roomData.phase === 'night' && my.role === 'wolf') t = 'wolf';
            try { await updateDoc(getRoomRef(currentRoomId), { chat: arrayUnion({ uid: currentUser.uid, name: myProfile.name, text, type: t, timestamp: Date.now() }) }); } catch (e) { }
        };

        const resetToLobby = async () => { if (roomData.host === currentUser.uid) try { await updateDoc(getRoomRef(currentRoomId), { status: 'lobby', winner: null, chat: [], dayCount: 0 }); } catch (e) { } }

        initAuth();
    </script>
</body>
