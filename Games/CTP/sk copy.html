<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bàn Cờ Tỷ Phú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập Container Query */
        .board-wrapper {
            container-type: inline-size;
            container-name: board;
        }
        
        .cell-name { font-size: clamp(0.4rem, 1.4cqw, 0.9rem); line-height: 1.1; }
        .cell-price { font-size: clamp(0.4rem, 1.3cqw, 0.8rem); }
        .cell-desc { font-size: clamp(0.35rem, 1cqw, 0.7rem); line-height: 1.2; }
        .corner-title { font-size: clamp(0.6rem, 2.5cqw, 1.5rem); line-height: 1.1; }
        
        .board-cell {
            outline: 1px solid #000;
            outline-offset: -1px;
        }
    </style>
</head>
<body class="bg-gray-800 min-h-screen flex items-center justify-center p-2 sm:p-4 font-['Roboto',sans-serif]">

    <!-- Container chính -->
    <div class="board-wrapper w-full max-w-[900px] aspect-square relative bg-[#f4f7f6] border-4 border-black shadow-2xl overflow-hidden mx-auto box-border">
        
        <!-- ================= KHU VỰC TRUNG TÂM ================= -->
        <!-- Div này chứa toàn bộ không gian 70% ở giữa bàn cờ -->
        <div id="khu-vuc-trung-tam" class="absolute inset-[15%] bg-[#f4f7f6] board-cell overflow-hidden z-10">
            
            <!-- 1. VÙNG CHỨA HÌNH ẢNH / NỀN (THAY ẢNH CỦA BẠN VÀO ĐÂY SAU NÀY) -->
            <div id="vung-hinh-anh" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0">
                <!-- Ví dụ thay ảnh: <img src="duong_dan_anh_cua_ban.jpg" class="w-[80%] h-auto object-contain transform -rotate-12"> -->
                <div class="relative transform -rotate-12 scale-110 sm:scale-125 mt-4 opacity-90">
                    <span class="text-7xl sm:text-8xl md:text-9xl drop-shadow-md">🤑</span>
                    <span class="absolute -top-10 -left-10 text-3xl sm:text-4xl transform -rotate-45">💸</span>
                    <span class="absolute top-6 -left-20 text-3xl sm:text-4xl transform rotate-12">💸</span>
                    <span class="absolute -bottom-6 -left-4 text-4xl sm:text-5xl md:text-6xl drop-shadow-sm">💰</span>
                    <span class="absolute -top-4 -right-12 text-3xl sm:text-4xl md:text-5xl transform rotate-45">💵</span>
                </div>
            </div>

            <!-- 2. DIV CƠ HỘI (Góc dưới trái) -->
            <div id="div-co-hoi" class="absolute bottom-[12%] left-[8%] transform -rotate-45 flex flex-col items-center justify-center w-[28%] z-20">
                <!-- Hình chữ nhật mô phỏng xấp thẻ bài đỏ -->
                <div class="w-full aspect-[1.6/1] bg-[#da251d] border-2 border-black shadow-[4px_4px_0_rgba(0,0,0,0.2)]"></div>
                <span class="font-black mt-2 text-[#da251d] uppercase text-center w-[120%]" 
                      style="font-size: clamp(0.8rem, 3cqw, 2rem); text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff, 2px 2px 0 rgba(0,0,0,0.3);">
                    CƠ HỘI
                </span>
            </div>
            
            <!-- 3. DIV KHÍ VẬN (Góc trên phải) -->
            <div id="div-khi-van" class="absolute top-[8%] right-[8%] transform -rotate-45 flex flex-col items-center justify-center w-[28%] z-20">
                <span class="font-black mb-2 text-[#ffca28] uppercase text-center w-[120%]" 
                      style="font-size: clamp(0.8rem, 3cqw, 2rem); text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 2px 2px 0 rgba(0,0,0,0.3);">
                    KHÍ VẬN
                </span>
                <!-- Hình chữ nhật mô phỏng xấp thẻ bài vàng -->
                <div class="w-full aspect-[1.6/1] bg-[#ffca28] border-2 border-black shadow-[4px_4px_0_rgba(0,0,0,0.2)]"></div>
            </div>

            <!-- 4. TIÊU ĐỀ CỜ TỶ PHÚ LỚN (Góc dưới phải) -->
            <div id="div-tieu-de" class="absolute bottom-[10%] right-[2%] transform -rotate-45 z-20 text-center">
                <h1 class="font-black tracking-tighter uppercase text-[#da251d] select-none" 
                    style="font-size: clamp(1.8rem, 6.5cqw, 4.5rem); text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0px 5px 0 rgba(0,0,0,0.3);">
                    CỜ TỶ PHÚ !
                </h1>
            </div>

        </div>
        <!-- ================= HẾT KHU VỰC TRUNG TÂM ================= -->

        <!-- 4 GÓC BÀN CỜ -->
        <div class="absolute bottom-0 left-0 w-[15%] h-[15%] bg-[#f4f7f6] board-cell flex flex-col items-center justify-center z-20">
            <div class="transform rotate-45 flex flex-col items-center justify-center w-[140%] h-[140%] text-center p-1">
                <span class="text-red-600 corner-title font-black uppercase mb-1">Bắt Đầu</span>
                <span class="cell-desc font-bold">Lương tháng<br><span class="text-red-600">$2000</span><br>khi qua ô</span>
                <span class="text-red-600 text-xl sm:text-3xl mt-1">🡱</span>
            </div>
        </div>
        <div class="absolute top-0 left-0 w-[15%] h-[15%] bg-[#f4f7f6] board-cell flex flex-col items-center justify-center z-20 overflow-hidden">
            <div class="transform rotate-[135deg] flex flex-col items-center justify-center w-[140%] h-[140%]">
                <div class="flex items-center gap-1">
                    <span class="text-2xl sm:text-4xl">⛓️</span>
                    <span class="corner-title font-black uppercase">Ở Tù</span>
                </div>
                <div class="w-[80%] border-t-2 border-black my-1"></div>
                <span class="corner-title font-black uppercase">Thăm</span>
            </div>
        </div>
        <div class="absolute top-0 right-0 w-[15%] h-[15%] bg-[#f4f7f6] board-cell flex flex-col items-center justify-center z-20 overflow-hidden">
            <div class="transform -rotate-[135deg] flex flex-col items-center justify-center w-[140%] h-[140%]">
                <span class="text-red-600 corner-title font-black uppercase text-center">Bãi Đậu Xe</span>
                <span class="text-3xl sm:text-5xl my-1">🚗</span>
                <span class="text-red-600 corner-title font-black uppercase">Miễn Phí</span>
            </div>
        </div>
        <div class="absolute bottom-0 right-0 w-[15%] h-[15%] bg-[#f4f7f6] board-cell flex flex-col items-center justify-center z-20 overflow-hidden">
            <div class="transform -rotate-[45deg] flex flex-col items-center justify-center w-[140%] h-[140%]">
                <span class="text-red-600 corner-title font-black uppercase text-center mb-1">Vào Tù</span>
                <span class="text-3xl sm:text-5xl">👮</span>
            </div>
        </div>

        <!-- 4 CẠNH BÀN CỜ -->
        <div id="bottom-row" class="absolute bottom-0 left-[15%] w-[70%] h-[15%] flex flex-row"></div>
        <div id="top-row" class="absolute top-0 left-[15%] w-[70%] h-[15%] flex flex-row transform rotate-180"></div>
        <div id="left-col" class="absolute flex flex-row" style="left: 7.5%; top: 50%; width: 70%; height: 15%; transform: translate(-50%, -50%) rotate(90deg);"></div>
        <div id="right-col" class="absolute flex flex-row" style="left: 92.5%; top: 50%; width: 70%; height: 15%; transform: translate(-50%, -50%) rotate(-90deg);"></div>

    </div>

    <!-- Script tạo các ô cờ bao quanh -->
    <script>
        const bottomSpaces = [
            { id: 39, type: 'prop', name: 'TÂN KỲ<br>TÂN QUÝ', price: '$400', color: 'bg-blue-800' },
            { id: 38, type: 'tax', name: 'THUẾ<br>ĐẶC BIỆT', desc: 'Trả $100' },
            { id: 37, type: 'prop', name: 'LŨY<br>BÁN BÍCH', price: '$350', color: 'bg-blue-800' },
            { id: 36, type: 'chance', name: 'CƠ HỘI', icon: '❓', iconClass: 'text-red-600' },
            { id: 35, type: 'station', name: 'BẾN XE<br>MIỀN ĐÔNG', price: '$200', icon: '🛺' },
            { id: 34, type: 'prop', name: 'QUANG<br>TRUNG', price: '$320', color: 'bg-green-600' },
            { id: 33, type: 'chest', name: 'KHÍ VẬN', icon: '💰', iconClass: 'text-yellow-500' },
            { id: 32, type: 'prop', name: 'NGUYỄN<br>KIỆM', price: '$300', color: 'bg-green-600' },
            { id: 31, type: 'prop', name: 'CỘNG HÒA', price: '$300', color: 'bg-green-600' }
        ];

        const topSpaces = [
            { id: 19, type: 'prop', name: 'HUỲNH<br>TẤN PHÁT', price: '$200', color: 'bg-orange-500' },
            { id: 18, type: 'prop', name: 'HÙNG<br>VƯƠNG', price: '$180', color: 'bg-orange-500' },
            { id: 17, type: 'chest', name: 'KHÍ VẬN', icon: '💰', iconClass: 'text-yellow-500' },
            { id: 16, type: 'prop', name: 'HẬU GIANG', price: '$180', color: 'bg-orange-500' },
            { id: 15, type: 'station', name: 'BẾN XE<br>MIỀN TÂY', price: '$200', icon: '🛺' },
            { id: 14, type: 'prop', name: 'AN DƯƠNG<br>VƯƠNG', price: '$160', color: 'bg-pink-400', txtColor: 'text-black' },
            { id: 13, type: 'prop', name: 'NGUYỄN<br>TRÃI', price: '$140', color: 'bg-pink-400', txtColor: 'text-black' },
            { id: 12, type: 'utility', name: 'CÔNG TY<br>ĐIỆN LỰC', price: '$200', icon: '💡' },
            { id: 11, type: 'prop', name: 'NGUYỄN<br>TẤT THÀNH', price: '$140', color: 'bg-pink-400', txtColor: 'text-black' }
        ];

        const leftSpaces = [
            { id: 9, type: 'prop', name: 'TÔN ĐẢN', price: '$120', color: 'bg-sky-200', txtColor: 'text-black' },
            { id: 8, type: 'prop', name: 'VÕ THỊ SÁU', price: '$100', color: 'bg-sky-200', txtColor: 'text-black' },
            { id: 7, type: 'chance', name: 'CƠ HỘI', icon: '❓', iconClass: 'text-red-600' },
            { id: 6, type: 'prop', name: 'LƯƠNG ĐỊNH<br>CỦA', price: '$100', color: 'bg-sky-200', txtColor: 'text-black' },
            { id: 5, type: 'station', name: 'BẾN XE<br>CẦN THƠ', price: '$200', icon: '🛺' },
            { id: 4, type: 'tax', name: 'THUẾ<br>THU NHẬP', desc: 'Trả 10%<br>hoặc $200' },
            { id: 3, type: 'prop', name: 'LÊ LỢI', price: '$60', color: 'bg-amber-800' },
            { id: 2, type: 'chest', name: 'KHÍ VẬN', icon: '💰', iconClass: 'text-yellow-500' },
            { id: 1, type: 'prop', name: 'NGUYỄN<br>HUỆ', price: '$60', color: 'bg-amber-800' }
        ];

        const rightSpaces = [
            { id: 29, type: 'prop', name: 'HOÀNG<br>VĂN THỤ', price: '$280', color: 'bg-yellow-400', txtColor: 'text-black' },
            { id: 28, type: 'utility', name: 'CÔNG TY<br>CẤP NƯỚC', price: '$200', icon: '🚰' },
            { id: 27, type: 'prop', name: 'TRƯỜNG<br>CHINH', price: '$260', color: 'bg-yellow-400', txtColor: 'text-black' },
            { id: 26, type: 'prop', name: 'LÊ ĐẠI HÀNH', price: '$260', color: 'bg-yellow-400', txtColor: 'text-black' },
            { id: 25, type: 'station', name: 'BẾN XE<br>CHỢ LỚN', price: '$200', icon: '🛺' },
            { id: 24, type: 'prop', name: 'NGUYỄN<br>TRI PHƯƠNG', price: '$200', color: 'bg-red-600' },
            { id: 23, type: 'prop', name: 'KHA VẠN<br>CÂN', price: '$220', color: 'bg-red-600' },
            { id: 22, type: 'chance', name: 'CƠ HỘI', icon: '❓', iconClass: 'text-red-600' },
            { id: 21, type: 'prop', name: 'PHẠM<br>NGŨ LÃO', price: '$220', color: 'bg-red-600' }
        ];

        function renderCell(space) {
            let innerContent = '';
            let textColorClass = space.txtColor || 'text-white'; 

            if (space.type === 'prop') {
                innerContent = `
                    <div class="h-[25%] ${space.color} ${textColorClass} w-full shrink-0 flex items-center justify-center border-b border-black"></div>
                    <div class="flex-1 flex flex-col items-center justify-between p-1 text-center font-bold uppercase text-black">
                        <div class="cell-name mt-1">${space.name}</div>
                        <div class="cell-price mb-1">${space.price}</div>
                    </div>
                `;
            } else if (space.type === 'station') {
                innerContent = `
                    <div class="flex-1 flex flex-col items-center justify-start pt-1 sm:pt-2 px-1 text-center font-bold uppercase text-black">
                        <div class="cell-name mb-1">${space.name}</div>
                        <div class="text-lg sm:text-2xl">${space.icon}</div>
                        <div class="cell-price mt-auto mb-1">${space.price}</div>
                    </div>
                `;
            } else if (space.type === 'utility') {
                 innerContent = `
                    <div class="flex-1 flex flex-col items-center justify-start pt-1 sm:pt-2 px-1 text-center font-bold uppercase text-black">
                        <div class="cell-name mb-1">${space.name}</div>
                        <div class="text-xl sm:text-3xl">${space.icon}</div>
                        <div class="cell-price mt-auto mb-1">${space.price}</div>
                    </div>
                `;
            } else if (space.type === 'chance' || space.type === 'chest') {
                 innerContent = `
                    <div class="flex-1 flex flex-col items-center justify-center p-1 text-center font-bold uppercase text-black">
                        <div class="cell-name mb-1">${space.name}</div>
                        <div class="text-2xl sm:text-4xl ${space.iconClass}">${space.icon}</div>
                    </div>
                `;
            } else if (space.type === 'tax') {
                innerContent = `
                    <div class="flex-1 flex flex-col items-center justify-start pt-1 sm:pt-2 px-1 text-center font-bold uppercase text-black">
                        <div class="cell-name mb-1">${space.name}</div>
                        <div class="cell-desc mt-1 sm:mt-2">${space.desc}</div>
                    </div>
                `;
            }

            return `<div class="flex-1 bg-[#f4f7f6] flex flex-col box-border board-cell overflow-hidden">${innerContent}</div>`;
        }

        document.getElementById('bottom-row').innerHTML = bottomSpaces.map(renderCell).join('');
        document.getElementById('top-row').innerHTML = topSpaces.map(renderCell).join('');
        document.getElementById('left-col').innerHTML = leftSpaces.map(renderCell).join('');
        document.getElementById('right-col').innerHTML = rightSpaces.map(renderCell).join('');
    </script>
</body>
</html>
