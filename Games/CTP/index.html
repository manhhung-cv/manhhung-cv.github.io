<!DOCTYPE html>
<html lang="vi" class="h-full bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cờ Tỷ Phú Sài Gòn - Mobile OLED</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, 1fr));
    }
  </style>
</head>
<body class="h-full bg-black text-neutral-100 flex flex-col justify-between overflow-hidden">

  <!-- Top Bar: Thông số phòng & Người chơi -->
  <header class="bg-neutral-950 border-b border-neutral-900 px-3 py-2 shrink-0">
    <div class="flex items-center justify-between gap-2 max-w-md mx-auto">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-amber-500 text-black flex items-center justify-center font-black text-xs">
          SG
        </div>
        <div>
          <div class="text-[11px] font-black text-amber-400 tracking-wider">SÀI GÒN 9×9</div>
          <div class="text-[9px] text-neutral-500 font-semibold" id="hudTurnText">Vòng 1 • Lượt bạn</div>
        </div>
      </div>
      <!-- Danh sách người chơi rút gọn -->
      <div class="flex items-center gap-1.5" id="playersPills">
        <!-- Render động từ JS -->
      </div>
    </div>
  </header>

  <!-- Main Viewport: Bàn cờ 9x9 vừa khít khung nhìn -->
  <main class="flex-1 flex flex-col items-center justify-center px-2 py-1 max-w-md mx-auto w-full">
    <!-- Floating Toast Notification -->
    <div id="gameToast" class="fixed top-12 z-50 px-3 py-1 rounded-full bg-neutral-900/90 border border-neutral-700 text-[10px] font-bold text-amber-300 shadow-xl opacity-0 transition-all duration-300 pointer-events-none">
      Sẵn sàng!
    </div>

    <!-- Bàn cờ 9x9 thuần CSS (32 ô) -->
    <div class="w-full aspect-square max-h-[46vh] bg-neutral-950 border border-neutral-800 rounded-xl p-1 board-grid gap-0.5 relative shadow-2xl">
      <!-- Tâm bàn cờ -->
      <div class="col-start-2 col-end-9 row-start-2 row-end-9 bg-black rounded-lg flex flex-col items-center justify-center p-2 text-center border border-neutral-900/60 relative overflow-hidden">
        <div class="absolute inset-0 bg-radial from-neutral-900 to-transparent opacity-40"></div>
        <div id="diceDisplay" class="flex items-center gap-2 mb-1.5 z-10">
          <div id="dice1" class="w-8 h-8 rounded-lg bg-neutral-900 border border-neutral-700 flex items-center justify-center font-black text-amber-400 text-sm shadow">1</div>
          <div id="dice2" class="w-8 h-8 rounded-lg bg-neutral-900 border border-neutral-700 flex items-center justify-center font-black text-amber-400 text-sm shadow">2</div>
        </div>
        <div class="text-[10px] font-extrabold text-neutral-400 z-10" id="centerStatus">Lượt của bạn</div>
      </div>
      <!-- 32 Ô đất được tạo tự động -->
    </div>
  </main>

  <!-- Bottom Panel: Chi tiết ô & Cụm nút bấm ngữ cảnh (Dễ thao tác bằng 1 tay) -->
  <footer class="bg-neutral-950 border-t border-neutral-900 p-3 shrink-0 flex flex-col gap-2.5 max-w-md mx-auto w-full">
    <!-- Thẻ xem nhanh thông tin ô đất hiện tại -->
    <div id="tileCard" class="bg-black border border-neutral-800 rounded-xl p-2.5 flex items-center justify-between min-h-[54px]">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="cardGroupBadge" class="w-2.5 h-8 rounded-full bg-neutral-700 shrink-0"></div>
        <div class="min-w-0">
          <div id="cardTileName" class="text-xs font-bold text-white truncate">Chạm vào một ô để kiểm tra</div>
          <div id="cardTileDetail" class="text-[10px] text-neutral-400">Giá mua / Tiền thuê</div>
        </div>
      </div>
      <div class="text-right shrink-0">
        <div id="cardTilePrice" class="text-xs font-black text-amber-400">--</div>
        <div id="cardTileOwner" class="text-[9px] text-neutral-500 font-medium">Chưa ai sở hữu</div>
      </div>
    </div>

    <!-- Cụm hành động chính: 1 nút bấm đa năng to nhất -->
    <div class="flex items-center gap-2">
      <!-- Nút phụ: Nâng cấp nhà (khi đứng ở đất của mình) -->
      <button id="btnUpgrade" class="hidden px-4 py-3 bg-neutral-900 hover:bg-neutral-800 text-emerald-400 font-bold text-xs rounded-xl border border-emerald-900/40 active:scale-95 transition flex items-center justify-center gap-1.5 shrink-0">
        <i class="fa-solid fa-hotel"></i>
        <span>Xây (+<span id="upgradeCost">50</span>$)</span>
      </button>

      <!-- Nút chính: Tự động đổi trạng thái (Đổ Xúc Xắc / Mua Đất / Xong Lượt) -->
      <button id="btnMainAction" class="flex-1 py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-dice text-sm" id="btnMainIcon"></i>
        <span id="btnMainLabel">Đổ Xúc Xắc</span>
      </button>

      <!-- Nút bỏ qua (khi không muốn mua) -->
      <button id="btnSkip" class="hidden px-4 py-3.5 bg-neutral-900 text-neutral-400 font-bold text-xs rounded-xl border border-neutral-800 active:scale-95 transition shrink-0">
        Bỏ Qua
      </button>
    </div>
  </footer>

  <script>
    // Dữ liệu 32 ô chuẩn Sài Gòn
    const BOARD_TILES = [
      { index: 0, name: "BẮT ĐẦU", type: "GO", price: 0 },
      { index: 1, name: "Ng. Huệ", group: "#8D5B4C", type: "PROPERTY", price: 60 },
      { index: 2, name: "Khí Vận", type: "CHEST", price: 0 },
      { index: 3, name: "Lê Lợi", group: "#8D5B4C", type: "PROPERTY", price: 60 },
      { index: 4, name: "Thuế TN", type: "TAX", price: 100 },
      { index: 5, name: "BX Miền Tây", group: "#64748B", type: "PROPERTY", price: 200 },
      { index: 6, name: "Lương Đ.Của", group: "#38BDF8", type: "PROPERTY", price: 100 },
      { index: 7, name: "Hai Bà Trưng", group: "#38BDF8", type: "PROPERTY", price: 120 },
      { index: 8, name: "VÀO TÙ", type: "JAIL", price: 0 },
      { index: 9, name: "Tây Thạnh", group: "#F472B6", type: "PROPERTY", price: 140 },
      { index: 10, name: "Cơ Hội", type: "CHANCE", price: 0 },
      { index: 11, name: "An Dương Vương", group: "#F472B6", type: "PROPERTY", price: 160 },
      { index: 12, name: "Cty Điện", group: "#14B8A6", type: "PROPERTY", price: 150 },
      { index: 13, name: "BX Chợ Lớn", group: "#64748B", type: "PROPERTY", price: 200 },
      { index: 14, name: "Hậu Giang", group: "#FB923C", type: "PROPERTY", price: 180 },
      { index: 15, name: "Huỳnh Tấn Phát", group: "#FB923C", type: "PROPERTY", price: 200 },
      { index: 16, name: "ĐẬU XE", type: "PARK", price: 0 },
      { index: 17, name: "Kha Vạn Cân", group: "#EF4444", type: "PROPERTY", price: 220 },
      { index: 18, name: "Khí Vận", type: "CHEST", price: 0 },
      { index: 19, name: "Ng. Tri Phương", group: "#EF4444", type: "PROPERTY", price: 240 },
      { index: 20, name: "BX Cần Giuộc", group: "#64748B", type: "PROPERTY", price: 200 },
      { index: 21, name: "Lê Đại Hành", group: "#FACC15", type: "PROPERTY", price: 260 },
      { index: 22, name: "Hoàng Văn Thụ", group: "#FACC15", type: "PROPERTY", price: 280 },
      { index: 23, name: "Cơ Hội", type: "CHANCE", price: 0 },
      { index: 24, name: "ĐẾN TÙ", type: "GOTO_JAIL", price: 0 },
      { index: 25, name: "Cộng Hòa", group: "#22C55E", type: "PROPERTY", price: 300 },
      { index: 26, name: "Quang Trung", group: "#22C55E", type: "PROPERTY", price: 320 },
      { index: 27, name: "Cty Nước", group: "#14B8A6", type: "PROPERTY", price: 150 },
      { index: 28, name: "BX Miền Đông", group: "#64748B", type: "PROPERTY", price: 200 },
      { index: 29, name: "Thuế Cao Cấp", type: "TAX", price: 150 },
      { index: 30, name: "Lũy Bán Bích", group: "#3B82F6", type: "PROPERTY", price: 350 },
      { index: 31, name: "Tân Kỳ Tân Quý", group: "#3B82F6", type: "PROPERTY", price: 400 }
    ];

    // Trạng thái Game
    const state = {
      players: [
        { id: 0, name: "Bạn", isAI: false, money: 1500, pos: 0, color: "bg-emerald-500", pinText: "P1" },
        { id: 1, name: "Bot", isAI: true, money: 1500, pos: 0, color: "bg-rose-500", pinText: "AI" }
      ],
      currentTurn: 0,
      turnRound: 1,
      properties: {}, // { [tileIndex]: { owner: 0, level: 0 } }
      phase: 'ROLL',  // ROLL | DECISION | END_TURN
      isAnimating: false
    };

    // Hệ thống âm thanh Web Audio API đơn giản hóa
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, dur) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    // Xác định vị trí Grid 9x9 từ index (0-31)
    function getGridPos(idx) {
      if (idx >= 0 && idx <= 8) return { r: 9, c: 9 - idx };
      if (idx >= 8 && idx <= 16) return { r: 9 - (idx - 8), c: 1 };
      if (idx >= 16 && idx <= 24) return { r: 1, c: 1 + (idx - 16) };
      return { r: 1 + (idx - 24), c: 9 };
    }

    // Khởi tạo bàn cờ
    function buildBoard() {
      const board = document.querySelector('.board-grid');
      BOARD_TILES.forEach(tile => {
        const { r, c } = getGridPos(tile.index);
        const cell = document.createElement('div');
        cell.id = `cell-${tile.index}`;
        cell.style.gridRowStart = r;
        cell.style.gridColumnStart = c;

        const isCorner = [0, 8, 16, 24].includes(tile.index);
        cell.className = `border border-neutral-800 rounded p-0.5 flex flex-col justify-between relative cursor-pointer active:opacity-70 transition ${
          isCorner ? 'bg-neutral-900' : 'bg-neutral-950'
        }`;

        cell.innerHTML = `
          ${tile.group ? `<div class="w-full h-1 rounded-xs" style="background:${tile.group}"></div>` : ''}
          <div class="text-[7.5px] font-bold text-center leading-tight truncate text-neutral-300">${tile.name}</div>
          <div class="text-[7px] font-black text-amber-400 text-center">${tile.price ? '$' + tile.price : ''}</div>
          <div id="pawn-slot-${tile.index}" class="absolute inset-x-0 bottom-0.5 flex justify-center gap-0.5 pointer-events-none"></div>
          <div id="house-slot-${tile.index}" class="absolute top-1 right-0.5 flex gap-0.5 text-[6px] text-emerald-400"></div>
        `;

        cell.onclick = () => inspectTile(tile);
        board.appendChild(cell);
      });
      renderPawns();
      renderHUD();
    }

    function renderPawns() {
      BOARD_TILES.forEach(t => {
        const slot = document.getElementById(`pawn-slot-${t.index}`);
        if (slot) slot.innerHTML = '';
      });
      state.players.forEach(p => {
        const slot = document.getElementById(`pawn-slot-${p.pos}`);
        if (slot) {
          const pin = document.createElement('span');
          pin.className = `w-3 h-3 rounded-full ${p.color} text-black font-black text-[7px] flex items-center justify-center shadow`;
          pin.textContent = p.pinText;
          slot.appendChild(pin);
        }
      });
    }

    function renderHUD() {
      const container = document.getElementById('playersPills');
      container.innerHTML = '';
      state.players.forEach((p, idx) => {
        const isCurrent = idx === state.currentTurn;
        const pill = document.createElement('div');
        pill.className = `px-2 py-0.5 rounded-lg border text-[10px] flex items-center gap-1.5 transition ${
          isCurrent ? 'border-amber-400 bg-neutral-900' : 'border-neutral-800 bg-black opacity-60'
        }`;
        pill.innerHTML = `
          <span class="w-2 h-2 rounded-full ${p.color}"></span>
          <span class="font-bold text-neutral-300">${p.name}</span>
          <span class="font-black text-emerald-400">$${p.money}</span>
        `;
        container.appendChild(pill);
      });

      const curr = state.players[state.currentTurn];
      document.getElementById('hudTurnText').textContent = `Vòng ${state.turnRound} • Lượt của ${curr.name}`;
      document.getElementById('centerStatus').textContent = `Lượt: ${curr.name}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('gameToast');
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2200);
    }

    function inspectTile(tile) {
      document.getElementById('cardTileName').textContent = tile.name;
      document.getElementById('cardGroupBadge').style.backgroundColor = tile.group || '#525252';

      const prop = state.properties[tile.index];
      if (tile.type === 'PROPERTY') {
        const baseRent = Math.round(tile.price * 0.15);
        const rent = prop ? Math.round(baseRent * (1 + prop.level * 1.5)) : baseRent;
        document.getElementById('cardTileDetail').textContent = `Giá: $${tile.price} • Thuê: $${rent}`;
        document.getElementById('cardTilePrice').textContent = `$${tile.price}`;

        if (prop) {
          const owner = state.players[prop.owner];
          document.getElementById('cardTileOwner').textContent = `Chủ: ${owner.name} (${prop.level} nhà)`;
        } else {
          document.getElementById('cardTileOwner').textContent = "Chưa ai sở hữu";
        }
      } else {
        document.getElementById('cardTileDetail').textContent = tile.type;
        document.getElementById('cardTilePrice').textContent = tile.price ? `$${tile.price}` : '--';
        document.getElementById('cardTileOwner').textContent = '--';
      }
    }

    // Logic Đổ Xúc Xắc & Di chuyển từng bước mượt mà
    async function handleRoll() {
      if (state.isAnimating) return;
      state.isAnimating = true;

      const p = state.players[state.currentTurn];
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      const total = d1 + d2;

      // Hiệu ứng xúc xắc lướt nhanh
      for (let i = 0; i < 6; i++) {
        document.getElementById('dice1').textContent = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice2').textContent = Math.floor(Math.random() * 6) + 1;
        beep(240, 0.04);
        await new Promise(r => setTimeout(r, 60));
      }
      document.getElementById('dice1').textContent = d1;
      document.getElementById('dice2').textContent = d2;

      showToast(`${p.name} đổ được ${total} bước!`);

      // Di chuyển từng ô
      for (let i = 0; i < total; i++) {
        p.pos = (p.pos + 1) % 32;
        renderPawns();
        beep(480, 0.05);
        if (p.pos === 0) {
          p.money += 200;
          showToast(`${p.name} qua ô BẮT ĐẦU: +$200`);
          renderHUD();
        }
        await new Promise(r => setTimeout(r, 140));
      }

      state.isAnimating = false;
      resolveTileArrival(p);
    }

    // Xử lý sự kiện khi đáp chân vào ô
    function resolveTileArrival(player) {
      const tile = BOARD_TILES[player.pos];
      inspectTile(tile);

      if (tile.type === 'PROPERTY') {
        const prop = state.properties[tile.index];
        if (!prop) {
          // Ô trống có thể mua
          if (player.money >= tile.price) {
            if (player.isAI) {
              buyProperty(player, tile);
              setTimeout(endTurn, 600);
            } else {
              setContextButton('BUY', `Mua Đất ($${tile.price})`, tile);
            }
          } else {
            showToast(`${player.name} không đủ tiền mua đất`);
            autoNextTurn(player);
          }
        } else if (prop.owner !== player.id) {
          // Trả tiền thuê
          const rent = Math.round(tile.price * 0.15 * (1 + prop.level * 1.5));
          const owner = state.players[prop.owner];
          player.money -= rent;
          owner.money += rent;
          beep(160, 0.15);
          showToast(`${player.name} trả $${rent} tiền thuê cho ${owner.name}!`);
          renderHUD();
          autoNextTurn(player);
        } else {
          // Trúng đất của chính mình: hiện nút nâng cấp nếu chưa max
          if (!player.isAI && prop.level < 3) {
            checkUpgradePossibility(player, tile, prop);
          }
          autoNextTurn(player);
        }
      } else if (tile.type === 'TAX') {
        player.money -= tile.price;
        beep(140, 0.2);
        showToast(`${player.name} đóng phạt/thuế: -$${tile.price}`);
        renderHUD();
        autoNextTurn(player);
      } else if (tile.type === 'GOTO_JAIL') {
        player.pos = 8;
        renderPawns();
        showToast(`${player.name} bị tống vào tù!`);
        autoNextTurn(player);
      } else {
        autoNextTurn(player);
      }
    }

    function checkUpgradePossibility(player, tile, prop) {
      const cost = Math.round(tile.price * 0.5);
      if (player.money >= cost) {
        const btnUp = document.getElementById('btnUpgrade');
        document.getElementById('upgradeCost').textContent = cost;
        btnUp.classList.remove('hidden');
        btnUp.onclick = () => {
          player.money -= cost;
          prop.level++;
          btnUp.classList.add('hidden');
          beep(600, 0.1);
          renderHouseIcons(tile.index, prop.level);
          renderHUD();
          inspectTile(tile);
          showToast(`Đã nâng cấp ${tile.name} lên cấp ${prop.level}!`);
        };
      }
    }

    function renderHouseIcons(tileIdx, level) {
      const slot = document.getElementById(`house-slot-${tileIdx}`);
      if (slot) {
        slot.innerHTML = Array(level).fill('<i class="fa-solid fa-house"></i>').join('');
      }
    }

    function buyProperty(player, tile) {
      player.money -= tile.price;
      state.properties[tile.index] = { owner: player.id, level: 0 };
      beep(620, 0.15);
      showToast(`${player.name} đã sở hữu ${tile.name}!`);
      renderHUD();
      inspectTile(tile);
      resetContextButton();
    }

    function autoNextTurn(player) {
      if (player.isAI) {
        setTimeout(endTurn, 900);
      } else {
        setContextButton('END_TURN', 'Xong Lượt');
      }
    }

    // Nút bấm ngữ cảnh thông minh (Context Action)
    function setContextButton(mode, label, payload = null) {
      const btn = document.getElementById('btnMainAction');
      const icon = document.getElementById('btnMainIcon');
      const text = document.getElementById('btnMainLabel');
      const btnSkip = document.getElementById('btnSkip');

      text.textContent = label;

      if (mode === 'BUY') {
        btn.className = "flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2";
        icon.className = "fa-solid fa-cart-shopping";
        btnSkip.classList.remove('hidden');
        btnSkip.onclick = () => {
          btnSkip.classList.add('hidden');
          endTurn();
        };
        btn.onclick = () => {
          btnSkip.classList.add('hidden');
          buyProperty(state.players[state.currentTurn], payload);
          endTurn();
        };
      } else if (mode === 'END_TURN') {
        btn.className = "flex-1 py-3.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2";
        icon.className = "fa-solid fa-arrow-right";
        btnSkip.classList.add('hidden');
        btn.onclick = endTurn;
      }
    }

    function resetContextButton() {
      const btn = document.getElementById('btnMainAction');
      const icon = document.getElementById('btnMainIcon');
      const text = document.getElementById('btnMainLabel');
      const btnSkip = document.getElementById('btnSkip');
      const btnUp = document.getElementById('btnUpgrade');

      btnSkip.classList.add('hidden');
      btnUp.classList.add('hidden');
      btn.className = "flex-1 py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2";
      icon.className = "fa-solid fa-dice";
      text.textContent = "Đổ Xúc Xắc";
      btn.onclick = handleRoll;
    }

    function endTurn() {
      resetContextButton();
      state.currentTurn = (state.currentTurn + 1) % state.players.length;
      if (state.currentTurn === 0) state.turnRound++;

      renderHUD();
      const curr = state.players[state.currentTurn];

      if (curr.isAI) {
        document.getElementById('btnMainAction').classList.add('opacity-40', 'pointer-events-none');
        setTimeout(handleRoll, 1000);
      } else {
        document.getElementById('btnMainAction').classList.remove('opacity-40', 'pointer-events-none');
      }
    }

    window.onload = () => {
      buildBoard();
      resetContextButton();
      inspectTile(BOARD_TILES[0]);
    };
  </script>
</body>
</html>
